name: sync-game

# 注意：index.html 现在由 src/ 构建生成（node tools/build.mjs）。
# 自动同步会用线上站点覆盖构建产物，因此改为仅手动触发，且需要明确确认。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 YES 才会用线上站点覆盖 index.html'
        required: true
        default: 'NO'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'YES' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download latest game
        run: curl -fsSL "https://slipper-survivor-2.app.workbuddy.host/" -o index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- index.html)" ]; then
            echo "game unchanged"
          else
            git add index.html
            git commit -m "chore: sync slipper-survivor from live site"
            git push
          fi
