<script>
(function(){
'use strict';

/* =========================================================
   0. 基础工具
   ========================================================= */
const $ = id => document.getElementById(id);
const stage = $('stage');
const cvs = $('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 640, H = 360;
const ARENA = { w: 1720, h: 1000 };

const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const pickOne = a => a[Math.floor(Math.random() * a.length)];

function dist(ax, ay, bx, by){ const dx = ax - bx, dy = ay - by; return Math.sqrt(dx*dx + dy*dy); }

/* =========================================================
   1. 像素精灵
   ========================================================= */
function makeSprite(rows, pal){
  const h = rows.length;
  const w = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for(let y = 0; y < h; y++){
    const row = rows[y];
    const off = Math.floor((w - row.length) / 2);
    for(let x = 0; x < row.length; x++){
      const col = pal[row[x]];
      if(!col) continue;
      g.fillStyle = col;
      g.fillRect(x + off, y, 1, 1);
    }
  }
  return c;
}
function whiteOf(img){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
function reg(rows, pal){
  const img = makeSprite(rows, pal);
  return { img, white: whiteOf(img), w: img.width, h: img.height };
}
/* =========================================================
   4.1 统一战斗经济（Economy）
   ---------------------------------------------------------
   4.1 的目标不是"再调一遍数值"，而是**减少规则的数量**。
   玩家能心算的只有三句话，整个平衡必须能塞进这三句话里：

     1) 怪咬你 = 它的伤害 × (1 − 你的护甲)。被几只围就吃几口。
     2) 你的护甲 = A / (A + 58)。A 越高越贵，但永远还有效果。
     3) 冷却 = 基础间隔 × 冷却倍率。没有"攻速"这个第二套说法。

   为此 4.1 删掉了 4.0 里那些"看起来很聪明、玩起来读不懂"的东西：

     · 夹击（被 3 只以上贴身 ×1.35）
     · 被围递减 crowdW（第 2 只 64%、第 3 只 41%……）
     · 控制减伤（眩晕 ×0.35 / 冰缓 ×0.6 / 燃烧 ×0.72 / 减速 ×0.8）
     · 韧性 / 破韧（打空韧性条 → 破防 +45% 易伤）
     · 独立免伤 hurtTaken（和护甲并行的第二个减伤数字）
     · 格挡 / 护盾期减伤 / 宠物挡刀（都是换名字的免伤）

   它们全被两件事替换：
     · **怪更疼**（接触伤害按怪自己的伤害直接结算，不再有任何修正系数）
     · **护甲更硬**（所有防御来源都折算成护甲点数，走同一条曲线）

   规则少了，能塞进数值里的"手感"反而更多：
   被 3 只围住现在是 3 份伤害，被 8 只围住就是 8 份——
   压力直接、可读，而且冲刺/走位的价值一眼就能看出来。
   ========================================================= */

const ECO = {
  T: 600,                  /* 一局的基准时长（10 分钟终局 BOSS） */

  /* --- 参考玩家：一条固定曲线，与玩家实际数值无关 --- */
  refHp0: 300,
  refHp1: 660,

  /* =========================================================
     5.0 攻击曲线：1 → 2.45（600 秒），线性
     ---------------------------------------------------------
     4.x 的曲线是 1 → 8.65（二次项 5.2）。它把"后期变凶"全压在后半程，
     配上一串很小的基础伤害（史莱姆 7），结果就是：
       · 开局 300 血挨一下掉 6 点，要挨 50 下才会死
       · 10 分钟时同样一口变成 60 点——曲线在替数值背锅

     伤害就该是绝对值，成长交给**两件事**：
       1) 基础伤害定在"打在身上看得见"的量级（杂兵 25~30，重甲 55~65）
       2) 曲线只跟到 2.45 倍，正好对应玩家生命 300 → 700 的自然成长，
          于是"一口占多少血"从第 1 分钟到第 10 分钟基本恒定在 8%~10%

     这就是数值设计该有的样子：绝对伤害 + 平缓曲线，
     而不是一个陡到必须靠小基础伤害来兜底的指数。
     ========================================================= */
  atkC0: 1.00,
  atkC1: 2.05,
  atkC2: 0.00,

  /* --- 护甲：全游戏唯一的减伤。A=40 → 41%，A=80 → 58%，A=160 → 73%。
     永远涨、永远不封顶，也就不需要"护甲上限 42%"这种东西。 --- */
  armorK: 58,

  /* --- 接触伤害：碰到就掉血，然后有一段很短的"受伤间隔"。
     ---------------------------------------------------------
     这里参考的是同类肉鸽的标准做法（土豆兄弟 / 吸血鬼幸存者 / 哈迪斯）：
       · 怪**没有自己的攻击冷却** —— 贴上来就结算；
       · 节奏来自**玩家侧的受伤间隔**（0.45 秒），不是每只怪各自计时；
       · 一次结算 = Σ(贴身怪的 dmg) × contactTickMul，再过护甲。

     为什么不是"逐帧流血"：那是 DPS，血条平滑地掉，玩家感知不到"我挨了"，
     也没法用冲刺去卡节奏。为什么不是"7 秒一口"：那就变成怪在发呆。
     0.45 秒既能让被围时数字"啪"地跳，又留得出一次冲刺的反应窗口。 --- */
  contactTick: 1.10,       /* 受伤间隔（秒）：两次接触结算之间至少隔这么久 */
  /* 【5.0】0.45 → 1.10 秒，并取消 0.72 的折扣。
     ---------------------------------------------------------
     旧组合是"0.45 秒一跳 + 每跳打七折"，本质是为了压住"被几只围就吃几份"
     这条加法。折扣取消之后，节奏必须整体放慢，否则每秒承受的伤害会翻倍。
     慢下来的好处是：每一次接触都能被看见、被躲开，而不是血条平滑地流。 */
  contactTickMul: 1.00,

  /* --- 治疗：真正的令牌桶（见 50-state 的 drawHealPool）。 --- */
  /* 【5.0】0.28% → 0.70% / 秒。
     4.x 那 0.28% 从来没有真正生效（效率公式不收敛，实测放行 1%/秒以上），
     所以它既是"没限制"，又是"限制了也没人知道"。
     现在桶是真的，这个数就是**持续治疗的上限**：
       0.70%/秒 = 一口杂兵（约 8%）需要 11 秒才能补回来
     于是"堆治疗"变成一种可以算的构筑：堆到 2 倍预算才有明显手感，
     而它永远追不上持续挨打 —— 这正是治疗该有的位置。
     额外的爆发空间由 healRefill（桶回补速度）与拾取血包承担。 */
  healBudget: 0.0050,
  healRefill: 1.20,
  healTau: 0.5,

  /* 【4.2】灵光（擦弹）已删除。
     它的本意是"贴着弹幕走有奖励"，但玩家根本读不出来自己在攒什么，
     也从来没有为了它改变过一次操作——用户原话："完全搞不懂，没用就删了"。
     暴击与资源的成长现在全部走看得见的东西：结晶、遗物、护甲。 */

  /* --- 冲刺 ---
     4.1：距离 138 → 96、无敌 0.34 → 0.22。
     4.0 的冲刺太长太安全，等于一个免费的位移技能，走位反而不重要了。
     缩短之后它变成"卡一下身位"的工具，而不是"穿墙"。
     两段充能保留：被围时至少要能连闪两次。 --- */
  dashCharges: 2,
  /* 【4.1】2.3s → 3.6s。两段充能 + 2.3 秒回复，等于"随时都有一次冲刺"，
     冲刺从"资源"退化成了"按键"。拉长之后，什么时候用掉第一段、
     要不要留着第二段解围，才成为一个需要想一下的决定。
     配套件（速充 -35%、踏风结晶 -8%/级）把上限拉回来。 */
  dashRecharge: 3.6,
  dashDist: 96,
  dashTime: 0.12,
  dashIvy: 0.22,
  dashFlow: 1.6,           /* 冲刺后「顺势」时长 */
  dashFlowDmg: 0.30,       /* 顺势期间伤害加成 */
  dashImpactR: 54,         /* 冲刺途中撞到敌人的判定半径 */
  dashImpactMul: 1.20      /* 撞击伤害 = 武器平均伤害 × 这个系数（见 66-ai.js） */
};

/* 归一化进度 p：0 → 1 是 10 分钟，允许超过 1（无尽模式） */
function stageP(t){
  const tt = Math.max(0, t || 0);
  return Math.min(2.4, tt / ECO.T);
}

/* 敌人攻击强度：一条纯曲线，没有任何 clamp 以外的截断。
   t=0 → 1.00，t=120 → 1.51，t=300 → 2.56，t=600 → 5.10，t=900 → 9.6 */
function atkCurve(t){
  const p = stageP(t);
  return ECO.atkC0 + ECO.atkC1 * p + ECO.atkC2 * p * p;
}

/* 参考生命曲线：只用来决定"一次攻击有多疼"，不参与玩家实际减伤 */
function refHpAt(t){
  const p = Math.min(1.9, stageP(t));
  return ECO.refHp0 + (ECO.refHp1 - ECO.refHp0) * Math.pow(p, 0.88);
}

/* 护甲点数 → 减伤比例（边际递减，无封顶）。全游戏唯一的减伤公式。 */
function armorDR(pts){
  const a = Math.max(0, pts || 0);
  return a / (a + ECO.armorK);
}
function armorPts(dr){
  /* 反解：给"按百分比写的防御来源"换算回点数 */
  const d = Math.min(0.95, Math.max(0, dr || 0));
  return d >= 0.999 ? 1e6 : ECO.armorK * d / (1 - d);
}

/* 治疗软预算：效率 = 1 / (1 + 近期回血速度 / 预算速度)。
   没有硬上限，只有越来越贵；停止触发之后 0.5 秒内恢复满效率。 */
function healEff(){
  if(typeof state === 'undefined' || !state || !P) return 1;
  const budget = Math.max(1, P.maxHp * ECO.healBudget);
  return 1 / (1 + (state.healRate || 0) / budget);
}
function healRateAdd(give, dt){
  const d = Math.max(0.002, dt || (1 / 60));
  const k = Math.exp(-d / ECO.healTau);
  state.healRate = (state.healRate || 0) * k + (give / d) * (1 - k);
}
function healRateDecay(dt){
  const d = Math.max(0.0001, dt || (1 / 60));
  state.healRate = (state.healRate || 0) * Math.exp(-d / ECO.healTau);
}

/* 多个闪避来源 → 一个总闪避率：按"每次都独立躲一次"的乘法合并。
   闪避不是"免伤"，它是"没被打到"——命中判定根本没发生，
   所以它不走护甲那条曲线，也不会和护甲叠成一个数字。
   两个 20% 是 36% 而不是 40%，十个也不会变成 200%，天然收敛。 */
function avoidStack(list){
  let miss = 1;
  for(let i = 0; i < list.length; i++){
    const d = Math.max(0, Math.min(0.92, list[i] || 0));
    miss *= (1 - d);
  }
  return 1 - miss;
}

/* ---------------- 威胁预算（刷怪经济） ----------------
   每只怪有一个**威胁成本**，刷怪器每秒拿到一笔预算，买什么由它决定。
   加一种新怪，只需要给它定价 —— 不用再动"每波几只"那张表。 */
function unitThreat(def, type){
  if(!def) return 1;
  let v = 0;
  v += (def.hp || 10) * 0.26;
  /* 【5.0】伤害量级从 7 涨到 26 之后，威胁定价的权重必须同步缩小，
     否则每只怪在刷怪预算里会贵 2.6 倍 —— 场上怪少一半，
     玩家清得少、经验少、等级低，最后死于"等级跟不上"而不是死于难度。
     （这里踩过一次：只改伤害不改定价，五个角色的选卡次数从 30+ 掉到 6。） */
  v += (def.dmg || 5) * 0.42;
  v += (def.spd || 20) * 0.16;
  if(def.shot) v += 26 + (def.shot.mul || 0.8) * 10;
  if(def.armor) v += def.armor * 120;
  if(def.tank) v += 14;
  if(def.ai === 'spawner') v += 60;
  if(type === 'ant') v *= 0.55;
  return Math.max(0.6, v / 20);
}

/* 每秒刷怪预算：t=0 → 3.0，t=300 → 17，t=600 → 35 */
function spawnBudget(t){
  const p = Math.min(2.4, Math.max(0, t) / ECO.T);
  return 3.0 + 12.0 * p + 20 * p * p;
}

/* 远程配额：不是"最多 8 只"，而是"远程威胁不得超过全场的 38%"。 */
function rangedThreatShare(){
  let r = 0, all = 0;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(!e || e.dead) continue;
    const c = e.threat || 1;
    all += c;
    if(e.shot) r += c;
  }
  return all > 0 ? r / all : 0;
}

/* ---------------- 冲刺 ----------------
   4.1 把冲刺做成了一个有配套的可养成机制：
     · 疾影靴 / 疾风符：多一段 / 更快回满
     · 破风：冲刺撞到敌人造成伤害
     · 余势：顺势更长更狠
   冲刺本身只是一个"位移 + 短无敌"，强度全部挂在这些配件上。 */
function dashMaxNow(){
  return ECO.dashCharges + ((typeof ST !== 'undefined' && ST && ST.dashExtra) || 0);
}
function dashRechargeNow(){
  const m = (typeof ST !== 'undefined' && ST && ST.dashCd) || 1;
  return ECO.dashRecharge * Math.max(0.35, m);
}
function dashFlowNow(){
  return ECO.dashFlow + ((typeof ST !== 'undefined' && ST && ST.dashFlowBonus) || 0);
}
function dashFlowDmgNow(){
  return ECO.dashFlowDmg + ((typeof ST !== 'undefined' && ST && ST.dashDmgBonus) || 0);
}
function dashReady(){
  return P && (P.dashCharge || 0) >= 1 && !(P.dashT > 0) && state.mode === 'playing';
}
function startDash(dx, dy){
  if(!dashReady()) return false;
  let l = Math.hypot(dx, dy);
  if(l < 0.01){ dx = P.facing >= 0 ? 1 : -1; dy = 0; l = 1; }
  dx /= l; dy /= l;
  P.dashCharge -= 1;
  P.dashT = ECO.dashTime;
  P.dashVx = dx; P.dashVy = dy;
  P.dashHitSet = null;
  P.invuln = Math.max(P.invuln, ECO.dashIvy);
  P.dashTrail = [];
  P.flow = dashFlowNow();
  sfx('whoosh');
  for(let i = 0; i < 8; i++){
    burst(P.x - dx * i * 4, P.y - dy * i * 4, '#9fe8ff', 1, 40, 0);
  }
  if(rings.length < 30){
    rings.push({ x:P.x, y:P.y, r0:4, r1:26, life:0.18, max:0.18, col:'#9fe8ff', w:2 });
  }
  return true;
}
function dashTick(dt){
  if(!P) return;
  const dmax = dashMaxNow();
  if(P.dashCharge === undefined) P.dashCharge = dmax;
  if(P.dashCharge < dmax){
    P.dashCharge = Math.min(dmax, P.dashCharge + dt / dashRechargeNow());
  }
  if(P.flow > 0) P.flow = Math.max(0, P.flow - dt);
  if(P.dashT > 0){
    P.dashT -= dt;
    const sp = ECO.dashDist / ECO.dashTime;
    const nx = clamp(P.x + P.dashVx * sp * dt, 14, ARENA.w - 14);
    const ny = clamp(P.y + P.dashVy * sp * dt, 14, ARENA.h - 14);
    P.x = nx; P.y = ny;
    dashImpact();
    if(!P.dashTrail) P.dashTrail = [];
    P.dashTrail.push({ x:P.x, y:P.y, t:0.26 });
    if(P.dashTrail.length > 10) P.dashTrail.shift();
    if(Math.random() < 0.8) burst(P.x, P.y, '#7ce3ff', 1, 30, 0);
  }
  if(P.dashTrail){
    for(let i = P.dashTrail.length - 1; i >= 0; i--){
      P.dashTrail[i].t -= dt;
      if(P.dashTrail[i].t <= 0) P.dashTrail.splice(i, 1);
    }
  }
}

/* 破风：冲刺撞到敌人造成伤害。
   伤害跟着"你当前最强那把武器"走，所以后期依然有用，
   不需要再给它单独写一条成长曲线。 */
function dashImpact(){
  const tier = (typeof ST !== 'undefined' && ST && ST.dashImpact) || 0;
  if(tier <= 0) return;
  if(!P.dashHitSet) P.dashHitSet = new Set();
  const r = ECO.dashImpactR;
  const base = dashImpactDmg();
  eachNear(P.x, P.y, r, function(e){
    if(!e || e.dead || P.dashHitSet.has(e.id)) return;
    P.dashHitSet.add(e.id);
    dealDamage(e, base * (1 + 0.55 * (tier - 1)), { src:'dash' });
    burst(e.x, e.y, '#9fe8ff', 5, 110, 0);
    if(rings.length < 30) rings.push({ x:e.x, y:e.y, r0:3, r1:18, life:0.16, max:0.16, col:'#9fe8ff', w:2 });
  });
  if(state.shake < 2) state.shake = 2;
}
function dashImpactDmg(){
  if(!P) return 20;
  let best = 0;
  for(const id in P.weapons){
    const w = (typeof WEAPONS !== 'undefined') ? WEAPONS[id] : null;
    if(!w || !w.stats) continue;
    try{
      const st = w.stats(P.weapons[id]);
      if(st && st.dmg > best) best = st.dmg;
    }catch(e){ /* 数据写错不该让整局崩掉 */ }
  }
  return Math.max(24, best * ECO.dashImpactMul);
}
/* =========================================================
   1.5 内核 · 事件总线
   ---------------------------------------------------------
   所有武器 / 角色 / 遗物只做两件事：发事件、听事件。
   组合不是写死的配方，而是监听者叠加出来的结果。
   为了不被"暴击→雷→击杀→爆炸→击杀..."打成死循环：
     - 递归深度上限 4 层
     - 每帧对 kill / reaction / boom 设预算，超了就静默丢弃
   ========================================================= */
const EV = {
  h: Object.create(null),
  depth: 0,
  maxDepth: 4,
  budget: Object.create(null),
  count: Object.create(null)      /* 调试统计 */
};

function on(evt, fn){
  (EV.h[evt] || (EV.h[evt] = [])).push(fn);
  return fn;
}

function emit(evt, a, b){
  const arr = EV.h[evt];
  if(arr === undefined || arr.length === 0) return;
  if(EV.depth >= EV.maxDepth) return;
  EV.depth++;
  EV.count[evt] = (EV.count[evt] || 0) + 1;
  for(let i = 0; i < arr.length; i++) arr[i](a, b);
  EV.depth--;
}

/* 预算：返回 true 表示这次还能触发 */
function spend(kind, n){
  const v = EV.budget[kind];
  if(v === undefined) return true;
  if(v <= 0) return false;
  EV.budget[kind] = v - (n || 1);
  return true;
}

function resetBudget(){
  EV.budget.kill = 30;
  /* 反应预算从 22 降到 10：22/帧 × 60fps = 1320 次/秒，
     每一次还要溅射一圈，这是"后期一帧几百次结算"的主要来源。
     10/帧（600 次/秒）对任何构筑都绰绰有余，但不会再失控。 */
  EV.budget.react = 22;
  EV.budget.boom = 12;
  EV.budget.summon = 8;
  EV.budget.crit = 120;
  /* 弹射预算：弹射是"伤害扩散"，不是免费的触发倍增器 */
  EV.budget.chain = 18;
  EV.depth = 0;
}

/* 清空监听（重开一局时调用，避免上一局的闭包残留） */
function clearBus(){
  EV.h = Object.create(null);
  EV.count = Object.create(null);
  resetBudget();
}

/* =========================================================
   1.6 空间网格：把 O(n²) 的邻居查询压成 O(n)
   ========================================================= */
const GRID = { cell: 44, cols: 0, rows: 0, cells: [] };

function gridInit(){
  GRID.cols = Math.ceil(ARENA.w / GRID.cell) + 2;
  GRID.rows = Math.ceil(ARENA.h / GRID.cell) + 2;
  GRID.cells = new Array(GRID.cols * GRID.rows);
  for(let i = 0; i < GRID.cells.length; i++) GRID.cells[i] = [];
}

function gridBuild(){
  if(!GRID.cells.length) gridInit();
  const cells = GRID.cells;
  for(let i = 0; i < cells.length; i++) if(cells[i].length) cells[i].length = 0;
  const cell = GRID.cell, cols = GRID.cols, rows = GRID.rows;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    let cx = (e.x / cell) | 0, cy = (e.y / cell) | 0;
    if(cx < 0) cx = 0; else if(cx >= cols) cx = cols - 1;
    if(cy < 0) cy = 0; else if(cy >= rows) cy = rows - 1;
    cells[cy * cols + cx].push(e);
  }
}

/* 遍历半径内的敌人（回调式，不分配数组） */
function eachNear(x, y, r, fn){
  if(!GRID.cells.length){ for(let i = 0; i < enemies.length; i++) fn(enemies[i]); return; }
  const cell = GRID.cell, cols = GRID.cols;
  const x0 = Math.max(0, ((x - r) / cell) | 0), x1 = Math.min(GRID.cols - 1, ((x + r) / cell) | 0);
  const y0 = Math.max(0, ((y - r) / cell) | 0), y1 = Math.min(GRID.rows - 1, ((y + r) / cell) | 0);
  for(let cy = y0; cy <= y1; cy++){
    for(let cx = x0; cx <= x1; cx++){
      const arr = GRID.cells[cy * cols + cx];
      for(let i = 0; i < arr.length; i++){
        const e = arr[i];
        if(e.dead) continue;
        const dx = e.x - x, dy = e.y - y;
        if(dx * dx + dy * dy <= (r + e.r) * (r + e.r)) fn(e);
      }
    }
  }
}

/* 半径内计数（判断该不该放技能） */
function countNear(x, y, r){
  let n = 0;
  eachNear(x, y, r, function(){ n++; });
  return n;
}

/* =========================================================
   1.7 元素状态与反应
   ========================================================= */
const ELEM_COL = {
  fire:  '#ff8a3d',
  ice:   '#8fe8ff',
  venom: '#a6e05a',
  volt:  '#ffe066'
};
const ELEM_NAME = { fire:'燃烧', ice:'冰缓', venom:'中毒', volt:'感电' };

function stInit(e){
  if(!e.st) e.st = { fire:0, fireDmg:0, ice:0, venom:0, venomDmg:0, volt:0, reactCd:0, bleed:0, bleedDmg:0 };
  return e.st;
}

/* 给敌人挂元素。dur = 持续秒数，hit = 触发这次元素的伤害（用来换算 DOT 与反应威力） */
function applyElem(e, elem, dur, hit, src){
  if(!e || e.dead || !elem) return;
  const st = stInit(e);
  const h = hit || 10;
  /* 元素使：元素持续时间 +50% */
  if(relic('elementalist')) dur *= 1.5;
  if(st.reactCd > 0){                        /* 刚反应过，短时间内不再连锁，防爆炸式递归 */
    if(elem === 'fire'){ st.fire = Math.max(st.fire, dur * 0.5); }
    return;
  }
  if(elem === 'fire'){
    st.fire = Math.max(st.fire, dur);
    st.fireDmg = Math.max(st.fireDmg, h * 0.30);
  } else if(elem === 'ice'){
    /* 冷冻Ⅱ：冻结（冰缓）时长 +1 秒 */
    st.ice = Math.max(st.ice, dur + (ST.freezeTier >= 2 ? 1 : 0));
    /* 控制递减：首次附着给完整时长，之后每次刷新最多只续 0.2 秒。
       原来每次都是 Math.max(slowT, 1.6)，而后期命中频率是每秒几十次，
       等于把减速永久钉死在 1.6 秒——现在只要停手 0.2 秒就会解控。 */
    const durCap = Math.min(1.6, dur);
    e.slowT = e.slowT > 0 ? Math.min(durCap, e.slowT + 0.2) : durCap;
  } else if(elem === 'venom'){
    st.venom = Math.max(st.venom, dur);
    st.venomDmg = Math.max(st.venomDmg, h * 0.24);
  } else if(elem === 'volt'){
    st.volt = Math.max(st.volt, dur);
  }
  react(e, elem, h, src);
}

/* 元素反应：冰+火 融化 / 毒+火 毒爆 / 冰+电 超导 / 毒+电 导电 */
/* 溅射上限：一次反应最多影响 6 个目标。
   以前是"半径内有多少打多少"，318 只怪堆在一起时一次反应就结算 300 次伤害，
   再叠上弹射就是后期一帧几百次结算、直接卡死的来源。 */
function splashHit(x, y, radius, dmg, src, after){
  let n = 0;
  eachNear(x, y, radius, function(o){
    if(o.dead || n >= 28) return;
    n++;
    dealDamage(o, dmg, { src: src || 'react' });
    if(after) after(o);
  });
  return n;
}

function react(e, elem, hit, src){
  const st = e.st;
  let kind = null;
  if(elem === 'fire' && st.ice > 0) kind = 'melt';
  else if(elem === 'ice' && st.fire > 0) kind = 'melt';
  else if(elem === 'fire' && st.venom > 0) kind = 'toxblast';
  else if(elem === 'venom' && st.fire > 0) kind = 'toxblast';
  else if(elem === 'volt' && st.ice > 0) kind = 'superconduct';
  else if(elem === 'ice' && st.volt > 0) kind = 'superconduct';
  else if(elem === 'volt' && st.venom > 0) kind = 'conduct';
  else if(elem === 'venom' && st.volt > 0) kind = 'conduct';
  if(!kind) return;
  if(!spend('react')) return;

  /* 元素使：反应不再有连锁冷却（0.14 → 0.04） */
  st.reactCd = relic('elementalist') ? 0.04 : 0.14;
  /* 【设计修正】这里原来是"厨师 1.0 倍 + 有溅射 / 其它角色 0.45 倍 + 只打单体"。
     用同一个机制的不同数字去区分角色，是最偷懒的做法：玩家只会觉得"我这个角色被削了"。
     现在改成：**所有角色都能打出完整反应与溅射**，强度靠"抽得到多少元素、怎么组合"来分，
     厨师拿到的是别人没有的机制（反应传染），而不是一个更高的系数。 */
  const splash = true;
  const master = !!(CHAR && CHAR.reactionMaster);
  /* 融化冲击：反应伤害 +50% */
  const surge = relic('meltsurge') ? 1.5 : 1;
  const mul = (REACT_MUL[kind] || 1) * (master ? 1.30 : 1) * surge * (archTier('elem') >= 2 ? 1.20 : 1);
  /* 反应伤害原来是"触发伤害 ×1.15"，还要再溅射一圈 55%~60%。
     等于元素构筑白拿一发群体版自己的主武器，结算面板里反应常年第一，
     武器反而像配件。现在降到 ×0.55：反应负责控场 / 清残血 / 连接。 */
  const base = Math.max(10, (hit || 10) * 0.95) * mul;

  if(kind === 'melt'){
    st.ice = 0; st.fire = 0; e.slowT = 0;
    burst(e.x, e.y, '#ffd0a0', 14, 150);
    rings.push({ x:e.x, y:e.y, r0:10, r1:46, life:0.28, max:0.28, col:'#ffcf7a', w:3 });
    if(splash) splashHit(e.x, e.y, 34 * (archTier('elem') >= 3 ? 1.3 : 1), base * 0.32, src);
    dealDamage(e, base, { src: src || 'react' });
    addText(e.x, e.y - 12, '融化', '#ffcf7a', 10);
  } else if(kind === 'toxblast'){
    st.venom = 0; st.fire = 0;
    burst(e.x, e.y, '#b6ff6b', 16, 170);
    rings.push({ x:e.x, y:e.y, r0:8, r1:58, life:0.3, max:0.3, col:'#a6e05a', w:3 });
    dealDamage(e, base, { src: src || 'react' });
    if(splash) splashHit(e.x, e.y, 45 * (archTier('elem') >= 3 ? 1.3 : 1), base * 0.36, src, function(o){
      if(o !== e) applyElem(o, 'venom', 2.2, base * 0.2, src);
    });
    addText(e.x, e.y - 12, '毒爆', '#b6ff6b', 10);
  } else if(kind === 'superconduct'){
    st.ice = 0; st.volt = 0;
    burst(e.x, e.y, '#a8d8ff', 16, 190);
    rings.push({ x:e.x, y:e.y, r0:8, r1:64, life:0.3, max:0.3, col:'#9fe8ff', w:3 });
    dealDamage(e, base, { src: src || 'react' });
    if(splash) splashHit(e.x, e.y, 50 * (archTier('elem') >= 3 ? 1.3 : 1), base * 0.36, src, function(o){
      if(o !== e) o.slowT = Math.max(o.slowT || 0, 0.6);
    });
    addText(e.x, e.y - 12, '超导', '#9fe8ff', 10);
  } else {
    st.venom = 0; st.volt = 0;
    burst(e.x, e.y, '#d6ff7a', 12, 150);
    dealDamage(e, base, { src: src || 'react' });
    if(splash) splashHit(e.x, e.y, 40, base * 0.30, src);
    addText(e.x, e.y - 12, '导电', '#d6ff7a', 10);
  }

  /* 厨师独有：反应会"传染"——把这次参与反应的两种元素泼到周围 2 个敌人身上。
     【2.6】传染不能再链式：传染出去的那次 applyElem 用 src='react'，
     这里据此拒收，否则 A 传染 B、B 又传染 C，一次反应会自己长成一片森林，
     正是"选了弹射之后一帧几百次结算"的另一半来源。 */
  if(master && src !== 'react'){
    let spread = 0;
    eachNear(e.x, e.y, 88, function(o){
      if(o === e || o.dead || spread >= 2) return;
      spread++;
      const elem2 = (kind === 'melt') ? 'fire'
                  : (kind === 'toxblast') ? 'venom'
                  : (kind === 'superconduct') ? 'ice' : 'volt';
      applyElem(o, elem2, 1.8, base * 0.18, 'react');
    });
    if(spread) addText(e.x, e.y - 26, '传染 ×' + spread, '#ff8a3d', 9);
  }

  emit('reaction', { e, kind, dmg: base, src: src || 'react' });
  sfx(kind === 'melt' ? 'melt' : (kind === 'toxblast' ? 'toxblast' : (kind === 'superconduct' ? 'superconduct' : 'conduct')));
  /* 反应不震屏：一场战斗触发几百次，是"一直抖"的主要来源之一 */
}

/* 元素反应的全局倍率（遗物可以改） */
const REACT_MUL = { melt: 1, toxblast: 1, superconduct: 1, conduct: 1 };

/* 元素对已经被同元素"浸透"的目标不再重复反应，避免刷屏 */
function elemOnHit(e, list, power, src){
  if(!list || !list.length) return;
  /* 【2.6 修复】一把武器同时改造了燃 / 冰 / 毒 / 电时，原来这里 for 循环
     把 4 种元素全部挂上——一次命中就凑齐所有反应对。玩家看到的现象就是
     "只要元素触发一次，下一发必定全触发"。
     现在一次命中最多挂 1 种：优先挂目标身上还没有的那种元素。 */
  let pick = null;
  for(let i = 0; i < list.length; i++){
    const el = list[i];
    if(e.st && e.st[el] > 0) continue;
    pick = el;
    break;
  }
  if(!pick) pick = list[0];
  applyElem(e, pick, 2.4, power, src);
}

/* 跳弹沿用的是"原武器"的伤害来源，这样改造卡和流派加成仍然生效 */
function dmgSrcForRicochet(src){
  return (src && WEAPONS[src]) ? src : 'relic';
}

/* 消耗目标身上的任意状态，返回是否消耗成功（引爆用） */
function consumeAny(e, src){
  const st = e.st;
  if(!st) return false;
  if(st.venom > 0){ st.venom = 0; return true; }
  if(st.fire > 0){ st.fire = 0; return true; }
  if(st.ice > 0){ st.ice = 0; return true; }
  if(st.volt > 0){ st.volt = 0; return true; }
  return false;
}

/* 蔓延：把燃烧 / 中毒传给附近两个敌人 */
function spreadStatus(e, src){
  if(!e.st) return;
  const el = e.st.fire > 0 ? 'fire' : (e.st.venom > 0 ? 'venom' : null);
  if(!el) return;
  let n = 0;
  eachNear(e.x, e.y, 90, function(o){
    if(o === e || o.dead || n >= 2) return;
    n++;
    applyElem(o, el, 2.0, 8, src);
  });
}

/* =========================================================
   1.8 统一伤害管线
   ---------------------------------------------------------
   任何伤害都必须走这里：暴击、增伤、状态、事件、击杀都在这
   里结算。武器只负责"打了一下"。
   ========================================================= */
const HIT = { e:null, dmg:0, crit:false, src:'misc', elem:null };   /* 复用对象，处理器不要保存引用 */
const NOOPT = {};

function dealDamage(e, amount, opt){
  if(!e || e.dead || !(amount > 0)) return 0;
  opt = opt || NOOPT;

  const src = opt.src || SRC || 'misc';
  let dmg;
  if(opt.trueDmg){
    /* 真实伤害：不走全局倍率、不吃护甲。血肉流的核心口径——
       它按"最大生命百分比"计价，如果再乘一遍 dmgMul 就会指数失控。 */
    dmg = amount;
  } else {
    /* 【3.3】超载窗口的伤害加成。
       充能从"常驻"改成"节奏点"之后，超载必须真的是一段爆发，
       否则玩家感觉不到"我攒了一次超载"的价值。
       只有游侠有这条资源，others 的 P.overload 恒为 0，不会误触发。 */
    const overloadMul = (P && P.overload > 0 && (RES.overloadDmg || 0) > 0)
      ? (1 + RES.overloadDmg) : 1;
    dmg = amount * ST.dmgMul * (opt.mul === undefined ? 1 : opt.mul) * charDamageMul(e, opt) * schoolDamageMul(e, src) * overloadMul;
    if(P && P.bloodrageOn) dmg *= 1.2;
    /* 3.0 资源态增伤：狂战 / 超载 / 圣盾 */
    if(P && P.berserk > 0) dmg *= (ST.berserkDmg || 1.3);
    if(P && P.overload > 0){
      if(relic('chgres')) dmg *= 1.2;
      if(archTier('charge') >= 2) dmg *= 1.2;
    }
    if(relic('ragebrand') && P && P.berserk > 0) dmg *= 1.3;
    if(relic('shdaegis') && P && P.shield > 0) dmg *= 1.3;
  }
  let crit = false;

  /* 改造卡「锐利」：这把武器的暴击率 +12%、暴击伤害 +20%（走统一管线，所有来源都吃得到） */
  const sharp = hasMod(src, 'crit');
  const sharpener = (P && P.sc && P.sc.sharp) ? P.sc.sharp : 0;
  let critMul = ST.critMul + (sharp ? 0.20 : 0) + sharpener * 0.03;
  if(opt.canCrit !== false && !opt.dot && !opt.trueDmg){
    if(P && P.guaranteedCrit){ crit = true; P.guaranteedCrit = false; }
    else {
      const cc = (opt.critChance !== undefined ? opt.critChance : ST.crit) + (sharp ? 0.12 : 0) + sharpener * 0.015;
      if(Math.random() < cc) crit = true;
    }
  }
  /* 处刑者：残血目标必定暴击 */
  if(relic('executioner') && e.hp < e.maxHp * 0.25 && !opt.trueDmg) crit = true;
  /* 对流血目标的暴击额外 20%：菜刀/电锯的暴击收益不只是数字 */
  if(crit && e.st && e.st.bleed > 0) dmg *= 1.20;
  if(crit){
    /* 【2.6】暴击预算超了，这一次就"不算暴击"，而不是"算暴击但伤害打 85 折"。
       旧写法会让玩家看到满屏"暴击"，伤害却很小，观感上就是"暴击是假的"。 */
    if(!spend('crit')) crit = false;
    else dmg *= critMul;
  }
  if(e.big){
    if(ST.bossMul > 1) dmg *= ST.bossMul;
    /* 近战打 BOSS 的补偿：BOSS 会冲刺、会拉开距离，近战命中窗口远少于远程，
       不给补偿的话骑士/菜刀系打 BOSS 要一分钟以上。 */
    if(MELEE[src]) dmg *= 1.7;
    /* BOSS 力竭：打太久会越来越脆，避免弱 build 卡在 90 秒的拉锯战里 */
    if(e.fightT > 14){
      dmg *= 1 + Math.min(7.0, (e.fightT - 14) * 0.14);
      if(!e.tired && e.fightT > 14){
        e.tired = true;
        addText(e.x, e.y - e.r - 20, '力竭！', '#ffd166', 13);
        sfx('crit');
      }
    }
  }
  /* 【5.0】条件型改造（先手 / 处决 / 远射 / 猎杀 / 标记）。
     它们是"对什么目标更狠"，而不是"整体再多加 20%"——
     同一把武器在不同局面下的强弱差异，才是构筑的乐趣来源。 */
  if(typeof modCondMul === 'function' && !opt.dot && !opt.trueDmg) dmg *= modCondMul(src, e);
  if(e.armor > 0 && !opt.trueDmg) dmg *= (1 - e.armor);     /* 重甲：吃伤害打折，逼你换手段 */
  /* 冲刺后的「顺势」窗口：敢冲进去的人有输出补偿。
     【4.1】破韧已删除——它会和易伤、冰缓易伤、感电易伤叠在一起，
     玩家根本算不出"这一下到底为什么这么疼"。现在易伤来源只剩元素那几条。 */
  if(P && P.flow > 0) dmg *= 1 + dashFlowDmgNow();
  /* 霜噬：冰缓 / 冻结中的敌人受到的伤害 +25% */
  if(e.st && e.st.ice > 0 && relic('frostbite')) dmg *= 1.25;
  /* 霜刃：打冰住的目标会炸开冰片（0.15 秒节流，避免高频武器刷屏） */
  if(relic('frostblade') && e.st && e.st.ice > 0 && !opt.dot &&
     state.time - (P && P.frostT || -9) > 0.15){
    if(P) P.frostT = state.time;
    if(!e.frostMark){
      e.frostMark = 1;
      eachNear(e.x, e.y, 60, function(o){
        if(o === e || o.dead) return;
        dealDamage(o, dmg * 0.25, { src:'ice', elem:'ice', dot:true, canCrit:false, noFlesh:true });
      });
      burst(e.x, e.y, '#9fe0ff', 5, 90, -0.1);
    }
  }
  /* 冷冻Ⅲ：打被冰住的目标 +40%（厨师的"冻住再打碎"） */
  if(ST.frozenVuln && e.st && e.st.ice > 0) dmg *= 1 + ST.frozenVuln;
  /* 电网Ⅲ：感电目标受到的所有伤害 +15% */
  if(ST.gridTier >= 3 && e.st && e.st.volt > 0) dmg *= 1.15;
  if(e.vulnMul && e.vulnMul !== 1) dmg *= e.vulnMul;

  /* 遗物伤害占比上限。
     遗物的定位是"补强"，但猎杀连锁 / 余烬 / 冰霜之心这类"按击杀或按命中触发"
     的效果会随击杀率线性叠加，9 分钟能打出上千万，结算面板里遗物永远第一，
     武器反而像配件。这里按"同时段武器伤害"给一个比例上限：
     超出部分只保留 12%，保证遗物再胡也只是补强，不会变成主输出。 */
  const isRelicSrc = src === 'relic' || (typeof src === 'string' && src.slice(0, 2) === 'r_');
  if(isRelicSrc){
    const cap = Math.max(60, (state.wpnDps || 120) * 0.5);
    if((state.relicAcc || 0) > cap) dmg *= 0.12;
    state.relicAcc = (state.relicAcc || 0) + dmg;
  }

  /* 反伤占比上限：反伤是"贴脸时多出来的一手"，武器才是主力输出。
     骑士把护甲折成反伤之后，光靠站着不动就能清场，结算面板里反伤常年第一，
     武器反而像配件。这里和遗物一样按"同时段武器伤害"封顶：
     超过同期武器 45% 的部分只保留 20%。 */
  if(src === 'thorns'){
    const tcap = Math.max(40, (state.wpnDps || 120) * 0.45);
    if((state.thornsAcc || 0) > tcap) dmg *= 0.20;
    state.thornsAcc = (state.thornsAcc || 0) + dmg;
  }

  /* --- 机制型改造 --- */
  if(!opt.dot){
    if(hasMod(src, 'overload')){
      /* 原来按"同一个目标"叠层，但杂兵活不到 5 层——这条只对 BOSS 生效，等于没有。
         改成挂在玩家身上：只要不停手就一直叠，2 秒不命中清零。 */
      if((P.ovUntil || 0) < state.time) P.ovStack = 0;
      P.ovStack = Math.min(5, (P.ovStack || 0) + 1);
      P.ovUntil = state.time + 2.0;
      dmg *= 1 + P.ovStack * 0.12;
    }
    /* 「惯性」：站定蓄力，动一下就断。原来写反了（移动时加伤）。 */
    if(hasMod(src, 'momentum') && P && !P.moving && (P.stillT || 0) > 0.5) dmg *= 1.25;
    if(hasMod(src, 'shatter') && e.st && e.st.ice > 0){
      e.st.ice = 0;
      e.st.reactCd = 0.12;
      dmg *= 1.7;
      if(spend('react')) rings.push({ x:e.x, y:e.y, r0:4, r1:34, life:0.2, max:0.2, col:'#bff0ff', w:2 });
    }
    if(hasMod(src, 'detonate') && consumeAny(e, src)) dmg *= 2.4;
    if(hasMod(src, 'spread')) spreadStatus(e, src);

    /* 元素武器的分工：有的负责"挂"，有的负责"炸"。
       引爆型武器遇到配对状态时消耗掉，打出大伤害 + 溅射，
       所以「冰霜雪糕 + 喷火枪」比「两把火」强得多。 */
    const dw = WEAPONS[src];
    if(dw && dw.detonates && spend('react')){
      for(let i = 0; i < dw.detonates.length; i++){
        const el = dw.detonates[i];
        if(e.st && e.st[el] > 0){
          e.st[el] = 0;
          e.st.reactCd = 0.15;
          dmg *= 1.95;
          rings.push({ x:e.x, y:e.y, r0:4, r1:46, life:0.22, max:0.22, col:'#ffe9b0', w:3 });
          let n = 0;
          eachNear(e.x, e.y, 62, function(o){
            if(o === e || o.dead || n >= 6) return;
            n++;
            dealDamage(o, dmg * 0.35, { src:'react', dot:true, canCrit:false });
          });
          sfx('melt');
          break;
        }
      }
    }
  }

  const real = Math.min(dmg, Math.max(0, e.hp));
  DMG[src] = (DMG[src] || 0) + real;
  if(WEAPONS[src]) state.wpnAcc = (state.wpnAcc || 0) + real;   /* 武器每秒输出，供遗物上限参考 */
  state.hitCount = (state.hitCount || 0) + 1;
  state.dmgDealt = (state.dmgDealt || 0) + real;
  state.dmgAcc = (state.dmgAcc || 0) + real;

  e.hp -= dmg;
  e.flash = 0.07;
  e.hitT = 0.1;

  /* 【5.0】「标记」与「波及」在伤害落地之后结算。
     波及只做一层（opt.splash 用来掐断递归），
     否则 A 溅 B、B 溅 C 会在 200 只怪的场面里炸成连锁。 */
  if(!opt.dot && !opt.trueDmg && WEAPONS[src]){
    if(hasMod(src, 'mark') && !e.big){
      e.markT = 6;
      e.markN = Math.min(3, (e.markN || 0) + 1);
    }
    if(hasMod(src, 'splash') && !opt.splash){
      eachNear(e.x, e.y, 46, function(o){
        if(o.dead || o === e) return;
        dealDamage(o, dmg * 0.40, { src: src, splash: true, canCrit: false });
      });
    }
  }

  HIT.e = e; HIT.dmg = dmg; HIT.crit = crit; HIT.src = src; HIT.elem = opt.elem || null;
  HIT.trueDmg = !!opt.trueDmg;
  /* 浮字：只在够痛或暴击时显示，满屏时不刷屏。
     【2.6】暴击飘字补上最小门槛：遗物封顶 ×0.12、护甲折减之后会产生大量
     不足 1 点的碎伤害，原先暴击是无条件显示的，于是满屏"暴击 0"。 */
  if(!opt.trueDmg){
    if(crit && dmg >= 10) addText(e.x + rand(-4, 4), e.y - e.r - 8, '暴击 ' + fmtNum(dmg), '#ffd166', 9);
    else if(!crit && (dmg > 260 || (e.big && dmg > 90))) addText(e.x + rand(-3, 3), e.y - e.r - 4, fmtNum(dmg), '#fff3c4', 8);
  }

  /* 暴击Ⅲ：暴击伤害的 15% 溅射到周围（不递归） */
  if(crit && archTier('crit') >= 3 && !opt.dot){
    let n = 0;
    eachNear(e.x, e.y, 64, function(o){
      if(o === e || o.dead || n >= 5) return;
      n++;
      dealDamage(o, dmg * 0.15, { src: src, dot: true, canCrit:false, noFlesh:true });
    });
  }
  if(!opt.dot){
    emit('hit', HIT);
    if(crit){
      emit('crit', HIT);
      sfx('crit');
      /* 怒不可遏：暴击也是攒怒来源之一 */
      if(relic('ragecrit')) rageGainRaw(3.5);
    }
    /* --- 3.0 资源积累：怒气 / 充能 / 血肉附加 ---
       放在事件之后：角色钩子可能补一层元素，但资源只按"这一下命中"算一次。
       改造卡「蓄怒 / 蓄能」直接改这里，不需要每条弹道都带标记。 */
    if(P){
      const rm = hasMod(src, 'ragefuel') ? 1.8 : 1;
      rageGain(RES.rageGainHit * rm * (opt.rageGain || 1));
      if(!opt.noCharge){
        const cm = hasMod(src, 'chargeup') ? 2.0 : 1;
        chargeGain(RES.chargeHit * cm);
      }
      if(crit) chargeGain(RES.chargeCrit);
    }
    /* 狂战吸血：伤害的 2.5% 记账，每 0.25 秒结算一次 */
    if(!opt.dot) berserkLeech(dmg);
    if(!opt.noFlesh && !opt.trueDmg){
      fleshStrike(e, 1);
      if(hasMod(src, 'bloodpact')) bloodPactStrike(e);
    }
  }

  /* 跳弹：命中后有 35% 概率朝最近的另一个敌人弹一发（不递归） */
  if(!opt.dot && !opt.bounce && relic('ricochet') && Math.random() < 0.35 && bullets.length < 380){
    let best = null, bd = 1e9;
    eachNear(e.x, e.y, 200, function(o){
      if(o.dead || o === e) return;
      const d = dist(e.x, e.y, o.x, o.y);
      if(d < bd){ bd = d; best = o; }
    });
    if(best){
      const ang = Math.atan2(best.y - e.y, best.x - e.x);
      bullets.push({
        type:'shot', x:e.x, y:e.y,
        vx: Math.cos(ang) * 420, vy: Math.sin(ang) * 420,
        r:4, dmg: dmg * 0.55, life:0.6, pierce:0, range: bd + 40,
        hitSet:new Set([e.id]), hitCount:0, rot:ang, spin:0,
        col:'#b6f0ff', src: dmgSrcForRicochet(src), bounce:true
      });
    }
  }

  if(e.hp <= 0){
    const deadSrc = src;
    killEnemy(e, HIT);
    /* 连锁击杀：击杀时向最近的敌人弹射一次 */
    if(!opt.dot && hasMod(deadSrc, 'chainkill') && spend('kill')){
      let best = null, bd = 1e9;
      eachNear(e.x, e.y, 220, function(o){
        if(o.dead || o === e) return;
        const d = dist(e.x, e.y, o.x, o.y);
        if(d < bd){ bd = d; best = o; }
      });
      if(best){
        beams.push({ x:e.x, y:e.y, ang: Math.atan2(best.y - e.y, best.x - e.x),
          len: bd, width: 2, life: 0.12, max: 0.12, col:'#ffe066', src:'chainkill' });
        dealDamage(best, dmg * 0.6, { src: deadSrc, dot: true, canCrit: false });
      }
    }
  }
  return dmg;
}

/* 兼容旧接口：hurt(e, dmg) 自动带上当前 SRC */
function hurt(e, base){
  return dealDamage(e, base, NOOPT);
}

/* 敌对单位（宠物、炮台也会被打） */
function damageAlly(a, dmg){
  if(!a || a.dead) return;
  /* 【4.2】宠物不再受伤、不再死亡、没有血条（土豆兄弟那套）。
     ---------------------------------------------------------
     之前的宠物血量厚到根本死不掉（小狗 74 血 + 65% 减伤），
     而且死了会立刻补员——"死亡"这个事件既不会发生也不产生任何后果，
     结果就是屏幕上一堆血条，玩家却从来不需要关心它们。
     现在：宠物是永久的自动单位，只有炮台会因为时间到期消失。 */
  if(a.kind === 'pet') return;
  a.hp -= dmg;
  a.flash = 0.09;
  if(a.hp <= 0){
    a.dead = true;
    onAllyDeath(a);
  }
}

/* --- 后半场三种怪：原本 SPAWN_TABLE 里引用了 brute / runner / nest，
       但 ENEMIES 里根本没有这三条数据，addEnemy() 直接 return ——
       于是 240 秒之后有将近 40% 的刷怪请求被静默丢弃，
       玩家看到的就是"后期只剩汉堡包一个怪"。这里补上形象。 --- */
function pxSprite(w, h, paint){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const px = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); };
  paint(px);
  return { img: c, white: whiteOf(c), w: w, h: h };
}

/* =========================================================
   2. 图标（16x16 程序绘制）
   ---------------------------------------------------------
   【4.1】图标分成三层，解决"不同东西长得一模一样"：

     1) 手绘图标（下面的 switch）—— 每个是**一种东西**的形状。
        火焰就是火焰、炮台就是炮台。同类物品共用同一个形状是对的，
        玩家需要"一眼看出这是元素件"，而不是背 151 个图标。

     2) 改造图标 drawRune() —— 每张卡使用与效果相符的轮廓，
        如弹射弹丸、击中的盾牌、火焰、雪花、毒瓶、闪电和重锤。

     3) 角标 stampMark() —— 给遗物用。
        同一个家族（比如 13 件"护甲/反伤"件）共用形状，
        但每件盖一个由 id 哈希决定的角标（4 个位置 × 6 种记号），
        于是"同类一眼可辨、个体互不相同"。
   ========================================================= */

/* 稳定哈希：同一个 id 永远得到同一个角标，重开一局也不会变 */
function iconHash(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0);
}

/* ---- 角标：4x4 像素记号，画在四个角之一 ---- */
function stampMark(g, seed, color){
  const h = iconHash(String(seed));
  const corner = h % 4;
  const kind = (h >>> 3) % 8;
  /* 将同一形状的遗物用不同印记标识，印记至少有 6×6，避免旧的
     5px 小字章缩放后只剩色点。 */
  const ox = (corner === 1 || corner === 3) ? 10 : 0;
  const oy = (corner >= 2) ? 10 : 0;
  /* 先铺一层暗底，保证角标在任何底色上都读得出来 */
  g.fillStyle = 'rgba(12,8,20,.88)';
  g.fillRect(ox, oy, 6, 6);
  const R = (x, y, w, hh, c) => { g.fillStyle = c; g.fillRect(ox + x, oy + y, w, hh); };
  const c = color || '#ffe066';
  if(kind === 0){ R(1, 1, 4, 4, c); }
  else if(kind === 1){ R(0, 0, 6, 1, c); R(0, 5, 6, 1, c); }
  else if(kind === 2){ R(0, 0, 1, 6, c); R(5, 0, 1, 6, c); }
  else if(kind === 3){ R(0, 0, 2, 2, c); R(4, 0, 2, 2, c); R(2, 4, 2, 2, c); }
  else if(kind === 4){ R(2, 0, 2, 6, c); R(0, 2, 6, 2, c); }
  else if(kind === 5){ R(0, 0, 2, 2, c); R(4, 0, 2, 2, c); R(0, 4, 2, 2, c); R(4, 4, 2, 2, c); }
  else if(kind === 6){ R(0, 1, 6, 1, c); R(0, 4, 6, 1, c); R(1, 0, 1, 6, c); R(4, 0, 1, 6, c); }
  else { R(2, 0, 2, 2, c); R(0, 2, 6, 2, c); R(2, 4, 2, 2, c); }
}

/* 每张改造卡对应明确的动作或物件；相近效果可以共用物件，
   但加上方向、数量或命中状态的细节来表达它自己的作用。 */
const MOD_ICON_SHAPES = {
  scatter:'fan', flank:'flank', pierce:'pierce', bounce:'bounce', split:'split',
  blast:'blast', burn:'flame', chill:'snowflake', venom:'potion', volt:'lightning',
  haste:'stopwatch', heavy:'hammer', knock:'fist', reach:'spear', size:'expand',
  crit:'bullseye', bleed:'bleed', combo:'twinblades', echo:'echo', count:'pellets',
  spread:'spread', detonate:'bomb', chainkill:'chain', momentum:'momentum',
  overload:'overload', shatter:'shatter', swift:'boot', ragefuel:'rage-shot',
  chargeup:'battery', bloodpact:'blood-shot', opener:'opener', execute:'execute',
  longshot:'rifle', hunter:'crosshair', splash:'impact', mark:'mark'
};

function drawRune(g, key){
  const shape = MOD_ICON_SHAPES[key];
  if(!shape) return;
  const col = MOD_RUNE_COL[key] || '#c9b0ff';
  const ink = '#493432', cream = '#fff4d9', gold = '#ffd166', red = '#ed7668';
  const R = (x,y,w,h,c) => { g.fillStyle = c; g.fillRect(x,y,w,h); };
  const L = (x0,y0,x1,y1,c) => {
    let x=x0,y=y0,dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;
    while(true){R(x,y,1,1,c);if(x===x1&&y===y1)break;const e=2*err;if(e>=dy){err+=dy;x+=sx}if(e<=dx){err+=dx;y+=sy}}
  };
  const bullet = (x,y,c) => {
    R(x,y+1,7,4,ink); R(x+1,y+2,5,2,c); R(x+6,y,3,6,ink);
    R(x+7,y+1,1,4,gold); R(x+2,y+2,2,1,cream);

  const miniBullet = (x,y,c) => {
    R(x,y+1,4,2,ink); R(x+1,y+1,2,1,c); R(x+3,y,3,4,ink); R(x+4,y+1,1,2,gold);
  };
  const circle = (cx,cy,r,c) => {
    for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));R(cx-w,cy+y,w*2+1,1,c)}
  };
  const ray = (cx,cy,dx,dy,len,c) => L(cx,cy,cx+dx*len,cy+dy*len,c);
  const burst = (cx,cy,c) => {
    for(const [dx,dy,len] of [[0,-1,4],[1,-1,3],[1,0,4],[1,1,3],[0,1,4],[-1,1,3],[-1,0,4],[-1,-1,3]]) ray(cx,cy,dx,dy,len,ink);
    circle(cx,cy,3,c); R(cx-1,cy-1,3,3,gold); R(cx,cy,1,1,cream);
  };
  const flame = (x,y,c) => {
    R(x+3,y,3,2,ink); R(x+2,y+2,5,2,ink); R(x+1,y+4,8,3,ink);

    R(cx-3,cy-3,7,7,ink); R(cx-2,cy-2,5,5,c); R(cx-1,cy-1,3,3,cream); R(cx,cy,1,1,red);
  };

  switch(shape){
    case 'fan':

    case 'flank':
      bullet(6,1,col); L(5,3,2,6,ink); L(2,6,0,8,ink);
      R(7,7,2,2,ink); R(8,8,1,1,cream);
      R(0,8,2,2,ink); R(1,8,1,1,col); L(3,9,6,12,ink); bullet(6,10,gold); break;
    case 'pierce':
      R(1,6,2,5,ink); R(2,7,2,3,col); R(3,8,1,1,cream);
      R(3,8,8,2,ink); R(5,9,6,1,gold); R(10,6,4,6,ink); R(11,7,2,4,col); R(13,8,2,2,ink); R(14,9,1,1,cream); break;
    case 'bounce':
      circle(4,10,3,ink); circle(4,10,2,gold); R(3,8,2,1,cream);
      R(7,9,6,1,col); R(12,4,1,6,col); R(8,3,5,1,col);
      R(12,2,1,2,ink); R(10,3,3,1,ink); R(14,4,1,7,ink);
      R(10,5,2,1,cream); R(8,7,2,1,gold); break;
    case 'split':
      bullet(1,5,col); L(7,7,10,3,ink); L(7,7,12,7,ink); L(7,7,10,12,ink);
      R(10,1,3,4,ink); R(11,2,1,2,gold); R(12,6,3,4,ink); R(13,7,1,2,cream); R(10,11,3,4,ink); R(11,12,1,2,col); break;

      R(4,4,8,8,'#cccccc');
  }
  /* 第三层：同类物品的个体角标 */
  if(seed !== undefined && seed !== null) stampMark(g, seed, tint);
}

let CHAR = CHARS.ranger;

/* 角色钩子的统一入口（角色没实现的钩子直接跳过） */
function charHook(name, a, b){
  const p = CHAR;
  if(p && p[name]) return p[name](a, b);
  return undefined;
}
function charDamageMul(e, opt){
  return CHAR && CHAR.damageMul ? CHAR.damageMul(e, opt) : 1;
}

/* 一个敌人身上有几种元素 */
function elemKinds(e){
  if(!e || !e.st) return 0;
  let n = 0;
  if(e.st.fire > 0) n++;
  if(e.st.ice > 0 || (e.slowT || 0) > 0) n++;
  if(e.st.venom > 0) n++;
  if(e.st.volt > 0) n++;
  return n;
}

                        · 怒爆脉冲  引爆额外再炸一次，并给 2 秒冷却缩减

const RES = {
  rageMax: 100,
  rageGainHit: 0.40,        /* 每次命中 */
  rageGainKill: 0.32,       /* 每次击杀 */

     玩家根本不用去打怪。现在挨打只占怒气来源的约四分之一：
     主要来源还是命中与击杀，挨打是"被围时的补贴"，不是主菜。 */
  rageGainHurt: 2.5,        /* 每次受伤 */
  rageDecay: 5.0,           /* 每秒自然衰减 */
  rageIdle: 1.1,            /* 停止获取后多久开始衰减 */
  /* 同样的问题：3.2/帧 = 192/秒，形同虚设。改成每秒 16 点。 */
  ragePerSec: 16,
  berserkBase: 4.5,         /* 3.1：时长缩短，但从下面的倍率补回来 */

  chargeMax: 100,
  chargeRegen: 2.4,       /* 怠速回复：不打也在慢慢蓄，避免一断命中转速就归零 */
  chargeHit: 1.05,        /* 单发开火扣 1.6：命中 1 只打不平，得打中 2 只才涨 */
  chargeKill: 1.1,
  chargeCrit: 3.0,
  /* 【3.3 结构性修复】原来的 chargeFrameCap = 4.0 是"每帧最多 4 点"，
     60 帧就是每秒 240 点——等于没有上限。游侠后期一次齐射命中十几只，
     一帧直接顶满，这就是"0.1 秒充能 + 永远超载"的真正原因。
     换成**每秒令牌桶**：1 秒内最多只能攒 chargePerSec 点，不管命中多少次。 */
  /* 每秒令牌上限不是一个常数，而是一条**成长曲线**（见 chargePerSecNow）：
     开局约 11/s（充满要 9 秒，超载是惊喜），
     3 分钟约 20/s（约 5 秒一轮，转得起来），
     8 分钟约 30/s（约 3.3 秒一轮，后期超载频繁但不常驻）。
     固定成常数是错的做法：前期更难受、后期没有成长感。 */
  chargePerSecBase: 11,
  chargePerSecTime: 20,   /* 由时间贡献的上限增量 */
  chargeDrainHigh: 4.0,   /* 高充能维持成本（×sat²），满槽时每秒额外掉 4 点 */
  chargeSatDamp: 0.25,    /* 接近满槽时收益再打 25% 折 */
  overloadBase: 2.6,
  chargeSpeed: 0.45,      /* 满槽时的攻击间隔缩减 */
  overloadDmg: 0.25       /* 超载期间的伤害加成 */
};

/* 【4.0】令牌桶彻底拆掉，换成"过热"机制。
   ---------------------------------------------------------
   3.3 用每秒令牌桶压住了"一次齐射顶满充能"，但那是**外部闸门**：
   它不解释为什么不能攒，只是不让攒；而且是隐藏在代码里的天花板。
   结果就是"打得再猛也不会更快"，高投入没有回报。

   现在的规则是一条玩家能理解的因果：
     超载结束后枪管过热 → 4 秒内充能不涨（余温 4.2s）。
     于是两次超载之间必然有间隔，间隔长度只由角色决定，不由命中数决定；
     而在间隔之外，打得越猛充能越快，这个正反馈完整保留。
   怒气同理：狂战结束后有 3.5 秒"力竭"，怒气获取减半。 */
const TOKENS = { rage: 0, charge: 0 };   /* 兼容旧引用，实际不再作为闸门 */

/* 充能速率：随时间与等级一起长。
   前期 11/s、中期 20/s、后期 30/s——三个体感完全不同的阶段，
   而不是"从头到尾被一个数字卡住"。 */
function chargePerSecNow(){
  const t = (typeof state !== 'undefined' && state) ? state.time : 0;
  const lv = (P && P.level) ? P.level : 1;
  const base = RES.chargePerSecBase
             + Math.min(RES.chargePerSecTime, t / 38)
             + Math.min(4, (lv - 1) * 0.10);
  /* 【关键】获取加成要乘在**每秒预算**上，不能只乘在单次命中的数值上。
     后期命中密度大，预算是唯一的瓶颈——只乘单次数值的话，
     "充能速度 +15%" 这类结晶在真正需要它的后期等于不存在。 */
  return base * ((ST && ST.chargeRate) ? ST.chargeRate : 1);
}
/* 怒气同理：骑士的狂战节奏也要前期慢、后期快。 */
function ragePerSecNow(){
  const t = (typeof state !== 'undefined' && state) ? state.time : 0;
  const lv = (P && P.level) ? P.level : 1;
  const base = 11 + Math.min(11, t / 45) + Math.min(4, (lv - 1) * 0.09);
  return base * ((ST && ST.rageGain) ? ST.rageGain : 1);
}

function resInit(){
  TOKENS.rage = 11;
  TOKENS.charge = 11;
  P.rage = 0;
  P.berserk = 0;
  P.rageIdle = 99;
  P.ragePeak = 0;
  P.charge = 0;
  P.overload = 0;
  P.shield = 0;
  P.shieldHitT = 99;
  P.devour = 0;
  P.devourKills = 0;
  P.growthT = 0;
  P.growthHp = 0;
  P.growthDmg = 0;
  P.fleshT = -9;
  P.rageBurstT = -9;
  P.overloadCount = 0;
  P.rageCount = 0;
  /* 【4.0】新机制的状态位 */
  P.overheat = 0;
  P.drained = 0;
  P.dashCharge = ECO.dashCharges;
  P.flow = 0;
  P.dashT = 0;
  P.dashTrail = [];
  P.brokenCount = 0;
}

/* 每帧把令牌桶补到上限（漏桶：最多积压 1 秒的量）
   【3.3】原签名不带 dt，因为以前只是把计数器清零。
   现在要按真实时间补充，必须传 dt——硬编码 1/60 在变速帧上会算错。 */
function resFrameReset(dt){
  /* 预留：令牌桶已经拆掉，这里只保留接口，避免旧调用点报错 */
}

/* 伤害计价的统一尺度：一秒钟的武器输出。
   所有"按时间触发"的机制（怒气冲击波、心跳泵、盾反）都用它当基准，
   这样它们跟着构筑一起成长，不会像 2.x 的固定数值那样后期变成挠痒。 */
function powerBase(){
  return Math.max(35, (state && state.wpnDps) ? state.wpnDps : 120);
}

/* ---------------- 怒气 ---------------- */
/* 【3.0 定位修正】资源是**角色身份**，不是公共系统：
   怒气只属于骑士、充能只属于游侠、护盾只属于工程师、吞噬只属于饲养员。
   厨师与赌徒走元素反应 / 押注，不共享这套资源。 */
function hasRage(){ return !!(CHAR && CHAR.hasRage); }
function hasCharge(){ return !!(CHAR && CHAR.hasCharge); }
function hasShield(){ return !!(CHAR && CHAR.hasShield); }
/* 护甲点数（与 getStats 里那条唯一的减伤曲线同源） */
function armorPtsTotal(){ return Math.max(0, (ST && ST.armorPts) || 0); }
function hasDevour(){ return !!(CHAR && CHAR.hasDevour); }

function isBerserk(){ return !!(P && P.berserk > 0); }

/* 狂战吸血：伤害的一部分转成治疗。
   高频武器每击都调 healPlayer 会打爆预算闸门，所以先记账，每 0.25 秒结算一次。
   单次上限 1.6% 最大生命 → 每秒最多约 6.4%，是"打得凶才回得动"的续航，
   不是无脑站桩。 */
function berserkLeech(dmg){
  if(!P || !isBerserk() || !(dmg > 0)) return;
  P.leechAcc = (P.leechAcc || 0) + dmg * 0.025;
}
function leechTick(dt){
  if(!P) return;
  P.leechT = (P.leechT || 0) - dt;
  if(P.leechT > 0) return;
  P.leechT = 0.25;
  const acc = P.leechAcc || 0;
  P.leechAcc = 0;
  if(acc <= 0.5) return;
  const give = Math.min(acc, P.maxHp * 0.016);
  if(P.hp < P.maxHp && give > 0.5){
    healPlayer(give);
    if(state.time - (P.leechFx || -9) > 0.9){
      P.leechFx = state.time;
      addText(P.x, P.y - 26, '+' + Math.round(give), '#8ee06b', 9);
    }
  }
}

function rageGain(n){
  if(!P || !hasRage() || P.berserk > 0 || !(n > 0)) return;
  n *= (ST && ST.rageGain) ? ST.rageGain : 1;
  /* 力竭：狂战刚结束的 3.5 秒里，怒气只有一半效率。
     这是"别指望一直狂"的机制解释，而不是一个每秒点数闸门。 */
  if(P.drained > 0) n *= 0.5;
  P.rage = Math.min(RES.rageMax, P.rage + n);
  P.rageIdle = 0;
  if(P.rage >= RES.rageMax) rageEnter();
}

/* 脚本事件（受伤 / 遗物）给的怒气：不吃每帧上限，
   否则"受伤 +30 怒"会被 3.2/帧 的闸门砍成 3 点。 */
function rageGainRaw(n){
  if(!P || !hasRage() || P.berserk > 0 || !(n > 0)) return;
  n *= (ST && ST.rageGain) ? ST.rageGain : 1;
  P.rage = Math.min(RES.rageMax, P.rage + n);
  P.rageIdle = 0;
  if(P.rage >= RES.rageMax) rageEnter();
}

function rageEnter(){
  if(!P || !hasRage()) return;
  /* 【裂怒阀门】满怒时不再进入狂战，而是直接引爆并清零。
     这一件就把"攒怒 → 狂战"改写成"攒怒 → 爆炸"的循环，
     叠得越快，炸得越密——这是骑士的第二种玩法。 */
  if(relic('ragevent')){ rageDetonate(); return; }
  P.rage = 0;
  P.rageCount = (P.rageCount || 0) + 1;
  P.berserk = Math.max(0.8, (ST.rageDur || RES.berserkBase));
  P.ragePeak = P.berserk;

  addText(P.x, P.y - 36, '狂 战 ！', '#ff8a5c', 16);
  if(rings.length < 40){
    rings.push({ x:P.x, y:P.y, r0:10, r1:126, life:0.45, max:0.45, col:'#ff8a5c', w:5 });
    rings.push({ x:P.x, y:P.y, r0:4, r1:64, life:0.28, max:0.28, col:'#ffe9b0', w:3 });
  }
  burst(P.x, P.y, '#ff8a5c', 26, 210, -0.1);
  state.shake = Math.max(state.shake, 5);
  state.flash = Math.max(state.flash, 0.34);
  state.hitstop = Math.max(state.hitstop || 0, 0.045);
  sfx('rageEnter');
  emit('rageEnter', { rage: RES.rageMax });
  if(archTier('rage') >= 3) rageShockwave('enter');
}

function rageExit(reason){
  if(!P) return;
  P.berserk = 0;
  /* 力竭：狂战之后的恢复期。它是"节奏"本身，不需要每秒怒气闸门。 */
  P.drained = 3.5;
  addText(P.x, P.y - 30, '怒气消退', '#ffb08a', 10);
  burst(P.x, P.y, '#ff8a5c', 10, 120, 0);
  if(rings.length < 30) rings.push({ x:P.x, y:P.y, r0:6, r1:54, life:0.26, max:0.26, col:'#ff8a5c', w:2 });
  sfx('rageExit');
  emit('rageExit', { reason: reason || 'timeout' });
  if(archTier('rage') >= 3) rageShockwave('exit');
}

/* 裂怒阀门：满怒引爆。
   伤害 = 0.45 秒武器输出 + 2% 最大生命，跟着构筑一起成长，
   不会像固定数值那样后期变成挠痒。 */
function rageDetonate(){
  if(!P) return;
  /* 防自触发链：一次爆炸若炸死一片，击杀怒气会把怒气再推满，
     没有这个 0.25 秒闸门就会在同一帧里连爆几十次。 */
  if(state.time - (P.lastDet === undefined ? -9 : P.lastDet) < 0.6){
    P.rage = 0;
    return;
  }
  P.lastDet = state.time;
  P.rage = 0;
  P.rageCount = (P.rageCount || 0) + 1;

  const dbl = relic('rageburst');
  const r = 130 + (dbl ? 26 : 0);
  /* 引爆是「每秒一次的范围爆发」，不是「一发清屏」：
     系数按实测伤害占比调到 30% 左右（见 tools/sim.mjs 的伤害归因）。 */
  const dmg = powerBase() * 0.45 + P.maxHp * 0.02;

  addText(P.x, P.y - 38, '引 爆 ！', '#ff5a3d', 17);
  if(rings.length < 40){
    rings.push({ x:P.x, y:P.y, r0: 10, r1: r, life: 0.34, max: 0.34, col:'#ff5a3d', w: 6 });
    rings.push({ x:P.x, y:P.y, r0: 4, r1: r * 0.66, life: 0.24, max: 0.24, col:'#ffe9b0', w: 3 });
  }
  burst(P.x, P.y, '#ff7a4d', 30, 240, -0.1);
  state.shake = Math.max(state.shake, 7);
  state.flash = Math.max(state.flash, 0.4);
  state.hitstop = Math.max(state.hitstop || 0, 0.06);
  sfx('rageBurst');

  eachNear(P.x, P.y, r, function(e){
    if(e.dead) return;
    dealDamage(e, dmg, { src:'rage', noFlesh:true });
    if(!e.big && !e.dead){
      const a = Math.atan2(e.y - P.y, e.x - P.x);
      e.x += Math.cos(a) * 26;
      e.y += Math.sin(a) * 26;
      e.stun = Math.max(e.stun || 0, 0.3);
    }
  });

  if(dbl){
    /* 怒爆脉冲：延迟 0.26 秒补第二发（70%），并给 2 秒冷却缩减 */
    strikes.push({ kind:'bomb', x:P.x, y:P.y, delay:0.26, max:0.26,
                   r: r * 0.86, dmg: dmg * 0.7, src:'rage', seed: 0 });
    P.rageHaste = 2.0;
    addText(P.x, P.y - 52, '余 怒', '#ffb056', 12);
  }
  if(archTier('rage') >= 3){
    /* 流派Ⅲ：引爆时再震一圈（不额外结算伤害，只做击退与控场） */
    rings.push({ x:P.x, y:P.y, r0: r * 0.6, r1: r * 1.25, life: 0.3, max: 0.3, col:'#ff9d6b', w: 3 });
    eachNear(P.x, P.y, r * 1.25, function(e){
      if(e.dead || e.big) return;
      const a = Math.atan2(e.y - P.y, e.x - P.x);
      e.x += Math.cos(a) * 18;
      e.y += Math.sin(a) * 18;
    });
  }
  emit('rageEnter', { detonate: true });
}

/* 怒爆脉冲 / 怒气流派Ⅲ：进入与退出都是一发范围伤害。
   伤害 = 0.9 秒武器 DPS ×（1 + 当前怒气倍率），并附带击退。 */
function rageShockwave(kind){
  if(!P) return;
  const r = 108 + (P.berserk > 0 ? 18 : 0);
  const dmg = powerBase() * 0.5 * (kind === 'enter' ? 1 : 0.7);
  if(rings.length < 34) rings.push({ x:P.x, y:P.y, r0:12, r1:r, life:0.3, max:0.3, col:'#ff9d6b', w:4 });
  burst(P.x, P.y, '#ff9d6b', 16, 190, -0.1);
  eachNear(P.x, P.y, r, function(e){
    if(e.dead) return;
    dealDamage(e, dmg, { src:'rage', noFlesh:true });
    if(!e.big && !e.dead){
      const a = Math.atan2(e.y - P.y, e.x - P.x);
      e.x += Math.cos(a) * 16;
      e.y += Math.sin(a) * 16;
      e.knockPow = Math.max(e.knockPow || 0, 8);
    }
  });
  sfx('rageBurst');
}

function rageTick(dt){
  if(!P || !hasRage()) return;
  if(P.drained > 0) P.drained = Math.max(0, P.drained - dt);
  if(P.rageHaste > 0) P.rageHaste = Math.max(0, P.rageHaste - dt);
  if(P.berserk > 0){
    P.berserk -= dt;
    if(P.berserk <= 0) rageExit('timeout');
  } else if(P.rage > 0){
    P.rageIdle += dt;
    if(P.rageIdle > RES.rageIdle){
      P.rage = Math.max(0, P.rage - RES.rageDecay * ((ST && ST.rageDecay) || 1) * dt);
    }
  }
}

/* ---------------- 充能 / 超载 ---------------- */
/* 充能的第二层作用：**线性转速**。
   怒气的价值全在"进入狂战"那一刻（攒满 → 状态窗口 → 清零），
   充能的价值则在"当下有多少"——充能越高冷却越低，但每次开火都会掉。
   于是它是"保持转速"，不是"憋大招"：命中补得多、乱打就掉速。 */
/* 转速表的收益从 −32% 提高到 −45% 间隔。
   修好"永远满槽"之后，超载从常驻变成节奏点，游侠的总输出掉了一大截——
   但"高转速"这件事本身的价值并没有兑现：满槽时才 −32%，
   而以前满槽是常态，所以这 32% 等于白送。
   现在满槽是稀缺状态，就该给得更多，让"把转速踩住"成为游侠的核心动作。 */
function chargeRateMul(){
  if(!P || !hasCharge() || P.overload > 0) return 1;
  return 1 - Math.min(1, P.charge / RES.chargeMax) * RES.chargeSpeed;
}
function chargeSpend(n){
  if(!P || !hasCharge() || P.overload > 0) return;
  P.charge = Math.max(0, P.charge - n);
}

function chargeGain(n){
  if(!P || !hasCharge() || P.overload > 0 || !(n > 0)) return;
  /* 过热：超载结束后的 4 秒里，充能不涨。
     这是"两次超载之间必然有间隔"的机制来源，不是隐藏的每秒上限。 */
  if(P.overheat > 0) return;
  n *= (ST && ST.chargeRate) ? ST.chargeRate : 1;
  /* 越接近满槽越难涨：这是一条收益递减曲线，不是封顶 */
  const sat = P.charge / RES.chargeMax;
  n *= (1 - (RES.chargeSatDamp || 0) * sat * sat);
  if(n <= 0.0001) return;
  P.charge = Math.min(RES.chargeMax, P.charge + n);
  if(P.charge >= RES.chargeMax) overloadEnter();
}

function overloadEnter(){
  if(!P || !hasCharge()) return;
  P.charge = 0;
  P.overloadCount = (P.overloadCount || 0) + 1;
  P.overload = Math.max(1.0, ST.overloadDur || RES.overloadBase);
  addText(P.x, P.y - 34, '超 载 ！', '#7ce3ff', 15);
  if(rings.length < 40){
    rings.push({ x:P.x, y:P.y, r0:14, r1:150, life:0.4, max:0.4, col:'#7ce3ff', w:4 });
    rings.push({ x:P.x, y:P.y, r0:6, r1:80, life:0.24, max:0.24, col:'#ffffff', w:2 });
  }
  burst(P.x, P.y, '#9fe8ff', 22, 200, -0.1);
  state.shake = Math.max(state.shake, 4);
  state.flash = Math.max(state.flash, 0.3);
  sfx('overload');
  emit('overload', { });
  overloadVolley();
  if(archTier('charge') >= 3) P.overloadEcho = 1;      /* 结束前再齐射一次 */
}

/* 超载瞬间：所有武器立刻打一轮。这是"整套构筑一起开火"的爽点。 */
function overloadVolley(){
  if(!P) return;
  for(const id in P.weapons){
    const w = WEAPONS[id];
    if(!w || w.continuous) continue;
    const lv = P.weapons[id];
    try{ w.fire(lv); }catch(e){ /* 单把武器出错不能拖垮全局 */ }
    P.cds[id] = 0.12;
  }
}

/* 充能的"怠速"：即使一发没打中，转速也会慢慢爬回来。
   没有这一条，开局只有一把武器、命中少的时候充能永远是 0，
   整个转速机制等于不存在。 */
function chargeIdleTick(dt){
  if(!P || !hasCharge() || P.overload > 0) return;
  /* 过热期间怠速也不回充——"枪管还烫着"这件事要在体感上成立 */
  if(P.overheat > 0){ P.overheat = Math.max(0, P.overheat - dt); return; }
  const sat = P.charge / RES.chargeMax;
  /* 怠速回复只在低转速时明显：空槽给你一个起步转速，高转速则几乎不加。 */
  if(P.charge < RES.chargeMax){
    P.charge = Math.min(RES.chargeMax, P.charge + RES.chargeRegen * dt * (1 - sat));
  }
  /* 高充能维持成本：满槽每秒掉 chargeDrainHigh 点。
     "永远 100 充能 = 永远 −45% 冷却间隔"原本是白拿的，现在要付钱。 */
  P.charge = Math.max(0, P.charge - RES.chargeDrainHigh * sat * sat * dt);
}

function overloadTick(dt){
  if(!P || !hasCharge() || P.overload <= 0) return;
  P.overload -= dt;
  if(P.overload <= 0){
    P.overload = 0;
    /* 余温：超载之后的恢复期。下一次超载最快也要这么久之后。 */
    P.overheat = 4.2;
    if(P.overloadEcho){
      P.overloadEcho = 0;
      overloadVolley();
      addText(P.x, P.y - 28, '余响', '#9fe8ff', 11);
    }
    if(relic('chgcore')) P.charge = 40;
  }
}

/* ---------------- 护盾 ---------------- */
/* 护盾上限 = 装备给的护盾 + 护甲换算。
   护甲本身就是"防御性的东西"，让它同时给护盾，是工程师与坦克流派的交叉点。 */
function shieldMaxNow(){
  if(!hasShield()) return 0;
  const gear = (ST && ST.shieldMax) || 0;
  /* 【4.2】护盾是工程师的"血条"：基础值 + 护甲点数 × 角色系数。
     他的 hp 只有 240、护甲只有 2 点，所以防御件对他来说是双倍收益
     ——既减伤，又直接撑护盾上限。 */
  const base = (CHAR && CHAR.shieldBase) || 0;
  const scale = (CHAR && CHAR.shieldScale) || 0.9;
  return Math.max(0, gear + base + armorPtsTotal() * scale);
}

function shieldTick(dt){
  if(!P || !hasShield()) return;
  P.shieldHitT += dt;
  const max = shieldMaxNow();
  if(max <= 0){ P.shield = 0; return; }
  if(P.shield > max) P.shield = max;
  /* 【4.2】护盾不再"脱战自然回充"。
     ---------------------------------------------------------
     原来挨打 3 秒后每秒回 12% 上限 —— 等于一条自己长回来的血条，
     玩家根本不需要为它做任何事，防御类遗物也就失去意义了。
     现在护盾全部来自**装备与战斗**：
       · 上限  = 护甲点数 × 0.9 + 护盾类遗物/结晶（见 shieldMaxNow）
       · 补满  = 升级时回满（onLevel）
       · 回补  = 每击杀 10 个敌人回 6% 上限
     于是"要不要为护盾投一件防御装"变成一个真实的取舍。 */
  if(P.killShield > 0){
    P.shield = Math.min(max, P.shield + max * 0.018 * P.killShield);
    P.killShield = 0;
  }
}

/* 护盾先吃伤害；返回剩余需要生命值承受的伤害 */
function shieldAbsorb(dmg){
  if(!P || !hasShield() || P.shield <= 0 || !(dmg > 0)) return dmg;
  const take = Math.min(P.shield, dmg);
  P.shield -= take;
  burst(P.x + rand(-6, 6), P.y + rand(-8, 4), '#9fe8ff', 4, 90, 0);
  if(P.shield <= 0.01){
    P.shield = 0;
    if(rings.length < 30) rings.push({ x:P.x, y:P.y, r0:8, r1:56, life:0.26, max:0.26, col:'#9fe8ff', w:3 });
    addText(P.x, P.y - 30, '护盾破碎', '#9fe8ff', 11);
    sfx('shieldBreak');
    state.shake = Math.max(state.shake, 3);
    emit('shieldBreak', { });
    if(relic('shdbreak')){
      const r = 96, d = powerBase() * 0.85;
      rings.push({ x:P.x, y:P.y, r0:10, r1:r, life:0.3, max:0.3, col:'#9fe8ff', w:4 });
      eachNear(P.x, P.y, r, function(e){
        if(e.dead) return;
        dealDamage(e, d, { src:'shield', noFlesh:true });
        if(!e.big && !e.dead) e.stun = Math.max(e.stun || 0, 0.6);
      });
      sfx('boom');
    } else if(relic('overcharge')){
      /* 过载放电：破盾瞬间对周围放一圈电（独立于盾反，可以同时拿） */
      const r = 74, d = powerBase() * 0.45;
      rings.push({ x:P.x, y:P.y, r0:6, r1:r, life:0.2, max:0.2, col:'#bff0ff', w:2 });
      eachNear(P.x, P.y, r, function(e){
        if(e.dead || e.stunned) return;
        dealDamage(e, d, { src:'shield', elem:'volt', noFlesh:true });
        e.stun = Math.max(e.stun || 0, 0.3);
      });
      sfx('zap');
    } else if(archTier('shield') >= 3){
      const r = 84, d = powerBase() * 0.5;
      rings.push({ x:P.x, y:P.y, r0:8, r1:r, life:0.26, max:0.26, col:'#9fe8ff', w:3 });
      eachNear(P.x, P.y, r, function(e){ if(!e.dead) dealDamage(e, d, { src:'shield', noFlesh:true }); });
    }
  }
  return dmg - take;
}

/* ---------------- 血肉：按最大生命百分比结算的"真实伤害" ---------------- */
function fleshPctNow(){
  return Math.max(0, (ST && ST.fleshPct) || 0);
}

function fleshStrike(e, mult){
  if(!P || !e || e.dead) return;
  const pct = fleshPctNow();
  if(pct <= 0) return;
  if(state.time - (P.fleshT || -9) < 0.12) return;     /* 高频武器不刷屏 */
  P.fleshT = state.time;
  const ratio = pct * (mult === undefined ? 1 : mult);
  const base = P.maxHp * ratio * (1 + state.time / 240);
  if(base < 1) return;
  dealDamage(e, base, { src:'flesh', trueDmg:true, noFlesh:true, canCrit:false });
  if(!e.dead) burst(e.x, e.y - 3, '#ff5f7e', 3, 80, -0.2);
}

/* 「血契」改造卡：固定 0.5% 最大生命的附加真实伤害 */
function bloodPactStrike(e){
  if(!P || !e || e.dead) return;
  if(state.time - (P.bloodT || -9) < 0.12) return;
  P.bloodT = state.time;
  const base = P.maxHp * 0.005 * (1 + state.time / 240);
  if(base < 1) return;
  dealDamage(e, base, { src:'flesh', trueDmg:true, noFlesh:true, canCrit:false });
}

/* ---------------- 吞噬：滚雪球 ---------------- */
function devourOnKill(){
  if(!P || !hasDevour() || !relic('growdevour')) return;
  if(P.devour >= 60) return;
  P.devourKills = (P.devourKills || 0) + 1;
  if(P.devourKills < 15) return;
  P.devourKills -= 15;
  P.devour++;
  P.maxHp += 2;
  P.hp = Math.min(P.maxHp, P.hp + 2);
  ST = getStats();
  if(P.devour % 5 === 0){
    addText(P.x, P.y - 30, '吞噬 +' + P.devour, '#a6e05a', 11);
    if(rings.length < 26) rings.push({ x:P.x, y:P.y, r0:4, r1:36, life:0.2, max:0.2, col:'#a6e05a', w:2 });
    sfx('devour');
  }
}

/* 生长之种 / 血肉盛宴：按时间、按击杀永久成长。
   注意：这里**不重算 ST**——每杀一只就重算一次属性会白烧 CPU。
   成长得到的伤害加成由 getStats() 直接读 P.growthHp / P.feastHp 计算，
   下一次自然重算（升级 / 选卡 / 强化）就会生效；生命上限则当场生效。 */
function growthTick(dt){
  if(!P) return;
  if(relic('growseed')){
    P.growthT += dt;
    if(P.growthT >= 20){
      P.growthT = 0;
      if(P.growthHp < 30){
        P.growthHp += 1;
        P.maxHp += 1; P.hp += 1;
      }
    }
  }
  if(relic('fleshfeast')){
    const want = Math.min(150, Math.floor(state.kills / 2));
    const have = P.feastHp || 0;
    if(want > have){
      const add = want - have;
      P.feastHp = want;
      P.maxHp += add;
      P.hp = Math.min(P.maxHp, P.hp + add);
    }
  }
}

function resTick(dt){
  leechTick(dt);
  if(P && P.packFury > 0) P.packFury = Math.max(0, P.packFury - dt);
  chargeIdleTick(dt);
  rageTick(dt);
  overloadTick(dt);
  shieldTick(dt);
  growthTick(dt);
}

const WEAPON_OWNER = {

function weaponOwner(id){ return WEAPON_OWNER[id] || null; }
function weaponForChar(id){
  const o = WEAPON_OWNER[id];
  return !o || o === (CHAR && CHAR.id);
}

function wmods(id){ return (P && P.wmod && P.wmod[id]) || EMPTY_ARR; }

/* 【5.0】条件型改造的伤害系数。
   放在 42-weapons 里是因为它只跟"哪把武器带了这个改造"有关，
   不改变伤害管线本身的顺序（仍然只乘一次）。 */
function modCondMul(src, e){
  let m = 1;
  if(!e) return m;
  const wm = wmods(src);
  for(let i = 0; i < wm.length; i++){
    const k = wm[i];
    if(k === 'opener'){ if(e.hp >= e.maxHp - 0.01) m *= 1.80; }
    else if(k === 'execute'){ if(e.hp < e.maxHp * 0.35) m *= 1.70; }
    else if(k === 'longshot'){ if(P && dist(P.x, P.y, e.x, e.y) > 260) m *= 1.45; }
    else if(k === 'hunter'){ if(e.big || e.elite) m *= 1.45; }
    else if(k === 'mark'){ if((e.markT || 0) > 0) m *= 1 + 0.08 * Math.min(3, e.markN || 1); }
  }
  return m;
}
function hasMod(id, m){ const a = wmods(id); for(let i = 0; i < a.length; i++) if(a[i] === m) return true; return false; }

  if(bid){
    const b = branchOf(id, bid);
    if(b && b.noEvo) return false;
  }
  return true;
}

/* 把每把武器的单发伤害成长压平到 1 → 3.2 倍 */
function normalizeWeaponCurves(){
  for(const id in WEAPONS){
    const w = WEAPONS[id];
    if(!w) continue;
    w.id = id;                      /* 分支觉醒要反查武器 id */
    if(BRANCHES[id]) w.branches = BRANCHES[id];   /* 供 UI / 目录导出使用 */
    if(!w.stats || w._norm) continue;
    const raw = w.stats;
    let d1 = 0, d5 = 0;
    try{ d1 = raw(1).dmg || 0; d5 = raw(5).dmg || 0; }catch(e){ continue; }
    if(!(d1 > 0)) continue;
    const ratio = clamp(d5 / d1, 1, 3.2);
    w.stats = function(lv){
      const s = raw(lv);
      s.dmg = d1 * (1 + (ratio - 1) * (lv - 1) / 4);
      return s;
    };
    w._norm = true;
  }
}

function hasSameSchoolRelic(w){
  if(!P || !P.relics) return false;
  for(const rid in P.relics){
    const r = RELICS[rid];
    if(r && r.tags && r.tags.indexOf(w.school) >= 0) return true;
  }
  return false;
}

function wDmgMul(id){
  let m = GLOBAL_DMG;
  if(hasMod(id, 'heavy')) m *= 1.22;
  const b = BALANCE[id];
  if(b){
    const lv = (P && P.weapons && P.weapons[id]) ? P.weapons[id] : 1;
    m *= b.s * Math.pow(b.k, lv - 1);
  }
  if(P && P.wevo && P.wevo[id]) m *= 1.35;   /* 进化：+35% 伤害 */
  /* 分支觉醒自带的乘区 */
  if(P && P.evoB && P.evoB[id]){
    const b = branchOf(id, P.evoB[id]);
    if(b && b.dmg) m *= b.dmg;
  }
  /* 【抄 Vampire Survivors 的 Limit Break】满级之后还能继续精炼 */
  if(P && P.refine && P.refine[id]) m *= 1 + 0.10 * P.refine[id];
  return m;
}

function wCdMul(id){
  let m = 1;
  if(hasMod(id, 'haste')) m *= 0.80;
  if(P && P.wevo && P.wevo[id]) m *= 0.85;   /* 进化：冷却 -15% */
  if(P && P.evoB && P.evoB[id]){
    const b = branchOf(id, P.evoB[id]);
    if(b && b.cd) m *= b.cd;
  }
  return m;
}

/* 改造卡带来的额外元素（近战 / 炮台 / 光环走这条） */
function modElems(id){
  const out = [];
  if(hasMod(id, 'burn')) out.push('fire');
  if(hasMod(id, 'chill')) out.push('ice');
  if(hasMod(id, 'venom')) out.push('venom');
  if(hasMod(id, 'volt')) out.push('volt');
  return out;
}

/* 投射物统一入口：改造卡在这里生效，武器自己只管"发一颗" */
function addBullet(b){
  const src = b.src;
  if(!b.dmg) b.dmg = 1;
  b.dmg *= wDmgMul(src);
  if(hasMod(src, 'pierce')) b.pierce = (b.pierce || 0) + 1;
  if(hasMod(src, 'bounce')) b.bounces = (b.bounces || 0) + 2;
  if(hasMod(src, 'blast')){
    b.boom = Math.max(b.boom || 0, 22);
    b.boomMul = Math.max(b.boomMul || 0, 0.25);
  }
  if(hasMod(src, 'split')) b.split = (b.split || 0) + 3;
  if(hasMod(src, 'size')) b.r = (b.r || 4) * 1.25;
  /* 「双翼」：发射瞬间左右各多一发，屏幕上立刻变宽。
     直接 push，不再走 addBullet，避免改造叠加时无限递归。 */
  if(hasMod(src, 'flank') && !b._flank){
    const sp0 = Math.hypot(b.vx || 0, b.vy || 0);
    if(sp0 > 1){
      const a0 = Math.atan2(b.vy, b.vx);
      for(let k = -1; k <= 1; k += 2){
        const a = a0 + k * Math.PI / 2;
        bullets.push(Object.assign({}, b, {
          vx: Math.cos(a) * sp0, vy: Math.sin(a) * sp0,
          dmg: b.dmg * 0.8, rot: a, _flank: true,
          hitSet: new Set(), hitCount: 0, trav: 0
        }));
      }
    }
  }
  if(hasMod(src, 'heavy')) b.knock = (b.knock || 0) + 16;
  const el = modElems(src);
  if(el.length){
    if(!b.elem) b.elem = [];
    for(let i = 0; i < el.length; i++) if(b.elem.indexOf(el[i]) < 0) b.elem.push(el[i]);
  }
  if(b.elem && b.elem.length && P) P.lastElem = b.elem[0];
  if(hasMod(src, 'scatter')){
    /* 散射是"看得见的爽"：从原来左右各一发（3 连）改成扇形 5 连。
       单发伤害压到 72%，但屏幕上直接多出一片弹幕——这是玩家能立刻感知的变化，
       比任何 +% 都直观。 */
    const sp = Math.hypot(b.vx || 0, b.vy || 0);
    if(sp > 1){
      const a0 = Math.atan2(b.vy, b.vx);
      for(let k = -2; k <= 2; k++){
        if(k === 0) continue;
        const a = a0 + k * 0.17;
        bullets.push(Object.assign({}, b, {
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          dmg: b.dmg * 0.50, rot: a,
          hitSet: new Set(), hitCount: 0, trav: 0
        }));
      }
      b.dmg *= 0.50;
    }
  }
  if(bullets.length > 500) return null;
  bullets.push(b);
  return b;
}

/* 近战 / 光环 / 炮台的命中附加（元素 + 爆裂） */
function hitMods(e, src, dmg){
  const el = modElems(src);
  /* 【2.6】走 elemOnHit 统一入口：一次命中最多挂 1 种元素。
     原来这里是 for 循环把改造过的元素全挂上，"一发命中直接凑齐所有反应对"，
     玩家看到的就是"元素只要触发一次就全触发"。 */
  if(el.length) elemOnHit(e, el, dmg * 0.22, src);
  if(hasMod(src, 'heavy') && !e.big){
    const a = Math.atan2(e.y - P.y, e.x - P.x);
    e.x += Math.cos(a) * 14; e.y += Math.sin(a) * 14;
  }
}

/* ---------------- 武器槽 ----------------
   开局 1 把，武器位随等级逐步开放。

   【4.1】6 槽 → 4 槽。
   6 槽的问题不是"位子太多"，而是**根本升不满**：
   一局 10 分钟大约 28 次升级，分给 6 把武器，
   每把只能拿到 4~5 张卡，连"Lv4 改造 + Lv5 觉醒"都摸不到，
   于是玩家真正玩到的是"6 把 Lv3 的残废武器"，
   而不是"4 把练满的本命武器 + 一堆改造"。
   4 槽之后：每把武器平均能吃到 7 张卡，改造与觉醒都能落地，
   而且"带哪 4 把"重新变成一个要做的决定。 */
const MAX_SLOTS = 4;
const SLOT_UNLOCK = [1, 5, 11, 18];      /* 第 n 把武器需要的等级 */

function weaponSlots(){
  return Object.keys(P.weapons);
}
function weaponCount(){ return Object.keys(P.weapons).length; }
function hasWeapon(id){ return !!(P && P.weapons[id]); }
function hasMeleeWeapon(){
  if(!P) return false;
  for(const id in P.weapons) if(MELEE[id]) return true;
  return false;
}

/* 改造卡候选：还没选过的卡里随机两张。
   池子 = 武器自己的修饰卡 + 该流派固定提供的两张机制卡，
   保证每次升级都至少有一张是"改变打法"而不是"加数字"。 */
/* 元素类改造卡：只有「元素专精」角色（厨师）能拿到。
   其它角色如果也能随手挂火 / 毒 / 电，那不管起点是什么角色，
   最后都会收敛到「堆反应」这一条路——这正是"所有角色胡法都一样"的根源。
   门禁在这里做，武器自己的元素（喷火枪自带燃烧之类）不受影响。 */
const ELEM_MODS = { burn:1, chill:1, venom:1, volt:1 };
/* 非元素角色的补位池：全是机制 / 数值类，被门禁抽空时用它兜底，
   保证每把武器仍然有 4 张不一样的候选，而不是"没卡可选" */
const NEUTRAL_MODS = ['crit','haste','size','count','heavy','reach','knock',
                      'combo','momentum','overload','split','echo','chainkill','bounce',
                      'ragefuel','chargeup','bloodpact'];

/* 元素卡的出货概率：厨师几乎必出，其它角色低概率但不是 0。
   用"抽卡倾斜"区分角色，而不是"禁止"——别的角色偶尔也能摸到元素，
   只是凑不成整套；这比直接把他们的反应砍半要合理得多。 */
function elemModChance(){
  if(CHAR && CHAR.reactionMaster) return 1.0;
  return 0.30;
}

function modChoices(id){
  const w = WEAPONS[id];
  if(!w) return [];
  const picked = P.wmod[id] || [];
  const allowElem = Math.random() < elemModChance();
  const pool = [];
  const own = w.mods || [];
  for(let i = 0; i < own.length; i++){
    const m = own[i];
    if(picked.indexOf(m) >= 0) continue;
    if(!allowElem && ELEM_MODS[m]) continue;
    pool.push(m);
  }
  const extra = SCHOOL_MODS[w.school] || [];
  for(let i = 0; i < extra.length; i++){
    if(picked.indexOf(extra[i]) < 0 && pool.indexOf(extra[i]) < 0) pool.push(extra[i]);
  }
  /* 投射类流派（弹幕 / 穿甲）额外候选：双翼。
     弹道形态的变化是这类武器最直接的爽点。 */
  if(w.school === 'barrage' || w.school === 'pierce'){
    const extra2 = ['flank'];
    for(let i = 0; i < extra2.length; i++){
      const m = extra2[i];
      if(picked.indexOf(m) < 0 && pool.indexOf(m) < 0) pool.push(m);
    }
  }
  /* 3.0：已经走上某条资源流派时，对应的改造卡才会出现——
     "武器 = 资源泵" 这条路必须抽得到，否则构筑接不起来。 */
  const archMods = [];
  if(archTier('rage') >= 1) archMods.push('ragefuel');
  if(archTier('charge') >= 1) archMods.push('chargeup');
  if(archTier('flesh') >= 1) archMods.push('bloodpact');
  for(let i = 0; i < archMods.length; i++){
    const m = archMods[i];
    if(picked.indexOf(m) < 0 && pool.indexOf(m) < 0) pool.push(m);
  }
  /* 门禁之后池子可能只剩 1 张，补中性卡，保证永远凑得齐 2 个方向 */
  if(!allowElem && pool.length < 2){
    for(let i = 0; i < NEUTRAL_MODS.length && pool.length < 4; i++){
      const m = NEUTRAL_MODS[i];
      if(picked.indexOf(m) < 0 && pool.indexOf(m) < 0) pool.push(m);
    }
  }
  const out = [];
  while(out.length < 2 && pool.length){
    out.push(pool.splice(ri(0, pool.length - 1), 1)[0]);
  }
  /* 厨师保底：只要池子里有元素卡，就一定给一张。
     "更容易抽到相关的东西"要抽得出来才算，不能靠运气。 */
  if(CHAR && CHAR.reactionMaster){
    let has = false;
    for(let i = 0; i < out.length; i++) if(ELEM_MODS[out[i]]) has = true;
    if(!has){
      for(let i = 0; i < pool.length; i++){
        if(ELEM_MODS[pool[i]]){ out[out.length - 1] = pool[i]; break; }
      }
    }
  }
  return out;
}
/* =========================================================
   3.6 宠物武器
   ---------------------------------------------------------
   宠物不是"自动长出来的一堆"，而是**一把武器 = 一种宠物**：
   你选了「机械鸟」，才会有一只机械鸟；升级它，它变强、变多。
   这样"带什么宠物"是一次真正的构筑选择，而不是白送。
   ========================================================= */

function petCountOf(type){
  let n = 0;
  for(let i = 0; i < allies.length; i++){
    const a = allies[i];
    if(!a.dead && a.kind === 'pet' && a.ptype === type) n++;
  }
  return n;
}

/* 一把宠物武器的通用实现：
   每次开火把这种宠物补到应有数量（1 → Lv3 两只 → Lv5 三只） */
function makePetWeapon(cfg){
  return {
    name: cfg.name,
    blurb: cfg.blurb,
    color: cfg.color,
    icon: cfg.icon || 'pet',
    max: 5,
    school: 'beast',
    petType: cfg.type,
    tags: ['summon', 'pet'].concat(cfg.tags || []),
    mods: cfg.mods || ['crit', 'haste', 'size', 'count'],
    labels: { dmg:'宠物伤害', cd:'补员间隔', count:'数量' },
    stats: lv => ({
      dmg: (cfg.dmg[0] + cfg.dmg[1] * lv + cfg.dmg[2] * lv * lv),
      cd: Math.max(1.8, 5.0 - 0.55 * lv),
      count: Math.min(4, 1 + Math.ceil(lv / 2))
    }),
    awaken: cfg.awaken,
    fire(lv){
      const s = this.stats(lv);
      const want = s.count + (hasMod(cfg.id, 'count') ? 1 : 0);
      const have = petCountOf(cfg.type);
      const room = Math.min(want - have, petLimitOf(cfg.type) - have);
      for(let k = 0; k < room; k++){
        spawnPet(P.x + rand(-24, 24), P.y + rand(-24, 24), lv,
          s.dmg * wDmgMul(cfg.id), 0, cfg.type, cfg.id);
      }
      if(room > 0) sfx('pop');
    }
  };
}

/* =========================================================
   3.5 近战：有动作的挥击系统
   ---------------------------------------------------------
   不是"在脚下炸一圈"，而是：
     【3.3 手感】前摇 / 后摇整体缩短约 30%：
       原来重武器一抡要 0.34 + 0.09 + 0.32 = 0.75 秒动画，
       在怪物已经贴脸的游戏里，这是"按下去半秒才打出去"的迟滞感。
       前摇保留（抬手要看得见，否则没有反馈），后摇砍得更多
       ——后摇不影响命中，只是把角色锁在动画里。

     前摇（蓄力，能看见抬手） → 命中帧（只有这几帧判定）
     → 后摇（收招，此时不能再次挥击）
   每把近战武器的三段时长、扇形角度、距离、击退、眩晕都不一样，
   所以手感是"快斩 / 重击 / 突刺 / 连打"的区别，而不是换皮。
   视觉部分在 72-melee-fx.js：武器本体沿轨迹运动 + 残影 + 刀光带。
   ========================================================= */
let swings = [];

/* 流血的挂载（物理状态，和元素分开算） */
function applyBleed(e, dur, dps, src){
  if(!e || e.dead) return;
  const st = stInit(e);
  st.bleed = Math.max(st.bleed || 0, dur);
  st.bleedDmg = Math.max(st.bleedDmg || 0, dps);
}

function startSwing(cfg){
  if(swings.length > 40) return null;
  const s = {
    x: cfg.x, y: cfg.y, ang: cfg.ang,
    arc: cfg.arc, range: cfg.range,
    windup: cfg.windup, active: cfg.active, recover: cfg.recover,
    /* 近战的身份是"扛着打"：护甲按 60% 折算成近战伤害。
       堆生命 / 减伤对近战不是纯防御属性，而是双重收益。 */
    dmg: cfg.dmg * (1 + (ST.armor || 0) * 0.9), src: cfg.src, col: cfg.col || '#e6eefc',
    knock: cfg.knock || 0, stun: cfg.stun || 0, bleed: cfg.bleed || 0, life: cfg.life || 0,
    hits: new Set(), t: 0, hitCount: 0, done: false,
    lv: cfg.lv || 1, heavy: !!cfg.heavy, wide: !!cfg.wide,
    motion: cfg.motion || 'sweep',
    vis: cfg.vis || { len: 30, shape: 'blade' },
    side: cfg.side || 1, pivot: cfg.pivot || 0, wt: cfg.wt || 0,
    slamX: cfg.slamX, slamY: cfg.slamY, slamR: cfg.slamR,
    hpDmg: cfg.hpDmg || 0,
    elemAlt: cfg.elemAlt || 0,
    execute: cfg.execute || 0
  };
  swings.push(s);
  /* 自动连段：每第三下挥击自动变成「横扫」——范围更大、击退更狠、额外震屏与音效。
     不需要任何按键，节奏自己跑；玩家看到的只是"第三下明显更大一下"。
     这是近战唯一的"爽点节拍器"，也是它和远程扫射的区别。 */
  P.meleeChain = ((P.meleeChain || 0) + 1) % 3;
  if(P.meleeChain === 0 && !cfg.noFinisher){
    s.finisher = true;
    s.arc = Math.min(TAU, s.arc * 1.45);
    s.range *= 1.22;
    s.knock = (s.knock || 0) * 1.7;
    s.dmg *= 1.25;
    /* 让第三下"看得见"：一圈冲击光环 + 轻微震屏 */
    rings.push({ x:s.x, y:s.y, r0:8, r1:s.range * 1.1, life:0.22, max:0.22, col:'#fff1c4', w:3 });
    state.shake = Math.max(state.shake, 3.2);
  }
  return s;
}

function swingTotal(s){ return s.windup + s.active + s.recover; }
function swingPhase(s){
  if(s.t < s.windup) return 0;                 /* 前摇 */
  if(s.t < s.windup + s.active) return 1;      /* 命中窗口 */
  return 2;                                     /* 后摇 */
}

/* 命中反馈：火花 + 顿帧 + 震屏。重击更狠，快斩走节流 */
function meleeImpact(e, s, a){
  const n = s.heavy ? 8 : 4;
  for(let i = 0; i < n && parts.length < 400; i++){
    const ang = a + rand(-0.8, 0.8);
    const sp = rand(70, s.heavy ? 280 : 170);
    parts.push({
      x: e.x, y: e.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 30,
      life: rand(0.10, 0.24), max: 0.24, col: s.heavy ? '#fff3c4' : '#fffbe8',
      size: 2, g: 1.4, spark: true
    });
  }
  /* 命中点的冲击星：只给重击，且限流——普通命中靠火花，堆圈会糊成一片 */
  if(s.heavy && rings.length < 40){
    rings.push({ x: e.x, y: e.y, r0: 2, r1: 30, life: 0.16, max: 0.16, col: '#ffe9b0', w: 3 });
  }

  /* 只有重击才震屏：快斩类一秒砍 5 下，每下都震就是"一直在抖" */
  if(s.heavy) addShake(2.2);

  /* 顿帧：命中瞬间几乎停住，是"打到了"的关键；重击给得更长 */
  if(s.heavy){
    state.hitstop = Math.max(state.hitstop || 0, 0.055);
  } else if((state.hitstopCd || 0) <= 0){
    state.hitstop = Math.max(state.hitstop || 0, 0.030);
    state.hitstopCd = 0.20;
  }
}

/* 命中判定：只在前摇结束后的 active 窗口里生效，且每个敌人只吃一次 */
function updateSwings(dt){
  for(let i = swings.length - 1; i >= 0; i--){
    const s = swings[i];
    s.t += dt;
    if(swingPhase(s) === 1){
      const k = (s.t - s.windup) / s.active;    /* 0→1，用来做挥击轨迹 */
      const a0 = s.ang - s.arc * 0.5;
      const sweep = a0 + s.arc * k;
      eachNear(s.x, s.y, s.range, function(e){
        if(s.hits.has(e.id) || e.dead) return;
        const d = dist(s.x, s.y, e.x, e.y);
        if(d > s.range + e.r) return;
        /* 只打扇形范围内（用当前挥击角度判定，有"扫过去"的感觉） */
        let df = Math.atan2(e.y - s.y, e.x - s.x) - s.ang;
        while(df > Math.PI) df -= TAU;
        while(df < -Math.PI) df += TAU;
        if(s.wide ? Math.abs(df) > s.arc * 0.55 : Math.abs(df - (sweep - s.ang)) > s.arc * 0.28 + 0.16) return;

        s.hits.add(e.id);
        s.hitCount++;
        const ea = Math.atan2(e.y - s.y, e.x - s.x);
        dealDamage(e, s.dmg, { src: s.src });
        hitMods(e, s.src, s.dmg);
        if(s.hpDmg > 0){
          dealDamage(e, P.maxHp * s.hpDmg * (1 + state.time / 240), { src:'flesh', trueDmg:true, noFlesh:true, canCrit:false });
        }
        /* 双持锅铲：一刀火一刀冰，自己就能搓出融化，不依赖第二把元素武器 */
        if(s.elemAlt > 0 && !e.dead){
          P.cookFlip = !P.cookFlip;
          applyElem(e, P.cookFlip ? 'fire' : 'ice', 2.6, s.dmg * s.elemAlt, s.src);
        }
        /* 断头台：残血直接处决，并把怒气还给你 */
        if(s.execute > 0 && !e.dead && e.hp < e.maxHp * s.execute && !e.big){
          dealDamage(e, e.hp + 1, { src:'guillotine', trueDmg:true, noFlesh:true, canCrit:false });
          if(hasRage()) rageGainRaw(6);
          addText(e.x, e.y - 20, '处决', '#ff5a3d', 11);
        }
        if(s.bleed > 0) applyBleed(e, 3.2, s.dmg * s.bleed, s.src);

        /* 击退：位移 + 记录动量，撞到别人会额外掉血（见 separate） */
        /* 击退：原来是"每命中一次就把怪推 s.knock 像素"（锅 22 / 球棒 88），
           连段下来怪被推出攻击范围，近战一直在追空气。
           现在位移 ×0.55，且同一只怪 0.3 秒内只会被推一次。 */
        if(!e.big && s.knock > 0 && !((e.knockCd || 0) > 0)){
          const kr = 1 - (e.knockRes || 0);
          const push = s.knock * kr * 0.55;
          e.x += Math.cos(ea) * push;
          e.y += Math.sin(ea) * push;
          e.knockPow = Math.max(e.knockPow || 0, push * 0.55);
          e.knockCd = 0.30;
        }
        /* 【2.6】眩晕抗性：3 秒内反复被晕，时长依次递减到 25%。
           原来每次都是满时长，一片近战横扫过去等于全体罚站，
           控制越堆越强——这也是"控制太强、怪近不了身"的一部分。 */
        if(s.stun > 0 && !e.big){
          if((e.stunResetT || -99) < state.time - 3) e.stunN = 0;
          e.stunResetT = state.time;
          e.stunN = Math.min(4, (e.stunN || 0) + 1);
          e.stun = Math.max(e.stun || 0, s.stun * Math.max(0.25, 1 - (e.stunN - 1) * 0.25));
        }
        /* 近战的身份不是"把怪推走"，而是"贴着打、边打边扛"：
           命中吸血 + 装备近战武器时的固定减伤（见 getStats）。
           持续输出的回报是续航，而不是把敌人推成一条空走廊。 */
        /* 【2.6】近战吸血改成"单次封顶 0.8% 最大生命"。
           原来按伤害比例回血，而伤害后期涨了 10 倍——回血就跟着涨 10 倍，
           调系数永远追不上。封顶之后，吸血是"贴脸续航"，不是"无限血量"。 */
        if(s.life > 0 && P.hp < P.maxHp) healPlayer(Math.min(s.dmg * s.life * 0.5, P.maxHp * 0.008));
        meleeImpact(e, s, ea);
        sfx(s.heavy ? 'clang' : 'slash');
      });
    }
    if(s.t >= swingTotal(s)) swings.splice(i, 1);
  }
}

/* 电锯 / 披萨刀的持续型逻辑，挂在 updateContinuous 里调用 */
function updateMeleeContinuous(dt){
  /* 电锯 */
  const clv = P.weapons.chainsaw;
  if(clv){
    const s = MELEE.chainsaw.stats(clv);
    const evo = clv >= 5;
    P.sawT = (P.sawT === undefined ? 0 : P.sawT) - dt;
    if(P.sawT <= 0){
      P.sawT = s.tick;
      const tgt = nearestEnemy(P.x, P.y, s.range * 1.6);
      const base = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : (P.facing > 0 ? 0 : Math.PI);
      P.sawAng = base;
      const R = s.range * ST.area * (evo ? 1.3 : 1);
      const dmg = s.dmg * wDmgMul('chainsaw') * (hasMod('chainsaw','combo') ? 1.15 : 1);
      let hitAny = false;
      eachNear(P.x, P.y, R, function(e){
        let df = Math.atan2(e.y - P.y, e.x - P.x) - base;
        while(df > Math.PI) df -= TAU;
        while(df < -Math.PI) df += TAU;
        if(Math.abs(df) > s.arc * 0.7) return;
        hitAny = true;
        dealDamage(e, dmg, { src:'chainsaw' });
        hitMods(e, 'chainsaw', dmg);
        if(hasMod('chainsaw','bleed') || evo) applyBleed(e, 2.4, dmg * 0.7, 'chainsaw');
        if(!e.big){
          const a = Math.atan2(e.y - P.y, e.x - P.x);
          e.x += Math.cos(a) * 3; e.y += Math.sin(a) * 3;
        }
      });
      if(hitAny){
        /* 切割火花：从刀口往前飞 */
        for(let i = 0; i < 5 && parts.length < 400; i++){
          const a = base + rand(-0.5, 0.5);
          parts.push({
            x: P.x + Math.cos(a) * R * 0.75, y: P.y + Math.sin(a) * R * 0.75,
            vx: Math.cos(a) * rand(80, 200), vy: Math.sin(a) * rand(80, 200) - 40,
            life: rand(0.08, 0.20), max: 0.2, col: i % 2 ? '#ffd166' : '#fff3c4',
            size: 2, g: 1.2, spark: true
          });
        }
        addShake(0.5);
        sfx('slash');
      } else {
        sfx('chainLoop');
      }
    }
  }

  /* 回旋披萨刀 */
  const plv = P.weapons.pizzacutter;
  if(plv){
    const s = MELEE.pizzacutter.stats(plv);
    const evo = plv >= 5;
    const R = s.radius * ST.area * (hasMod('pizzacutter','size') ? 1.25 : 1) * (evo ? 1.5 : 1);
    P.pizzaA = (P.pizzaA || 0) + dt * 9;
    P.pizzaT = (P.pizzaT === undefined ? 0 : P.pizzaT) - dt;
    if(P.pizzaT <= 0){
      P.pizzaT = s.tick;
      const moving = P.moving ? 1.35 : 1;
      const dmg = s.dmg * wDmgMul('pizzacutter') * moving;
      eachNear(P.x, P.y, R, function(e){
        if((e.pizzaCd || 0) > 0) return;
        e.pizzaCd = 0.24;
        dealDamage(e, dmg, { src:'pizzacutter' });
        hitMods(e, 'pizzacutter', dmg);
        if(hasMod('pizzacutter','bleed') || evo) applyBleed(e, 2.0, dmg * 0.5, 'pizzacutter');
      });
      if(!enemies.length) return;
      sfx('spin');
    }
  }
}
