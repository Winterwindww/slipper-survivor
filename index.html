  o.start(when); o.stop(when + dur + 0.03);
}

function bgmNoise(when, dur, vol, hp){
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 6500;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(bgmGain);
  src.start(when);
}

/* --- 3.0 新增声部：铺底 pad / 滤波贝斯 / 战斗层 ---
   2.x 的 BGM 只有方波琶音 + 三角波低音，听感像"红白机单声道"。
   这里补两层：
     pad   —— 两个微失谐的锯齿波 + 低通，把和弦垫成"有空间"的背景；
     bass  —— 方波 + 低通，比三角波更有"推进感"，是节奏的骨架。 */
function bgmPad(freq, when, dur, vol){
  const o1 = AC.createOscillator(), o2 = AC.createOscillator();
  const g = AC.createGain(), f = AC.createBiquadFilter();
  o1.type = 'sawtooth'; o2.type = 'sawtooth';
  o1.frequency.value = freq;
  o2.frequency.value = freq * 1.006;
  f.type = 'lowpass';
  f.frequency.setValueAtTime(700, when);
  f.frequency.linearRampToValueAtTime(1300, when + dur * 0.6);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.28);
  g.gain.linearRampToValueAtTime(0.0001, when + dur);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(bgmGain);
  o1.start(when); o2.start(when);
  o1.stop(when + dur + 0.05); o2.stop(when + dur + 0.05);
}

function bgmBass(freq, when, dur, vol){
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, when);
  f.type = 'lowpass';
  f.frequency.setValueAtTime(360, when);
  f.frequency.exponentialRampToValueAtTime(180, when + dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(f); f.connect(g); g.connect(bgmGain);
  o.start(when); o.stop(when + dur + 0.03);
}

/* 按幕切换编曲：1 幕只有骨架，2 幕加和声与踩镲，3 幕加十六分琶音与更强打击 */
function bgmSetAct(act){
  BGM.act = act;
  BGM.bpm = act >= 3 ? 154 : (act === 2 ? 150 : 146);
}

/* Boss 战配乐层：低音 ostinato + 金属撞击 */
function bgmSetBoss(on){ BGM.boss = !!on; }

function bgmSchedule(){
  if(!AC || !BGM.on) return;
  const now = AC.currentTime;
  if(BGM.next < now - 0.35) BGM.next = now + 0.05;
  const eighth = 60 / BGM.bpm / 2;
  const act = BGM.act;
  let guard = 0;
  while(BGM.next < now + 0.18 && guard++ < 12){
    const s = BGM.step;
    /* 16 小节一轮：前 8 小节 A 段，后 8 小节 B 段 */
    const bar = Math.floor(s / 8) % 16;
    const i = s % 8;
    const ch = (bar < 8 ? BGM.progA : BGM.progB)[bar % 8];
    /* 旋律型每 4 小节换一次，第三幕之后换得更勤 */
    const patIdx = Math.floor(s / 32) % BGM.leadPats.length;
    const pat = BGM.leadPats[(patIdx + (act >= 3 ? 1 : 0)) % BGM.leadPats.length];
    const vol = BGM.vol;
    const inB = bar >= 8;
    const fillBar = (bar === 7 || bar === 15);      /* 每段最后一小节：加过门 */

    /* 铺底长音：每小节一个，把和弦"垫"住，原来只有断奏，听感很干 */
    if(i === 0){
      bgmPad(mtof(ch[0] + 12), BGM.next, eighth * 7.6, vol * 0.07);
      bgmPad(mtof(ch[2] + 12), BGM.next, eighth * 7.6, vol * 0.05);
      /* 第三幕之后再叠一层高八度，把"高潮段"和前面区分开 */
      if(act >= 3) bgmPad(mtof(ch[3] + 24), BGM.next, eighth * 3.8, vol * 0.035);
    }

    /* 低音：滤波方波，比三角波更有推进力 */
    if(i === 0 || i === 4) bgmBass(mtof(ch[0] - 24), BGM.next, eighth * 1.5, vol * 1.15);
    if(i === 3 || i === 7) bgmBass(mtof(ch[0] - 17), BGM.next, eighth * 0.55, vol * 0.7);
    if(inB && i === 6) bgmBass(mtof(ch[0] - 12), BGM.next, eighth * 0.5, vol * 0.55);

    /* Boss 战：低音八分音符 ostinato + 每两拍一次金属撞击，制造压迫感 */
    if(BGM.boss){
      bgmBass(mtof(ch[0] - 12), BGM.next, eighth * 0.42, vol * 0.55);
      if(i % 2 === 0) bgmNoise(BGM.next, 0.05, vol * 0.18, 2400);
      if(i === 0) bgmTone(mtof(ch[0] + 6), BGM.next, eighth * 0.5, 'square', vol * 0.22);
    }

    /* 主旋律琶音 */
    const note = ch[pat[i]] + ((i === 7 && bar % 2 === 1) ? 12 : 0);
    bgmTone(mtof(note), BGM.next, eighth * 1.3, 'square', vol * 0.62);
    /* 高音装饰 */
    if(i === 0) bgmTone(mtof(ch[3] + 12), BGM.next, eighth * 0.85, 'triangle', vol * 0.34);
    if(i === 5 && bar === 3) bgmTone(mtof(ch[3] + 7), BGM.next, eighth * 0.5, 'square', vol * 0.3);
    if(inB && i === 2) bgmTone(mtof(ch[1] + 12), BGM.next, eighth * 0.7, 'square', vol * 0.24);

    /* 第二幕起：和声层 */
    if(act >= 2 && (i === 2 || i === 6)){
      bgmTone(mtof(ch[1] + 12), BGM.next, eighth * 0.9, 'triangle', vol * 0.22);
    }
    /* 第三幕：十六分琶音 */
    if(act >= 3){
      const sub = eighth * 0.5;
      for(let k = 0; k < 2; k++){
        const n2 = ch[(i + k) % 4] + 24;
        bgmTone(mtof(n2), BGM.next + k * sub, sub * 0.9, 'square', vol * 0.14);
      }
    }

    /* 过门：每段最后一小节的后两拍，上行走句 + 密集军鼓 */
    if(fillBar && i >= 5){
      const rise = ch[(i - 4) % 4] + 12 + (i - 5) * 2;
      bgmTone(mtof(rise), BGM.next, eighth * 0.42, 'square', vol * 0.3);
      bgmNoise(BGM.next, 0.03, vol * 0.34, 5200);
      bgmNoise(BGM.next + eighth * 0.5, 0.03, vol * 0.26, 6000);
    }

    /* 打击 */
    bgmNoise(BGM.next, 0.03, vol * 0.24);
    if(act >= 2 && i % 2 === 1) bgmNoise(BGM.next, 0.035, vol * 0.18, 8000);
    if(i === 2 || i === 6) bgmNoise(BGM.next, 0.07, vol * 0.5, 3200);
    if(i === 3 && inB) bgmNoise(BGM.next, 0.05, vol * 0.3, 4200);
    if(i === 0 || i === 4){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, BGM.next);
      o.frequency.exponentialRampToValueAtTime(46, BGM.next + 0.1);
      g.gain.setValueAtTime(vol * (act >= 3 ? 2.0 : 1.6), BGM.next);
      g.gain.exponentialRampToValueAtTime(0.0001, BGM.next + 0.12);
      o.connect(g); g.connect(bgmGain);
      o.start(BGM.next); o.stop(BGM.next + 0.14);
    }

    BGM.next += eighth;
    BGM.step = (BGM.step + 1) % 128;      /* 16 小节 × 8 步 */
  }
}

function bgmStart(){
  if(!audioInit()) return;
  if(AC.state === 'suspended') AC.resume();
  BGM.on = true;
  BGM.step = 0;
  BGM.next = AC.currentTime + 0.08;
  if(!BGM.timer) BGM.timer = setInterval(bgmSchedule, 40);
  bgmGain.gain.cancelScheduledValues(AC.currentTime);
  bgmGain.gain.setValueAtTime(Math.max(0.0001, bgmGain.gain.value), AC.currentTime);
  bgmGain.gain.linearRampToValueAtTime(BGM.vol, AC.currentTime + 0.8);
}

function bgmDuck(v){
  if(!AC) return;
  const t = AC.currentTime;
  bgmGain.gain.cancelScheduledValues(t);
  bgmGain.gain.setValueAtTime(Math.max(0.0001, bgmGain.gain.value), t);
  bgmGain.gain.linearRampToValueAtTime(v, t + 0.2);
}

function bgmStop(){
  if(!AC) return;
  BGM.on = false;
  const t = AC.currentTime;
  bgmGain.gain.cancelScheduledValues(t);
  bgmGain.gain.setValueAtTime(Math.max(0.0001, bgmGain.gain.value), t);
  bgmGain.gain.linearRampToValueAtTime(0.0001, t + 0.35);
}
function burst(x, y, color, n, spd, gravity){
  const max = 420;
  for(let i = 0; i < n && parts.length < max; i++){
    const a = rand(0, TAU), s = rand(20, spd || 90);
    parts.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 20,
      life: rand(0.16, 0.42), max: 0.42, col: color,
      size: Math.random() < 0.32 ? 3 : (Math.random() < 0.5 ? 2 : 1),
      g: gravity === undefined ? 1 : gravity
    });
  }
}
function addText(x, y, v, col, size){
  if(texts.length > 30) return;
  texts.push({ x, y, v, life: 0.7, max: 0.7, col, size: size || 8 });
}

/* =========================================================
   9. 战斗逻辑
   ========================================================= */
function nearestEnemy(x, y, maxD, skipId){
  let best = null, bd = (maxD || 1e9) ** 2;
  let bigBest = null, bigD = bd;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead || (skipId !== undefined && e.id === skipId)) continue;
    const dx = e.x - x, dy = e.y - y, d = dx*dx + dy*dy;
    if(e.big){
      if(d < bigD){ bigD = d; bigBest = e; }
    } else if(d < bd){
      bd = d; best = e;
    }
  }
  return bigBest || best;
}

function nearestBig(x, y, maxD){
  let best = null, bd = (maxD || 1e9) ** 2;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead || !e.big) continue;
    const dx = e.x - x, dy = e.y - y, d = dx*dx + dy*dy;
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}

/* 通用爆炸：统一走 dealDamage，会触发事件与连锁 */
function explode(x, y, r, dmg, col, light, src){
  const col2 = col || '#ffd166';
  r *= ST.blast;
  if(rings.length < 22){
    rings.push({ x, y, r0: r * 0.22, r1: r * 1.1, life: 0.22, max: 0.22, col: col2, w: light ? 2 : 4 });
    if(!light) rings.push({ x, y, r0: r * 0.5, r1: r * 1.3, life: 0.24, max: 0.24, col: '#ffcf7a', w: 1.5 });
  }
  burst(x, y, col2, light ? 6 : 14, light ? 110 : 180);
  if(!light){ addShake(1.5); sfx('boom'); }
  const s = src || 'boom';
  eachNear(x, y, r, function(e){ dealDamage(e, dmg, { src: s }); });
  if(spend('boom')) emit('boom', { x, y, r, dmg, src: s });
}

function bubbleBoom(px, py, R0, dmg, src){
  R0 *= ST.blast;
  if(rings.length < 26) rings.push({ x:px, y:py, r0:R0*0.3, r1:R0, life:0.26, max:0.26, col:'#9de9ff', w:3 });
  const s = src || 'bubble';
  eachNear(px, py, R0, function(e){
    dealDamage(e, dmg, { src: s });
    if(!e.dead && !e.big && !(e.stun > 0)){
      const a = Math.atan2(e.y - py, e.x - px) || 0;
      e.x += Math.cos(a) * 13;
      e.y += Math.sin(a) * 13;
    }
  });
  burst(px, py, '#9de9ff', 12, 130);
  if(spend('boom')) emit('boom', { x: px, y: py, r: R0, dmg: dmg, src: s });
}

/* ---------------- 击杀 ---------------- */
function killEnemy(e, hit){
  if(e.dead) return;
  e.dead = true;
  /* 溢出斩：把这一击的 40% 溅到周围，"一炸一片"的爽感 */
  if(relic('overkill') && hit && hit.dmg > 0){
    eachNear(e.x, e.y, 62, function(o){
      if(o === e || o.dead) return;
      dealDamage(o, hit.dmg * 0.40, { src: 'relic' });
    });
    rings.push({ x:e.x, y:e.y, r0:6, r1:40, life:0.22, max:0.22, col:'#ff9d4d', w:2 });
  }
  state.kills++;
  /* 【4.2】护盾不再自然回充：每 25 次击杀回 4% 上限（打出来的防御）。
     第一版写的是"每 10 次击杀回 6%"，实测一局 6000 次击杀 = 回满 36 条盾，
     工程师直接变成 0.14 受伤/秒的无敌角色。量级必须按**击杀率**倒推：
     后期每秒 10 杀，1/25 × 4% ≈ 每秒 0.16% 上限，才是"补给"而不是"无敌"。 */
  if(typeof hasShield === 'function' && hasShield()) P.killShield = (P.killShield || 0) + 1 / 100;
  state.killAcc = (state.killAcc || 0) + 1;
  /* 3.0：顶部只放总击杀数。里程碑改在角色身上飘字，
     每 50 杀一次，用递进文案让"这局打得有多狠"有体感。 */
  if(state.kills % 50 === 0){
    const N = state.kills;
    const word = N >= 1000 ? '千杀！' : (N >= 500 ? '五百杀！' : (N >= 200 ? '两百杀！' : '五十杀！'));
    addText(P.x, P.y - 44, word, N >= 500 ? '#ff9dc0' : '#ffe066', 15);
    if(rings.length < 22) rings.push({ x:P.x, y:P.y, r0: 6, r1: 54, life: 0.3, max: 0.3, col:'#ffe066', w: 2 });
    sfx('streak');
  }

  /* 辣酱：烧死的敌人会炸开，把「点燃 → 连锁」这条线接上 */
  if((relic('hotsauce') || ST.heatTier >= 2) && e.st && e.st.burn > 0){
    explode(e.x, e.y, 54, e.maxHp * 0.10 + P.level * 3, '#ff8a3d', true, 'fire');
  }

  /* 3.0：击杀同时驱动三条资源线 —— 怒气、充能、吞噬 */
  if(P){
    rageGainRaw(RES.rageGainKill);
    /* 尸潮之怒：附近有人死就涨怒，清场速度直接换成怒气速度 */
    if(relic('ragefeast') && dist(e.x, e.y, P.x, P.y) < 220) rageGainRaw(3);
    chargeGain(RES.chargeKill);
    devourOnKill();
    if(archTier('growth') >= 2 && Math.random() < 0.04){
      dropHeal(e.x, e.y, 0.08);
    }
  }

  /* 吸血：和击杀回血共用每秒预算 */
  const healAmt = killHealAmount();
  if(healAmt > 0) drawKillHeal(healAmt);

  if(e.big){
    burst(e.x, e.y, e.col, 52, 250);
    rings.push({ x:e.x, y:e.y, r0:e.r, r1:110, life:0.6, max:0.6, col:e.col, w:5 });
    rings.push({ x:e.x, y:e.y, r0:e.r, r1:150, life:0.85, max:0.85, col:'#ffffff', w:2 });
    state.shake = 9;
    state.slow = 0.25;
    state.flash = 0.3;
    sfx('boss');
    bgmSetBoss(false);
    for(let i = 0; i < 10; i++) dropGem(e.x + rand(-30, 30), e.y + rand(-26, 26), 6);
    for(let i = 0; i < 2; i++) dropHeal(e.x + rand(-34, 34), e.y + rand(-28, 28), 0.18);
    addText(e.x, e.y - 34, 'BOSS 击破！', '#ffe066', 14);
    forceLevelUp();
    state.bossKills = (state.bossKills || 0) + 1;
    if(!state.bossTtk) state.bossTtk = [];
    state.bossTtk.push(+(state.time - (e.spawnT || state.time)).toFixed(1));
    /* 卷轴只从 BOSS 掉：精英不该白送改造 */
    grantFreeMod('BOSS 卷轴');
    emit('bossDeath', e);
    if(e.final && !state.won){
      state.won = true;
      addText(e.x, e.y - 60, '通 关 ！', '#fff3b0', 22);
      showToast('👑 拖鞋之王倒下了 —— 通关！');
      /* 用帧计时而不是 setTimeout：结算延迟要能被模拟器复现 */
      state.winT = 1.4;
    }
  } else {
    burst(e.x, e.y, e.col, 10, 135);
    rings.push({ x:e.x, y:e.y, r0:e.r*0.7, r1:e.r*3.2, life:0.26, max:0.26, col:e.col, w:2 });
    dropGem(e.x, e.y, e.xp);
    sfx('kill');
    /* 精英词缀「爆裂」：死了也要拉你一起。近战贴脸杀它会吃一发。 */
    if(e.elite && e.affix === 'volatile'){
      explode(e.x, e.y, 74, Math.max(20, (e.dmg || 20) * 1.4), '#ff7a3d', false, 'elite');
      addHazard(e.x, e.y, 40, 2.6, Math.max(6, (e.dmg || 20) * 0.35), true);
      addText(e.x, e.y - 26, '爆裂！', '#ff9d4d', 12);
    }
    if(e.type === 'pudding'){
      for(let i = 0; i < 3; i++) spawnMini(e.x + rand(-16, 16), e.y + rand(-16, 16));
    }
    if(e.poison) addHazard(e.x, e.y, 30, 5.5, Math.max(6, e.dmg * 0.5));
    if(Math.random() < 0.030 * (ST.luck || 1)) dropHeal(e.x, e.y, 0.10);
  }

  if(spend('kill')){
    HIT.e = e; HIT.dmg = hit ? hit.dmg : 0; HIT.crit = hit ? hit.crit : false;
    HIT.src = hit ? hit.src : SRC; HIT.elem = hit ? hit.elem : null;
    emit('kill', HIT);
  }
}

function forceLevelUp(){
  P.level++;
  onLevel();
  P.xp = 0;
  P.xpNext = nextXp();
  state.pending++;
  if(state.mode === 'playing') showLevelUp();
}

/* ---------------- 掉落 ---------------- */
function dropGem(x, y, val){
  for(let i = 0; i < gems.length; i++){
    const g = gems[i];
    if(Math.abs(g.x - x) < 26 && Math.abs(g.y - y) < 26){
      g.val += val;
      g.col = g.val >= 4 ? '#ffd166' : (g.val >= 2 ? '#a0ffb0' : '#7df9ff');
      return;
    }
  }
  if(gems.length > 900){
    const old = gems.shift();
    let best = -1, bd = 1e18;
    for(let i = 0; i < gems.length; i += 3){
      const d = (gems[i].x - old.x) ** 2 + (gems[i].y - old.y) ** 2;
      if(d < bd){ bd = d; best = i; }
    }
    if(best >= 0) gems[best].val += old.val;
    else val += old.val;
  }
  const col = val >= 4 ? '#ffd166' : (val >= 2 ? '#a0ffb0' : '#7df9ff');
  gems.push({ x, y, val, col, vx: rand(-30, 30), vy: rand(-30, 30), seed: rand(0, 10), life: 0 });
}

function dropHeal(x, y, ratio){
  if(drops.length >= 6) return;
  drops.push({ x, y, kind:'hp', val: ratio, seed: rand(0, 10), life: 0, vx: rand(-14, 14), vy: rand(-14, 14) });
}

function gainXp(n){
  /* 只在很后期轻踩一脚：构建已经成型，不需要每 10 秒弹一次窗 */
  const damp = P.level > 24 ? Math.max(0.70, 1 - (P.level - 24) * 0.04) : 1;
  P.xp += n * ST.xpMul * damp * (CHAR.xpMul || 1);
  while(P.xp >= P.xpNext){
    P.xp -= P.xpNext;
    P.level++;
    onLevel();
    P.xpNext = nextXp();
    state.pending++;
  }
  if(state.pending > 0 && state.mode === 'playing') showLevelUp();
}

/* ---------------- 玩家受伤 ---------------- */
/* 反伤伤害：荆棘之心让反伤可以暴击，这是"挨打流"的质变点 */
function thornsHit(base){
  if(ST && ST.thornCrit && Math.random() < (ST.crit || 0)) return base * (ST.critMul || 1.6);
  return base;
}

/* 【4.0】唯一的受伤入口。
   opt.kind：'hit'（弹幕 / 陷阱 / 技能）/ 'contact'（贴脸被咬）/ 'boss'
   ---------------------------------------------------------
   以前 applyContact 自己算护甲、自己做闪避判定，于是：
     · 护盾、格挡、反射装甲、护盾流Ⅱ —— 对接触伤害全部失效
     · 闪避被算了两次（applyContact 一次、hurtPlayer 一次）
     · 反伤、血泵、怒气这些"挨打触发"的齿轮，贴脸时全部哑火
   现在两条路合并成一条：所有减伤 / 触发都在这里发生一次，
   接触伤害只是"不吃全局无敌帧"的一种输入，而不是另一套规则。 */
function hurtPlayer(d, opt){
  const kind = (opt && opt.kind) || 'hit';
  const isContact = kind === 'contact';
  if(state.mode !== 'playing') return 0;
  /* 全局无敌帧只保护"一下一下打过来"的东西；
     接触伤害由每只怪自己的攻击间隔负责节奏，所以不吃这层。 */
  if(!isContact && P.invuln > 0) return 0;
  if(ST.dodge > 0 && Math.random() < ST.dodge){
    if(!isContact) P.invuln = 0.22;
    addText(P.x, P.y - 26, '闪避', '#a6ffcb', 11);
    P.dodgeProc = true;
    if(relic('phasecloak')) P.phaseT = 1.2;   /* 闪避后 1.2 秒冷却窗口 */
    emit('dodge', d);
    return 0;
  }
  /* 铁壁：曾经是"每 12 秒完全挡下一次伤害"。4.1 取消——
     一次性完全免伤和护甲是两套语言，玩家没法把它算进"我能挨几下"。
     它的价值已经折算成护甲点数（见 44-relics 的 ironwall）。 */
  /* 【4.1】减伤只有一个数字：护甲。
     ---------------------------------------------------------
     4.0 在护甲之外还并行着四条"免伤"：
       · 遗物 hurtTaken（整体受伤 ×0.85 ~ ×1.15）
       · 骑士格挡（18% 概率挡掉 45%）
       · 护盾期减伤 8% / 反射装甲 20%
       · 饲养员的宠物挡刀 ×0.72
     每一条单看都很小，但乘在一起之后，面板写着"护甲 40%"
     实际却只挨了三成伤害——数字永远对不上体感，玩家也学不会
     "到底该堆什么"。现在它们全部折算成护甲点数（见 50-state 的 armorPts），
     受伤只走一条乘法。

     闪避刻意**不**并进来：它是"没被打到"（判定根本没发生），
     不是"少挨一点"，两者在玩法上是两件事。 */
  let real = d * (1 - (ST.armor || 0));
  P.shieldHitT = 0;

  /* 3.0 护盾：先于生命值吸收。完全挡住时不掉血、不进重伤反馈。 */
  if(P.shield > 0){
    const left = shieldAbsorb(real);
    if(left <= 0.01){
      if(!isContact) P.invuln = 0.28;
      rageGainRaw(RES.rageGainHurt * 0.6);
      emit('hurt', 0);
      return 0;
    }
    real = left;
  }

  P.hp -= real;
  P.lastHurt = state.time;
  /* 【3.6】伤害归因统计（不参与玩法） */
  if(state.dmgSrc){
    state.dmgSrc[isContact ? 'contact' : (state.bossHit ? 'boss' : 'hit')] += real;
    if(!isContact) state.bossHit = false;
  }
  state.hurtAcc = (state.hurtAcc || 0) + real;
  /* 【4.0】全局无敌帧 0.50 → 0.30，而且它现在**只管弹幕 / 陷阱 / BOSS 技能**。
     接触伤害已经改成"每只怪自己的攻击间隔"（applyContact），不吃这层保护——
     所以"被 20 只怪围住"和"被 1 只怪咬"终于有密度差了，
     而弹幕仍然有一次呼吸的余地。这两件事本来就不该共用一个数值。 */
  if(!isContact) P.invuln = 0.30;
  /* 被咬的观感反馈走 applyContact 的 0.28 秒聚合，避免 5 只怪同帧咬出 5 次震屏 */
  if(!isContact){
    state.shake = Math.max(state.shake, 4.5);
    state.hurtFlash = 0.36;
    burst(P.x, P.y, '#ff6b8f', 10, 120);
    sfx('hurt');
  }
  /* 怒气：挨打也涨，而且是"被围"时最快的一条线 */
  rageGainRaw(RES.rageGainHurt);
  emit('hurt', real);
  /* 血泵：挨的打有一部分直接折算成怒气（骑士"越挨打越凶"的专属齿轮） */
  if(relic('bloodpump') && hasRage()) rageGainRaw(real * 0.30 * 0.22);
  /* 反伤：挨打当场扎回去。
     原来只有 applyContact 里 0.35 秒一跳的持续反伤，打你一下完全没有反馈，
     玩家自然断定"反伤根本没触发"。这里补一个即时反馈 + 飘字。
     【4.0】贴脸（contact）不再走这一段：applyContact 自己有一条 0.25 秒的
     持续反伤，如果这里再扎一次，被围的时候反伤会翻倍——那是重复计算，不是加强。 */
  if(ST.thorns > 0 && !isContact){
    const refl = thornsHit(ST.thorns);
    eachNear(P.x, P.y, 54, function(o){
      dealDamage(o, refl, { src:'thorns' });
      burst(o.x, o.y, '#ffb0c4', 2, 80, 0);
    });
    addText(P.x, P.y - 40, '反伤 ' + Math.round(refl), '#ffb0c4', 10);
    rings.push({ x:P.x, y:P.y, r0:8, r1:40, life:0.18, max:0.18, col:'#ffb0c4', w:2 });
  }
  if(P.hp <= 0){
    P.hp = 0;
    gameOver();
  }
  return real;
}

/* =========================================================
   10. 生成敌人
   ========================================================= */
/* 每种怪的出场窗口：早期杂兵到点就退场，不会 10 分钟还在刷果冻 */
const SPAWN_TABLE = [
  { id:'slime',    from:0,   to:150, w:30 },
  { id:'carrot',   from:15,  to:210, w:22 },
  { id:'bat',      from:32,  to:240, w:20 },
  /* 远程线（3.3 加密）
     之前三种远程兵权重都只有 4，而且时间窗互不重叠——
     全表权重合计 150~200，远程只占 2%~6%，实测 10 分钟场上常年 0~2 只远程怪，
     玩家站着不动也不会被打到。
     现在：
       · 权重 4 → 6~8（约占刷怪的 10%~15%，原来只有 2%~6%）
       · 改成**两档并存**：中距离的喷吐/豌豆常驻，远距离的狙击与抛掷在后期接力
       · thrower 重新启用（后期超远抛掷，落点有预警圈，能躲）
     颜色仍然分段：早期粉(豌豆) → 中后期橙(喷吐/抛掷) + 深红(狙击)。 */
  { id:'shooter',  from:40,  to:300, w:8 },
  { id:'spitter',  from:200, to:99999, w:7 },
  /* 【3.5】狙击 / 抛掷提前登场（420→330、540→440）。
     实测中段（5~8 分钟）远程怪只有 2~4 只，占同屏 7%：
     近战怪被 AOE 清光，远程又还没上线，于是"炮台/召唤"这类大范围角色
     在中段几乎不掉血。远程是最难被 AOE 顺手清掉的威胁——
     让它在 5:30 就位，中段才有"必须走位"的理由。 */
  { id:'sniper',   from:330, to:99999, w:7 },
  { id:'thrower',  from:440, to:99999, w:6 },
  { id:'bomb',     from:62,  to:330, w:14 },
  { id:'pudding',  from:75,  to:360, w:13 },
  /* 汉堡 / 毒蘑菇不再到点退场：它们是后半场（和无尽）的主力杂兵，
     否则 10 分钟之后场上只剩重甲兵与疾行者，观感非常单调 */
  { id:'burger',   from:90,  to:99999, w:12 },
  { id:'ghost',    from:105, to:420, w:12 },
  { id:'frog',     from:120, to:450, w:13 },
  { id:'bee',      from:135, to:420, w:13 },
  { id:'mushroom', from:150, to:99999, w:10 },
  { id:'iron',     from:175, to:99999, w:9 },
  { id:'ant',      from:195, to:420, w:13 },
  { id:'brute',    from:240, to:99999, w:11 },
  { id:'runner',   from:300, to:99999, w:11 },
  { id:'nest',     from:360, to:99999, w:7 }
];

/* 小怪血量倍率：只跟时间有关 */
function enemyHpMul(t){
  /* 【2.6】同屏上限压到 235 之后，血量倍率补上来：
     怪少了 25%，但每只更硬——压力靠"耐打"，不靠"堆数量"（堆数量就是卡顿）。 */
  return 1 + t * 0.018 + Math.pow(t / 60, 2.3) * 0.34;
}

/* 【4.0】远程配额：从"场上最多 8/12/18 只"改成**威胁占比**。
   ---------------------------------------------------------
   写死只数的问题：远程怪之间差异巨大（狙击 34 血 vs 抛掷 72 血），
   "最多 18 只"在全是狙击时是灾难，在全是抛掷时又不够。
   现在比的是"远程占全场威胁的比例"，超过 38% 就暂时改刷近战。
   这样远程的存在感是恒定的，而不会随刷到哪种远程而抖。 */
const RANGED_SHARE = 0.38;

function pickType(budget){
  const t = state.time;
  const share = rangedThreatShare();
  const bag = [];
  for(let i = 0; i < SPAWN_TABLE.length; i++){
    const row = SPAWN_TABLE[i];
    if(t < row.from || t >= row.to) continue;
    const def = ENEMIES[row.id];
    if(!def) continue;
    if(def.shot && share > RANGED_SHARE) continue;
    const c = unitThreat(def, row.id);
    if(budget !== undefined && c > budget) continue;
    /* 便宜的多、贵的少：1/cost^0.55 让"堆杂兵"仍然是基本盘，
       但重甲 / 巢母这种高威胁单位会以能感知的频率出现。 */
    bag.push([row.id, 1 / Math.pow(c, 0.55)]);
  }
  if(!bag.length){
    if(budget !== undefined) return null;
    bag.push(['slime', 1]);
  }
  let total = 0;
  for(const b of bag) total += b[1];
  let r = Math.random() * total;
  for(const b of bag){
    r -= b[1];
    if(r <= 0) return b[0];
  }
  return bag[0][0];
}

/* 【3.5】刷怪点：从"均匀环形"改成"拦截式"
   ---------------------------------------------------------
   实测（tools/probe.mjs）：中后期同屏 230 只怪，但贴身（<70px）只有 1~2 只，
   最近 240px 内的平均距离还从 158px 一路涨到 186px。
   也就是说**怪根本追不上玩家**：玩家速度 130~150，慢怪后期也才 55~70，
   怪刷在 352px 外，玩家一直朝一个方向跑，它们永远隔着 200px 追。
   "同屏 230 只"是个假数字——威胁密度才是真的，而它一直在降。

   所以布点改为按移动方向拦截：
     · 62% 刷在玩家前进方向 ±62° 的扇形里（跑到哪里都撞上）
     · 38% 保持均匀环形（保留"从背后包上来"的压迫感）
   前期没有移动方向（P.mx/P.my 近似 0）时自动退回均匀环形。 */
function spawnPoint(){
  const maxR = Math.max(W, H);
  const mvx = P ? (P.mx || 0) : 0;
  const mvy = P ? (P.my || 0) : 0;
  /* 拦截强度也走曲线：前 2 分钟几乎不拦（等于原版环形刷），
     之后线性升到 52%。这样"前期是原样、后期才收紧"，
     而不是一上来就把所有人都按住。 */
  const t = state.time;
  const k = Math.min(1, Math.max(0, (t - 120) / 300));
  const biasPct = 0.10 + k * 0.42;
  const bias = Math.hypot(mvx, mvy) > 0.25 && Math.random() < biasPct;
  const baseA = bias ? Math.atan2(mvy, mvx) : rand(0, TAU);
  /* 半径从 0.55 收到 0.44：拦在前面的怪如果还在 352px 外，等于没拦。 */
  const biasRad = 0.55 - k * 0.08;
  for(let i = 0; i < 30; i++){
    const a = bias ? baseA + rand(-1.5 + k * 0.40, 1.5 - k * 0.40) : rand(0, TAU);
    const rad = maxR * (bias ? biasRad : 0.55) * rand(0.94, 1.06);
    const x = P.x + Math.cos(a) * rad;
    const y = P.y + Math.sin(a) * rad;
    if(x < 26 || y < 26 || x > ARENA.w - 26 || y > ARENA.h - 26) continue;
    if(x > cam.x - 6 && x < cam.x + W + 6 && y > cam.y - 6 && y < cam.y + H + 6) continue;
    return { x, y };
  }
  return {
    x: clamp(P.x + rand(-1, 1) * 340, 26, ARENA.w - 26),
    y: clamp(P.y + rand(-1, 1) * 220, 26, ARENA.h - 26)
  };
}

/* 同屏上限（幕段台阶）
   第一段沿用原公式（120 + t×0.32，到 168），所以**前 2.5 分钟和改前完全一样**；
   之后才逐幕抬高：190 → 250 → 300 → 340。
   台阶而不是一条直斜线，是因为"压力"要能被玩家感知成"这一幕更挤了"，
   而不是一根感觉不到的缓坡。 */
function actSpawnCap(t){
  if(t < 150) return 120 + t * 0.32;
  if(t < 330) return 190;
  if(t < 480) return 250;
  if(t < 600) return 300;
  return 340;
}

function addEnemy(type, px, py){
  const def = ENEMIES[type];
  if(!def) return;
  /* 最后一道闸：同屏上限随时间放开。
     【3.5】原来 235 在 t≈360 秒就封顶，之后"玩家 DPS"变成唯一的压力来源——
     你越强，怪越是被秒，缺口永远补不上，中后期自然就"随便打"。
     现在继续放开到 320（600 秒到顶），并且**按幕段给台阶**，
     让每一幕的上限都明显高于上一幕，而不是一条斜率递减的平滑线。
     320 是基于原 235 只的渲染实测：单帧更新仍在一档内，没有为难度牺牲帧率。 */
  const capNow = actSpawnCap(state.time);
  if(enemies.length >= capNow) return;
  const t = state.time;
  /* 小怪血量：前 2 分钟几乎不变，之后按 3 次方抬。
     目标不是"更难打死"，而是"后期杂兵不会一发就没"。 */
  const hpMul = enemyHpMul(t);
  /* 速度只跟时间线性长；"追不上玩家"这件事交给每只怪自己的饿意（见 64-update）。
     全局速度地板那种写法会让所有怪一起变快，观感像"集体瞬移"。 */
  const spdMul = 1.06 + Math.min(1.15, t * 0.0019);
  /* 【5.0】基础伤害重新定过（杂兵 26~58），曲线只到 2.45 倍 ——
     于是"一口占多少血"从第 1 分钟到第 10 分钟基本恒定。 */
  const dmgNow = def.dmg * atkCurve(t);
  const p = (px === undefined) ? spawnPoint() : { x:px, y:py };
  enemies.push({
    id: uid++,
    type, spr: def.spr, sc: def.sc || 1, big: false,
    x: p.x, y: p.y,
    hp: def.hp * hpMul * 0.72, maxHp: def.hp * hpMul * 0.72,
    speed: def.spd * spdMul * rand(0.92, 1.08) * (relic('greedpact') ? 1.20 : 1),
    r: def.r, dmg: dmgNow, slowT: 0, stun: 0,
    armor: def.armor || 0, knockRes: def.knockRes || 0,
    xp: Math.max(1, Math.round(def.xp * (1 + t * 0.0035 + Math.pow(t / 60, 2.1) * 0.05))),
    col: def.col, ai: def.ai || 'chase',
    alpha: def.alpha || 1, poison: !!def.poison, circleT: 0, shot: def.shot || null,
    flash:0, hitT:0, atkCd:0, banCd:0, seed: rand(0,10), anim:0,
    dashState:'walk', dashT: rand(1.2, 2.8), dashDir: 0, dashV: 0,
    /* 【4.1】威胁成本 / 饿意。韧性（破韧）已删除。 */
    threat: unitThreat(def, type),
    /* 【4.2】接触伤害改成"贴着就一直掉血"，怪不再需要攻击冷却 */
    hunt: 0,
    st: null, dead:false
  });
}

/* 【4.0】旧的"速度地板"已经删除。
   它把"怪追不上玩家"这个个体行为问题，用一个全局常数（玩家速度的 75%）去补，
   副作用是后期所有慢怪一起暴涨到同一个速度——玩家看到的是"集体瞬移"。
   现在由每只怪自己的饿意（64-update.js）负责：追得越久越快，咬到就消退。 */

function spawnMini(x, y){
  if(enemies.length >= actSpawnCap(state.time)) return;
  const t = state.time;
  const hpMul = 0.55 * (1 + t * 0.045 + Math.pow(t / 60, 3.0) * 0.55);
  /* 【4.0】分裂小怪也走统一攻击曲线（原来是自己写的一条 1+t*0.0035），
     并且补齐 threat 等字段 —— 少任何一个字段，
     它就绕过了刷怪经济、削韧和咬击节奏，变成"规则之外的东西"。 */
  const defMini = { hp:7, dmg:16, spd:48, r:3.8 };
  enemies.push({
    id: uid++, type:'slime', spr:'slime', sc:0.62, big:false,
    x, y, hp: 7*hpMul, maxHp: 7*hpMul,
    speed: 48 * (1 + Math.min(0.4, t * 0.001)),
    slowT: 0, stun: 0,
    r: 3.8, dmg: defMini.dmg * atkCurve(t), xp: 1, col:'#7fe08a', ai:'chase',
    threat: unitThreat(defMini, 'slime'),
    threat: unitThreat(defMini, 'slime'),
    hunt: 0,
    flash:0, hitT:0, atkCd:0, banCd:0, seed:rand(0,10), anim:0,
    dashState:'walk', dashT:1, dashDir:0, dashV:0, st:null, dead:false
  });
}

function spawnWave(){
  const t = state.time;
  const cap = actSpawnCap(t);
  /* 【4.0】刷怪改成"威胁预算"经济：
     每秒拿到 spawnBudget(t) 点额度，每只怪按自己的威胁成本计价，
     买完为止。加一种新怪只要给它定价，不用再去手调权重平衡。
     这样"混编"才有意义：同一笔预算，可以买一群蚂蚁，也可以买一只重甲。 */
  const interval = Math.max(0.26, 0.86 - t * 0.0011);
  let budget = spawnBudget(t) * interval * (state.bossAlive ? 2.0 : 1);
  let guard = 0;
  while(budget > 0.75 && enemies.length < cap && guard++ < 48){
    const ty = pickType(budget);
    if(!ty) break;
    const def = ENEMIES[ty];
    const pack = (ty === 'ant') ? 3 : 1;
    for(let k = 0; k < pack; k++){
      if(enemies.length >= cap) break;
      addEnemy(ty);
    }
    budget -= unitThreat(def, ty) * pack;
  }
  state.spawn = interval;
}

function spawnHorde(){
  const capH = actSpawnCap(state.time) + 70;
  if(enemies.length >= capH) return;
  const t = state.time;
  /* 【4.0】怪潮不再是"12 + 时间/45 只"，而是**一次性投入 5 秒的吞吐预算**。
     原来那个公式和刷怪经济完全脱钩：它不看怪多重、不看玩家清得多快，
     加一种新怪就要重新调一次 n。现在怪潮只是"把接下来 5 秒该刷的怪
     一次性堆到视野外"，和常规刷怪共用同一套威胁定价——
     强怪自动更少、弱怪自动更多，不需要第二套规则。 */
  let budget = spawnBudget(t) * 5.0;
  const plan = [];
  let guard = 0;
  while(budget > 0.75 && plan.length < 90 && guard++ < 60){
    const ty = pickType(budget);
    if(!ty) break;
    const def = ENEMIES[ty];
    plan.push(ty);
    budget -= unitThreat(def, ty);
  }
  const n = plan.length;
  if(!n) return;
  /* 【3.4】怪潮半径 250~330 → 400~500。
     原来这一圈是刷在**屏幕里面**的：玩家眼前突然凭空长出一圈怪，
     如果恰好抽到幽灵（半透明 + 冲刺），1.3 秒内就集体糊到身上，
     玩家连"它们从哪来"都看不清。
     现在刷在视野边缘以外，配合下面那个从 340 收到 250 的预警环，
     玩家有大约 1.5 秒反应时间——怪潮依然是压力，但不再是偷袭。 */
  for(let i = 0; i < n; i++){
    if(enemies.length >= capH) break;
    const a = (i / n) * TAU + rand(-0.08, 0.08);
    const d = rand(340, 430);
    addEnemy(plan[i], clamp(P.x + Math.cos(a) * d, 26, ARENA.w - 26),
                       clamp(P.y + Math.sin(a) * d, 26, ARENA.h - 26));
  }
  showToast('怪潮来袭！');
  sfx('swarm');
  rings.push({ x:P.x, y:P.y, r0:340, r1:250, life:0.7, max:0.7, col:'#ff8fb0', w:2 });
}

function spawnElite(){ spawnEliteAt(); }

function spawnEliteAt(x, y, type){
  if(enemies.length >= actSpawnCap(state.time) + 20) return;
  addEnemy(type || pickType(), x, y);
  const e = enemies[enemies.length - 1];
  if(!e || e.big) return;
  e.elite = true;
  e.sc *= 1.9;
  e.r *= 1.7;
  /* 精英血量按 BOSS 的比例定，而不是"怪种 ×固定倍数"。 */
  const bossBase = bossHpMul(state.time, state.bossIdx) * 1650;
  e.hp = e.maxHp = Math.min(Math.max(e.maxHp * 8, bossBase * 0.16), bossBase * 0.28);
  e.armor = 0.20;
  e.knockRes = 0.6;
  e.speed = Math.min(e.speed * 0.88, 92);
  e.dmg *= 2.2;
  e.xp = Math.round(e.xp * 12);

  /* 【3.0】精英不再只是"血厚的墙"：给它们一条行为词缀。
     以前精英 = 血×8、攻×2.2、速×0.88，本质上是一个会走的血包；
     现在至少有一件事需要玩家应对：
       charge  周期性蓄力冲撞（有 0.5 秒前摇，能躲）
       summon  定期召唤两只小怪（放着不管会越来越多）
       volatile 死亡时大范围爆炸（近战要算好距离） */
  const pool = ['charge', 'summon', 'volatile'];
  e.affix = pickOne(pool);
  if(e.affix === 'charge'){ e.hp = e.maxHp = Math.round(e.maxHp * 0.88); }
  else if(e.affix === 'summon'){ e.hp = e.maxHp = Math.round(e.maxHp * 1.05); }
  else { e.hp = e.maxHp = Math.round(e.maxHp * 0.92); }
  e.affixT = rand(1.6, 3.2);
  e.affixState = 'idle';

  const label = e.affix === 'charge' ? '冲锋' : (e.affix === 'summon' ? '召唤' : '爆裂');
  addText(e.x, e.y - 22, '✦ 精英 · ' + label, '#ffd166', 12);
}

/* BOSS：血量走**固定曲线**（只跟时间与第几只有关，绝不参考玩家数值）。
   曲线由 tools/balance.mjs 采集的人群 DPS 中位数反推，保证：
   成型 build 打 10–18 秒，弱 build 打不动 → 该被淘汰就被淘汰。 */
function bossHpMul(t, idx){
  /* 【5.0】8.2 × (t/60)^0.97 → 3.6 × (t/60)^1.00。
     ---------------------------------------------------------
     旧系数在 110 秒（第一个 BOSS）给出 21,500 血：
     当时玩家的实际输出大约 550 DPS，也就是说**第一个 BOSS 要打 40 秒**，
     而场上的杂兵还在源源不断刷。这不是"BOSS 很强"，
     这是"BOSS 变成了一场 40 秒的消耗战"——玩家感觉不到 BOSS 的威胁，
     只感觉到打得烦；打得久反而把难度转移给了杂兵。

     5.0 的方向是**短而危险的战斗**：
       · 第一个 BOSS 约 9,500 血 → 成型一半的构筑 15~20 秒打完
       · 10 分钟终局 BOSS 约 13 万血 → 成型的构筑 20 秒左右
       · 单次贴身伤害从 11~19 提到 46~70（见 46-enemies）
     于是"打 BOSS"变成一段需要专心走位的高压时间，而不是磨血。
     曲线仍然跟时间走，不跟玩家数值走——你变强就是打得更快。 */
  const m = 3.6 * Math.pow(Math.max(30, t) / 60, 1.00);
  return m * (1 + Math.min(9, idx) * 0.03);
}

function spawnBoss(keyOverride){
  const keys = ['candyKing', 'colaKing', 'burgerKing', 'jellyPope', 'veggieQueen', 'puddingTyrant'];
  const key = keyOverride || keys[state.bossIdx % keys.length];
  const def = BOSSES[key];
  const t = state.time;
  const idx = state.bossIdx;
  const hp = def.hp * bossHpMul(t, idx);

  const a = rand(0, TAU);
  const x = clamp(P.x + Math.cos(a) * 210, 40, ARENA.w - 40);
  const y = clamp(P.y + Math.sin(a) * 210, 40, ARENA.h - 40);
  enemies.push({
    id: uid++, type:'boss', bossType:key, name:def.name,
    spr:def.spr, sc:def.sc, big:true,
    x, y, hp: hp, maxHp: hp,
    /* 【2.6】BOSS 移速 ×2.2：原来 spd 20~30，玩家 94~108，
       BOSS 永远是"乌龟爬"，打不到人也就没有压力。 */
    speed: def.spd * 2.2 * (1 + Math.min(0.9, t * 0.0022)), slowT: 0, r: def.r,
    /* BOSS 血量涨了约 3 倍，玩家站桩时间也变 3 倍。
       技能伤害同步下调，否则"打得久"就变成"必被磨死"。 */
    /* 【4.0】BOSS 伤害走和杂兵同一条攻击曲线：它是一个绝对量，
       玩家的护甲 / 生命堆多少就吃多少，不再按 maxHp 百分比兜底。
       数值下调是因为"百分比地板"被拿掉了（见 bossDmg）。 */
    /* 【5.0】BOSS 贴身伤害 46~70（4.x 只有 11~19），
       配合 0.9 秒的咬击节奏，站桩吃三下就该死。 */
    dmg: def.dmg * atkCurve(t), xp: def.xp,
    col: def.col, crown: def.crown, ai: def.ai,
    flash:0, hitT:0, atkCd:1.6, banCd:0, seed:rand(0,10), anim:0,
    dashState:'walk', dashT:3, dashDir:0, dashV:0, dashQueue: 0,
    spiral: 0, spiralA: 0, spiralT: 0, spiralDir: 1,
    skillCd: 2.0, skill2Cd: 4.6, phase: 0, st:null, dead:false,
    spawnT: state.time,
    final: false
  });
  /* 【2.6】登场不再"清场"，只把 BOSS 附近的杂兵震退 300 像素。
     原来 boss 一出场就把全场小怪判死，结果 BOSS 反而成了最安全的时间段——
     压力源被 BOSS 自己清掉了。现在小怪留着，只是让出一个圈。 */
  let cleared = 0;
  for(let i = 0; i < enemies.length; i++){
    const o = enemies[i];
    if(o.big || o.dead) continue;
    const dd = dist(o.x, o.y, x, y);
    if(dd > 300) continue;
    const a2 = Math.atan2(o.y - y, o.x - x) || rand(0, TAU);
    const push = 300 - dd + 30;
    o.x = clamp(o.x + Math.cos(a2) * push, 10, ARENA.w - 10);
    o.y = clamp(o.y + Math.sin(a2) * push, 10, ARENA.h - 10);
    cleared++;
  }
  for(let r = 0; r < 3; r++){
    rings.push({ x, y, r0: 20 + r * 40, r1: 210 + r * 90, life: 0.55 + r * 0.12, max: 0.55 + r * 0.12,
      col: r === 0 ? '#ffffff' : def.col, w: 3 });
  }
  burst(x, y, '#fff6c8', 26, 220);
  if(cleared > 0) addText(x, y - 40, '杂兵被震退！', '#ffe066', 12);

  state.bossIdx++;
  state.bossAt = state.time + 90;
  showToast(def.hint || ('⚠ ' + def.name + ' 出现了！'));
  bgmSetBoss(true);
  sfx('boss');
  state.shake = 7;
  state.flash = 0.18;
}

/* 终局 BOSS：10 分钟一到，「拖鞋之王」登场，击败它就是通关 */
function spawnFinalBoss(){
  if(state.finalSpawned) return;
  state.finalSpawned = true;
  spawnBoss('slipperKing');
  const e = enemies[enemies.length - 1];
  if(e){ e.final = true; state.finalEnemy = e.id; }
  state.bossAt = 1e9;          /* 终局之后不再刷常规 BOSS */
  state.flash = 0.42;
  state.shake = 10;
  addText(P.x, P.y - 46, '最 终 BOSS', '#fff3b0', 18);
  rings.push({ x:P.x, y:P.y, r0:20, r1:260, life:0.9, max:0.9, col:'#ffd166', w:5 });
}

/* 通关计时：**不能只放在 updateGame 里**。
   击杀终局 BOSS 会顺带 forceLevelUp()，此时 mode 变成 'levelup'，
   updateGame 不再推进，胜利结算就永远等不到。
   所以用真实时间倒数，每帧无条件检查（除了已经在结算的状态）。 */
function checkWin(dt){
  if(state.mode === 'victory' || state.mode === 'gameover') return false;
  if(!(state.winT > 0)) return false;
  state.winT -= dt;
  if(state.winT > 0) return false;
  state.winT = 0;
  victory();
  return true;
}

/* --- 地面毒雾 --- */
function addHazard(x, y, r, life, dmg, fire){
  if(hazards.length >= 26) return;
  hazards.push({ x, y, r, life, max: life, dmg, tickT: 0.45, seed: rand(0, 10), fire: !!fire });
}

/* --- 激光 --- */
function fireBeam(x, y, ang, len, width, dmg, src){
  beams.push({ x, y, ang, len, width, life: 0.2, max: 0.2, src: src || 'beam', col:'#ff7ae0' });
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const mx = x + dx * len * 0.5, my = y + dy * len * 0.5;
  const s = src || 'beam';
  eachNear(mx, my, len * 0.5 + width, function(e){
    const rx = e.x - x, ry = e.y - y;
    const t = rx * dx + ry * dy;
    if(t < -e.r || t > len + e.r) return;
    const px = x + dx * clamp(t, 0, len);
    const py = y + dy * clamp(t, 0, len);
    if(dist(px, py, e.x, e.y) < width * 0.5 + e.r) dealDamage(e, dmg, { src: s });
  });
}

/* --- 敌弹 --- */
function shootAt(x, y, tx, ty, spd, dmg, col, homing, opt){
  if(ebullets.length > 70) return;
  const o = opt || {};
  const a = Math.atan2(ty - y, tx - x);
  ebullets.push({
    x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
    r: o.r || 4, dmg, col, life: o.life || 4.5,
    homing: homing || 0, boom: o.boom || 0
  });
}
function shootRing(x, y, n, spd, dmg, col, off){
  if(ebullets.length > 70) return;
  for(let i = 0; i < n; i++){
    const a = (off || 0) + i * TAU / n;
    ebullets.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r:4.5, dmg, col, life:5.5, homing:0 });
  }
}

/* --- 自爆番茄 --- */
function enemySelfDestruct(e){
  e.dead = true;
  state.shake = Math.max(state.shake, 4.5);
  explode(e.x, e.y, 50, 58 * atkCurve(state.time), '#ff8a5c');
  /* 自爆 = "比咬一口重得多的那一下"，所以走同一个 e.dmg 的倍率，
     而不是 e.dmg + 12（那 12 点在 1 分钟时占七成，10 分钟后可以忽略——
     又是一个"只在前 3 分钟有存在感"的常数）。 */
  if(dist(e.x, e.y, P.x, P.y) < 50 + P.r) hurtPlayer(e.dmg * 1.85);
}
/* =========================================================
   11. 更新
   ========================================================= */
function updateGame(dt){
  state.time += dt;
  resetBudget();
  resFrameReset(dt);

  /* --- 玩家移动 --- */
  let mx = 0, my = 0;
  if(keys['a'] || keys['arrowleft'])  mx--;
  if(keys['d'] || keys['arrowright']) mx++;
  if(keys['w'] || keys['arrowup'])    my--;
  if(keys['s'] || keys['arrowdown'])  my++;
  if(mx || my){
    const l = Math.hypot(mx, my);
    mx /= l; my /= l;
    /* 【3.5】记录平滑后的移动方向，供刷怪点做"拦截式"布点。
       直接读 keys 会在松手的瞬间丢方向，平滑之后刷怪点不会抖。 */
    P.mx = (P.mx || 0) * 0.86 + mx * 0.14;
    P.my = (P.my || 0) * 0.86 + my * 0.14;
    P.moving = true;
    P.stillT = 0;                        /* 「惯性」：一动就断 */
    P.anim += dt * (1 + Math.hypot(mx, my));
    if(mx > 0.1) P.facing = 1;
    else if(mx < -0.1) P.facing = -1;
  } else {
    P.mx = (P.mx || 0) * 0.90;
    P.my = (P.my || 0) * 0.90;
    P.moving = false;
    P.stillT = (P.stillT || 0) + dt;     /* 站定计时，供「惯性」判定 */
    P.anim += dt * 0.4;
  }
  /* 盾电池：护盾还在时跑得更快 */
  const shieldSpd = (P.shield > 0 && relic('shdbattery')) ? 1.06 : 1;
  const spd = ST.speed * shieldSpd;
  P.x = clamp(P.x + mx * spd * dt, 14, ARENA.w - 14);
  P.y = clamp(P.y + my * spd * dt, 14, ARENA.h - 14);
  /* 【4.0】冲刺：被围时唯一的解，也是"顺势"输出的来源 */
  dashTick(dt);

  /* 【5.0】接触伤害的冷却按真实时间流逝。
     放在这里（而不是 applyContact 里）是为了让"离开接触"不冻结冷却：
     撞上去的第一口永远立刻结算，之后才是每 contactTick 一次。 */
  if(P.contactT > 0) P.contactT = Math.max(0, P.contactT - dt);

  if(P.invuln > 0) P.invuln -= dt;
  /* 【4.1 难度】脱战恢复：3.5 秒 / 1.8%/秒 → **4.5 秒 / 0.18%/秒**。
     ---------------------------------------------------------
     1.8%/秒意味着"风筝 6 秒回满 11% 血"，而清场本来就需要不停走位——
     于是每个角色都能自愈，掉血在结算面板上很难看，手感上却不存在。
     现在：脱战只能把你从"快死"拉回"还能再打一波"，不能当饭吃。 */
  if(P.lastHurt === undefined) P.lastHurt = -99;
  if(state.time - P.lastHurt > 4.5 && P.hp < P.maxHp){
    /* 【5.0】脱战恢复改走治疗池。
       它原来是 healRaw（不受预算限制），而它是**按最大生命百分比**给的：
       1300 血的骑士脱战 5 秒就有 2.4 HP/秒的免费回复，叠在治疗桶之上，
       等于一个隐形血包。被动治疗只有一条路：healPlayer。 */
    healPlayer(P.maxHp * 0.0018 * dt);
  }
  if(state.hurtFlash > 0) state.hurtFlash -= dt;
  if(state.flash > 0) state.flash -= dt * 3.2;
  if(state.slow > 0) state.slow -= dt;
  if(state.shake > 0) state.shake = Math.max(0, state.shake - dt * 20);
  if(state.shakeCd > 0) state.shakeCd -= dt;
  if(state.hitstopCd > 0) state.hitstopCd -= dt;
  /* 愈合结晶：每 5 秒固定回 1.2%/级。独立节奏，不和击杀回血共用一个池，
     否则「愈合 2 级 = 0.9%/秒」会把击杀回血完全压死（旧版就是这样）。 */
  if(ST.regenLv > 0){
    P.regenT = (P.regenT === undefined ? 5 : P.regenT) - dt;
    if(P.regenT <= 0){
      P.regenT = 5;
      if(P.hp < P.maxHp) healPlayer(P.maxHp * 0.012 * ST.regenLv * (ST.regenMul || 1));
    }
  }
  /* 治疗预算的"记忆"：回血速度按 0.5 秒的时间常数衰减。
     它只让"同一瞬间刷几十次回血"变得不划算，不会永久惩罚玩家。 */
  state._dt = dt;
  healPoolTick(dt);

  /* --- 角色机制 --- */
  if(CHAR.tick) CHAR.tick(dt);

  /* --- 流派机制计时（连击 / 锐气 / 环绕格挡） --- */
  schoolTick(dt);

  /* --- 3.0 通用资源：怒气 / 超载 / 护盾 / 吞噬 --- */
  resTick(dt);

  /* --- 相机 --- */
  const tx = clamp(P.x - W / 2, 0, ARENA.w - W);
  const ty = clamp(P.y - H / 2, 0, ARENA.h - H);
  const k = 1 - Math.pow(0.00001, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);

  /* --- DPS 估计（只用于统计与调试，不再影响 BOSS 血量） --- */
  if(state.time - (state.dpsT || 0) >= 1){
    state.dpsT = state.time;
    state.dps = lerp(state.dps || 80, state.dmgAcc || 0, 0.5);
    state.dmgAcc = 0;
    if(!state.dpsLog) state.dpsLog = [];
    if(state.dpsLog.length < 1400) state.dpsLog.push([Math.round(state.time), Math.round(state.dps)]);
    /* 审计用：每秒真实击杀 / 受伤 / 回血 */
    if(!state.rate) state.rate = [];
    if(state.rate.length < 1400){
      state.rate.push([Math.round(state.time),
        +(state.killAcc || 0).toFixed(2),
        Math.round(state.hurtAcc || 0),
        Math.round(state.healAcc || 0),
        Math.round(P.hp), Math.round(P.maxHp)]);
    }
    /* 武器 DPS 采样：遗物伤害上限的基准 */
    state.wpnDps = lerp(state.wpnDps || 120, state.wpnAcc || 0, 0.5);
    state.wpnAcc = 0;
    state.relicAcc = 0;
    state.thornsAcc = 0;
    state.killAcc = 0; state.hurtAcc = 0; state.healAcc = 0;
  }

  /* --- 幕与节奏 --- */
  directorTick(dt);

  /* --- 刷怪 --- */
  state.bossAlive = false;
  for(let i = 0; i < enemies.length; i++){ if(enemies[i].big && !enemies[i].dead){ state.bossAlive = true; break; } }
  state.spawn -= dt;
  if(state.spawn <= 0) spawnWave();
  if(state.time >= state.bossAt) spawnBoss();
  /* 【3.5】中后期加压：精英与怪潮都从"固定节拍"改成"随幕收紧"。
     原来精英永远是 55 秒 1 只、怪潮永远 40~52 秒一次——
     玩家在 3 分钟时就摸清了这两条节奏，之后它们只算"背景音"。
     现在精英间隔 58→40 秒、7 分钟后成对出现；怪潮 48→32 秒。 */
  if(state.time >= state.eliteAt){
    const t = state.time;
    state.eliteAt = t + Math.max(40, 58 - t * 0.032);
    spawnElite();
    if(t > 420) spawnElite();          /* 一幕之下成对压上来 */
  }
  if(state.time >= state.hordeAt){
    const t = state.time;
    state.hordeAt = t + Math.max(32, 48 - t * 0.030) + rand(0, 6);
    spawnHorde();
  }

  /* --- 血包补给 --- */
  state.dropTimer -= dt;
  if(state.dropTimer <= 0){
    state.dropTimer = rand(13, 18);
    if(drops.length < 3){
      const a = rand(0, TAU), d = rand(60, 165);
      dropHeal(clamp(P.x + Math.cos(a) * d, 30, ARENA.w - 30),
               clamp(P.y + Math.sin(a) * d, 30, ARENA.h - 30), 0.12);
    }
  }

  /* 持续型武器（喷火枪 / 光环 / 电锯…）不走进开火循环，
     但充能是"开火就要付出"的转速表，所以这里按时间扣同样的比例。 */
  for(const cid in P.weapons){
    const cw = WEAPONS[cid];
    if(cw && cw.continuous) chargeSpend(dt * 1.1);
  }

  /* --- 武器开火 --- */
  for(const id in P.weapons){
    const w = WEAPONS[id];
    const lv = P.weapons[id];
    if(!w) continue;
    if(w.continuous) continue;
    P.cds[id] = (P.cds[id] === undefined ? 0.3 : P.cds[id]) - dt;
    if(P.cds[id] <= 0){
      w.fire(lv);
      /* 充能是转速表：开火就是消耗。打得准（命中多）才补得回来。 */
      chargeSpend(1.6);
      if(hasMod(id, 'echo') && Math.random() < 0.50) w.fire(lv);
      /* 回响之心：每次开火 10% 概率让所有武器立刻再齐射一轮 */
      if(relic('echoheart') && !P.echoLock && Math.random() < 0.10){
        P.echoLock = true;
        volleyAll();
        P.echoLock = false;
      }
      /* 传导齿轮：开火给"别的武器"减 CD —— 整套构筑越转越快 */
      if(relic('chggear') && !P.gearLock && state.time - (P.gearT || -9) > 0.8){
        P.gearT = state.time;
        P.gearLock = true;
        for(const oid in P.weapons){
          if(oid === id) continue;
          if(P.cds[oid] > 0) P.cds[oid] = Math.max(0.05, P.cds[oid] - 0.35);
        }
        if(rings.length < 24) rings.push({ x:P.x, y:P.y, r0:6, r1:34, life:0.16, max:0.16, col:'#7ce3ff', w:2 });
        P.gearLock = false;
      }
      /* 超载：冷却减半（电容再叠 25%） */
      const overloadCd = P.overload > 0 ? (relic('chgcap') ? 0.40 : 0.50) : 1;
      /* 狂战：全角色通用的冷却缩减（骑士更狠） */
      const berserkCd = P.berserk > 0 ? (ST.berserkRate || 0.72) : 1;
      /* 怒爆脉冲：引爆后 2 秒冷却 -38% */
      const detCd = (P.rageHaste > 0) ? 0.625 : 1;
      P.cds[id] = w.stats(lv).cd * ST.cdMul * wCdMul(id)
        * (CHAR.fireMul ? CHAR.fireMul() : 1) * (P.bloodrageOn ? 0.6 : 1)
        * overloadCd * berserkCd * detCd * chargeRateMul();
      if(!P.cds[id] || P.cds[id] < 0.08) P.cds[id] = 0.08;
    }
  }

  /* --- 持续型武器 --- */
  updateContinuous(dt);
  updateMeleeContinuous(dt);
  updateSwings(dt);

  /* --- 友方单位 --- */
  updateAllies(dt);
  alliesTakeContact(dt);

  /* --- 遗物每帧逻辑 --- */
  tickRelics(dt);

  /* --- 玩家子弹 --- */
  updateBullets(dt);

  /* --- 敌人 AI + 状态 --- */
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    if(e.flash > 0) e.flash -= dt;
    if(e.hitT > 0) e.hitT -= dt;
    if(e.atkCd > 0) e.atkCd -= dt;
    if(e.banCd > 0) e.banCd -= dt;
    if(e.big) e.fightT = (e.fightT || 0) + dt;
    if(e.stun > 0){
      e.stun -= dt;
      tickStatus(e, dt);
      continue;
    }
    if(e.baseSpeed === undefined) e.baseSpeed = e.speed;
    if(e.slowT > 0){
      e.slowT -= dt;
      /* 【2.6】减速从"只剩 34% 速度"放宽到 62%。 */
      /* 冷冻Ⅰ：冰缓减速再强一档 */
      e.speed = e.baseSpeed * (ST.freezeTier >= 1 ? 0.48 : 0.62);
    } else if(e.speed !== e.baseSpeed){
      e.speed = e.baseSpeed;
    }
    /* 【3.0 根因修复】追击加速度：
       玩家移速 96~110，杂兵基础速度只有 17~40（乘上时间系数也就 40~90）。
       只要一直跑，杂兵永远追不上——这正是"场上 245 只怪、贴身数始终是 0"
       以及短射程武器（骰子 / 喷火）"整场打不到人"的同一个根因。
       规则：离玩家超过 200 像素开始加速，到 420 像素封顶 ×3。
       近身之后加速消失，所以贴脸战斗的手感不变。 */
    /* 【4.0】追击从"全局速度地板"改成每只怪自己的**饿意**。
       旧写法是"所有慢怪的速度不低于玩家速度的 75%"——那是拿一个
       全局常数去补一个个体行为问题，副作用是所有怪突然一起变快。
       现在：每只怪离你够远且一直没咬到你，就会慢慢加速（约 9 秒到顶，
       最高 2 倍速），一旦贴身就消退。于是"绕圈跑"不再是免费的，
       但也不会出现"所有怪一起瞬移上来"的观感。 */
    if(!e.big){
      const dd = dist(e.x, e.y, P.x, P.y);
      if(dd > 170) e.hunt = Math.min(1, (e.hunt || 0) + dt / 9);
      else e.hunt = Math.max(0, (e.hunt || 0) - dt / 2.2);
      if(e.hunt > 0) e.speed *= 1 + 1.0 * e.hunt;
    }
    tickStatus(e, dt);
    if(e.dead) continue;
    updateEnemyAI(e, dt);
  }

  gridBuild();
  separate();
  /* 【3.4】必须紧跟在 separate() 之后：分离力会把贴身单位互相挤开，
     方向与玩家无关，会把已经贴边的怪重新怼进身体里。见 holdBodyOut 注释。 */
  holdBodyOut();
  applyContact(dt);

  let anyDead = false;
  for(let i = 0; i < enemies.length; i++) if(enemies[i].dead){ anyDead = true; break; }
  if(anyDead) enemies = enemies.filter(e => !e.dead);

  /* --- 敌弹 --- */
  if(state.orbCd > 0) state.orbCd -= dt;
  for(let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    if(state.orbCd <= 0 && P.orbPos && P.orbPos.length){
      let blocked = false;
      for(let k2 = 0; k2 < P.orbPos.length; k2++){
        const o = P.orbPos[k2];
        if(dist(o.x, o.y, b.x, b.y) < o.r + b.r){ blocked = true; break; }
      }
      if(blocked){
        burst(b.x, b.y, '#ffe066', 5, 80, 0);
        state.orbCd = 0.42;
        ebullets.splice(i, 1);
        continue;
      }
    }
    b.life -= dt;
    if(b.homing){
      const a = Math.atan2(P.y - b.y, P.x - b.x);
      let cur = Math.atan2(b.vy, b.vx);
      let diff = a - cur;
      while(diff > Math.PI) diff -= TAU;
      while(diff < -Math.PI) diff += TAU;
      const na = cur + clamp(diff, -b.homing * dt, b.homing * dt);
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * sp;
      b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if(b.life <= 0 || b.x < -20 || b.y < -20 || b.x > ARENA.w + 20 || b.y > ARENA.h + 20){
      ebullets.splice(i, 1);
      continue;
    }
    const pdx = b.x - P.x, pdy = b.y - P.y;
    const pd = Math.hypot(pdx, pdy);
    if(pd < b.r + P.r){
      /* 【4.0】敌弹回到绝对伤害：b.dmg 来自 enemy.dmg × 倍率，
         而 enemy.dmg 走 atkCurve 曲线。不再有 maxHp 百分比地板。 */
      hurtPlayer(b.dmg);
      burst(b.x, b.y, b.col, 5, 70, 0);
      /* 投掷手的爆弹：命中时炸开一小片（伤害已在 hurtPlayer 里结算） */
      if(b.boom){
        rings.push({ x:b.x, y:b.y, r0:6, r1:b.boom, life:0.28, max:0.28, col:b.col, w:3 });
        burst(b.x, b.y, b.col, 12, 150, 0);
      }
      ebullets.splice(i, 1);
      continue;
    }
  }

  /* --- 经验宝石 --- */
  const pr = ST.pickup;
  for(let i = gems.length - 1; i >= 0; i--){
    const g = gems[i];
    g.life += dt;
    const d = dist(g.x, g.y, P.x, P.y);
    if(d < pr){
      const pull = 250 + (pr - d) * 10;
      const a = Math.atan2(P.y - g.y, P.x - g.x);
      g.vx = lerp(g.vx, Math.cos(a) * pull, 0.3);
      g.vy = lerp(g.vy, Math.sin(a) * pull, 0.3);
    } else {
      g.vx *= 0.9;
      g.vy *= 0.9;
    }
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    if(d < 13){
      gainXp(g.val);
      burst(g.x, g.y, g.col, 4, 55, 0);
      sfx('gem');
      emit('gem', g);
      gems.splice(i, 1);
    }
  }

  /* --- 血包 --- */
  for(let i = drops.length - 1; i >= 0; i--){
    const h = drops[i];
    h.life += dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.vx *= 0.9;
    h.vy *= 0.9;
    if(dist(h.x, h.y, P.x, P.y) < 15){
      const heal = P.maxHp * h.val;
      const got = healRaw(heal);
      addText(P.x, P.y - 22, '+' + Math.round(got || heal), '#8ee06b', 11);
      burst(h.x, h.y, '#8ee06b', 10, 100, 0);
      rings.push({ x:h.x, y:h.y, r0:4, r1:26, life:0.32, max:0.32, col:'#8ee06b', w:2 });
      sfx('gem');
      drops.splice(i, 1);
    }
  }

  /* --- 黑洞 --- */
  for(let i = holes.length - 1; i >= 0; i--){
    const h = holes[i];
    h.life -= dt;
    h.acc = (h.acc || 0) - dt;
    if(h.life <= 0){
      if(h.evo) explode(h.x, h.y, h.r * 0.95, h.dmg * 5, '#b98cff', false, 'hole');
      holes.splice(i, 1);
      continue;
    }
    const tickNow = h.acc <= 0;
    if(tickNow) h.acc = h.tick;
    eachNear(h.x, h.y, h.r, function(e){
      const d = dist(h.x, h.y, e.x, e.y);
      const a = Math.atan2(h.y - e.y, h.x - e.x);
      const pull = e.big ? 0 : (1 - d / h.r) * 88 * dt;
      e.x += Math.cos(a) * pull;
      e.y += Math.sin(a) * pull;
      if(tickNow) dealDamage(e, h.dmg, { src:'hole' });
    });
    if(hasMod('hole', 'chill')){
      eachNear(h.x, h.y, h.r, function(e){ if(e.slowT < 0.4) e.slowT = 0.5; });
    }
  }

  /* --- 地雷 --- */
  for(let i = mines.length - 1; i >= 0; i--){
    const m = mines[i];
    m.arm -= dt;
    m.life -= dt;
    if(m.life <= 0){ mines.splice(i, 1); continue; }
    if(m.arm > 0) continue;
    let trig = false;
    eachNear(m.x, m.y, m.r + 4, function(){ trig = true; });
    if(trig){
      explode(m.x, m.y, m.boom, m.dmg, '#ff5f8f', true, 'mine');
      if(m.evo) addHazard(m.x, m.y, m.boom * 0.65, 2.0, 4, true);
      if(hasMod('mine', 'venom')) addHazard(m.x, m.y, m.boom * 0.6, 2.4, 5, false);
      mines.splice(i, 1);
    }
  }

  /* --- 毒雾 / 火墙 --- */
  for(let i = hazards.length - 1; i >= 0; i--){
    const h = hazards[i];
    h.life -= dt;
    h.tickT -= dt;
    if(h.tickT <= 0){
      h.tickT = 0.6;
      if(dist(h.x, h.y, P.x, P.y) < h.r + P.r) hurtPlayer(h.dmg);
      if(h.fire){
        eachNear(h.x, h.y, h.r, function(e){ applyElem(e, 'fire', 1.2, h.dmg * 3, 'hazard'); });
      }
    }
    if(h.life <= 0) hazards.splice(i, 1);
  }

  /* --- 光柱 --- */
  for(let i = beams.length - 1; i >= 0; i--){
    beams[i].life -= dt;
    if(beams[i].life <= 0) beams.splice(i, 1);
  }

  /* --- 延迟技能 --- */
  for(let i = strikes.length - 1; i >= 0; i--){
    const s = strikes[i];
    s.delay -= dt;
    if(s.delay <= 0){
      const src = s.src || (s.kind === 'bomb' ? 'popcorn' : (s.kind === 'bubble' ? 'bubble' : 'bolt'));
      if(s.kind === 'bomb'){
        explode(s.x, s.y, s.r, s.dmg, s.col || '#ffe9b8', false, src);
        /* 高压锅觉醒：一炸同时挂火与冰，不用第二把元素武器也能搓反应 */
        if(s.elem === 'hotcold'){
          eachNear(s.x, s.y, s.r, function(e){
            if(e.dead) return;
            applyElem(e, 'fire', 2.6, s.dmg * 0.12, src);
            applyElem(e, 'ice', 2.6, s.dmg * 0.12, src);
          });
        }
      } else if(s.kind === 'bubble'){
        bubbleBoom(s.x, s.y, s.r, s.dmg, src);
      } else if(s.kind === 'slam'){
        for(let w = 0; w < (s.waves || 1); w++){
          const rr = s.r * (1 + w * 0.35);
          rings.push({ x:s.x, y:s.y, r0:rr * 0.3, r1:rr, life:0.3 + w * 0.08, max:0.3 + w * 0.08,
            col:'#e0c8ff', w:4 });
          eachNear(s.x, s.y, rr, function(e){
            dealDamage(e, s.dmg * (w === 0 ? 1 : 0.5), { src:'ladle' });
            if(!e.big && !e.dead){
              const a = Math.atan2(e.y - s.y, e.x - s.x);
              e.x += Math.cos(a) * 18; e.y += Math.sin(a) * 18;
              e.stun = Math.max(e.stun || 0, 0.4);
            }
          });
        }
        burst(s.x, s.y, '#e0c8ff', 20, 200);
        addShake(3);
      } else {
        eachNear(s.x, s.y, s.r, function(e){
          dealDamage(e, s.dmg, { src, elem: src === 'bolt' || src === 'totem' ? 'volt' : null });
          e.flash = 0.12;
        });
        rings.push({ x:s.x, y:s.y, r0:s.r*0.25, r1:s.r*1.7, life:0.28, max:0.28, col:'#ffe066', w:3 });
        burst(s.x, s.y, '#fff3a8', 12, 150);
        addShake(1.2);
        if(src === 'bolt' || src === 'totem'){
          eachNear(s.x, s.y, s.r, function(e){ applyElem(e, 'volt', 2.2, s.dmg * 0.25, src); });
        }
      }
      strikes.splice(i, 1);
    }
  }

  /* --- 特效 --- */
  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 240 * dt * (p.g === undefined ? 1 : p.g);
    p.vx *= 0.96;
  }
  for(let i = texts.length - 1; i >= 0; i--){
    const t = texts[i];
    t.life -= dt;
    t.y -= 28 * dt;
    if(t.life <= 0) texts.splice(i, 1);
  }
  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.life -= dt;
    if(r.life <= 0) rings.splice(i, 1);
  }

  updateHUD();
}

/* =========================================================
   武器：持续型（光环 / 环绕）
   ========================================================= */
function updateContinuous(dt){
  /* --- 回旋香蕉 --- */
  const blv = P.weapons.banana;
  P.orbPos = P.orbPos || [];
  P.orbPos.length = 0;
  if(blv){
    const s = WEAPONS.banana.stats(blv);
    const mul = ST.orbitMul || 1;
    P.orbAngle = (P.orbAngle || 0) + dt * s.rot;
    const dual = blv >= 5;
    const R = s.radius * ST.area * mul;
    P.orbR = R;
    const loops = dual ? 2 : 1;
    const dmg = s.dmg * wDmgMul('banana');
    for(let r = 0; r < loops; r++){
      const dir = r === 0 ? 1 : -1;
      const rr = r === 0 ? R : R * 0.64;
      const cnt = s.count;
      for(let i = 0; i < cnt; i++){
        const a = P.orbAngle * dir + i * TAU / cnt + r * 0.55;
        const bx = P.x + Math.cos(a) * rr;
        const by = P.y + Math.sin(a) * rr;
        if(P.orbPos.length < 24) P.orbPos.push({ x: bx, y: by, r: s.size + 2 });
        eachNear(bx, by, s.size + 8, function(e){
          if(e.banCd > 0) return;
          e.banCd = 0.3;
          dealDamage(e, dmg * (dual ? 1.3 : 1), { src:'banana' });
          hitMods(e, 'banana', dmg);
          burst(bx, by, '#ffe066', 2, 70, 0);
        });
      }
    }
  }

  /* --- 辣椒光环 --- */
  const alv = P.weapons.aura;
  if(alv){
    const as = WEAPONS.aura.stats(alv);
    const evo = alv >= 5;
    const R = as.radius * ST.area * ST.blast * (evo ? 1.3 : 1) * (hasMod('aura','size') ? 1.25 : 1);
    P.auraR = R;
    P.auraT = (P.auraT === undefined ? 0.2 : P.auraT) - dt;
    if(P.auraT <= 0){
      P.auraT = as.tick;
      P.auraPulse = 1;
      const dmg = as.dmg * wDmgMul('aura') * (evo ? 1.5 : 1);
      eachNear(P.x, P.y, R, function(e){
        dealDamage(e, dmg, { src:'aura', elem:'fire' });
        hitMods(e, 'aura', dmg);
        if(evo && !e.dead && !e.big){
          const a2 = Math.atan2(e.y - P.y, e.x - P.x);
          e.x += Math.cos(a2) * 8;
          e.y += Math.sin(a2) * 8;
        }
      });
      if(evo && rings.length < 22){
        rings.push({ x:P.x, y:P.y, r0:R * 0.35, r1:R, life:0.28, max:0.28, col:'#ff8a3d', w:2 });
      }
    }
    if(P.auraPulse > 0) P.auraPulse -= dt * 3.6;
  }
}

/* =========================================================
   子弹更新（含元素、弹跳、回旋镖回程）
   ========================================================= */
function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.life -= dt;

    /* 回旋镖：飞到一半掉头追玩家 */
    if(b.type === 'boomerang' && !b.returning && b.trav !== undefined && b.range && b.trav > b.range * 0.55){
      b.returning = true;
      b.hitSet.clear();
    }
    if(b.returning){
      const a = Math.atan2(P.y - b.y, P.x - b.x);
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = lerp(b.vx, Math.cos(a) * sp, 0.12);
      b.vy = lerp(b.vy, Math.sin(a) * sp, 0.12);
      if(!b.backDone){ b.backDone = true; b.dmg *= (b.backMul || 1.3); }
      if(dist(b.x, b.y, P.x, P.y) < 20){ bullets.splice(i, 1); continue; }
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += (b.spin || 0) * dt;
    if(b.homing && !b.returning){
      const tgt = nearestEnemy(b.x, b.y, 300);
      if(tgt){
        const want = Math.atan2(tgt.y - b.y, tgt.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let df = want - cur;
        while(df > Math.PI) df -= TAU;
        while(df < -Math.PI) df += TAU;
        const na = cur + clamp(df, -3.4 * dt, 3.4 * dt);
        const sp = Math.min(300, Math.hypot(b.vx, b.vy) + b.homing * dt);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    b.trav = (b.trav || 0) + Math.hypot(b.vx, b.vy) * dt;
    if(b.range && b.trav > b.range && b.type !== 'boomerang'){
      burst(b.x, b.y, b.col || '#ffe9c9', 2, 34, 0);
      bullets.splice(i, 1);
      continue;
    }
    if(b.life <= 0 || b.x < -30 || b.y < -30 || b.x > ARENA.w + 30 || b.y > ARENA.h + 30){
      bullets.splice(i, 1);
      continue;
    }

    let gone = false;
    let hitOne = false;
    eachNear(b.x, b.y, b.r + 6, function(e){
      if(gone || hitOne) return;
      if(b.hitSet.has(e.id)) return;
      if(e.dead) return;
      b.hitSet.add(e.id);
      hitOne = true;
      b.hitCount = (b.hitCount || 0) + 1;

      /* 【2.6】把子弹自身的 bounce 标记带进伤害管线：
         跳弹遗物生成的子弹命中时若不带上这个标记，会再触发一次跳弹，
         于是 1 → 2 → 4 → 8 指数繁殖到 700 发上限——这就是"选了弹射就卡死"。
         现在跳弹只生一代。 */
      dealDamage(e, b.dmg, { src: b.src || 'misc', elem: null, bounce: !!b.bounce });
      /* 【2.6】弹射跳不再挂元素：弹射是"伤害扩散"，不该顺手把元素触发率
         乘上弹射次数——那正是"选了弹射之后连锁到卡死"的一半原因。 */
      if(b.elem && b.elem.length && !b.bounced) elemOnHit(e, b.elem, b.dmg, b.src);
      if(b.slow) e.slowT = Math.max(e.slowT || 0, b.slow);
      if(b.knock && !e.big){
        const ka = Math.atan2(e.y - b.y, e.x - b.x) || 0;
        e.x = clamp(e.x + Math.cos(ka) * b.knock, 8, ARENA.w - 8);
        e.y = clamp(e.y + Math.sin(ka) * b.knock, 8, ARENA.h - 8);
      }
      if(b.lucky6 && !e.dead) applyElem(e, 'volt', 1.4, b.dmg * 0.3, b.src);

      /* 命中爆裂 */
      if(b.boom && b.boom > 0) explode(b.x, b.y, b.boom, b.dmg * (b.boomMul === undefined ? 0.5 : b.boomMul), b.col || '#ffd166', false, b.src || 'misc');

      /* 分裂 */
      if(b.split && !b.splitDone){
        b.splitDone = true;
        for(let k2 = 0; k2 < b.split; k2++){
          const a2 = (k2 / b.split) * TAU + rand(-0.2, 0.2);
          bullets.push({
            type:'shot', x:b.x, y:b.y,
            vx: Math.cos(a2) * 200, vy: Math.sin(a2) * 200,
            r:4, dmg: b.dmg * 0.45, life:1.0, pierce:0,
            hitSet:new Set(), hitCount:0, rot:a2, spin:0,
            col:b.col || '#ffe066', src:b.src, range: 180
          });
        }
      }

      /* 跳弹 / 弹跳 */
      const bounceN = b.bounces || 0;
      /* 【2.6】弹射跳受全局预算约束（18 次/帧），并且标记 b.bounced：
         后续这一发子弹的命中不再挂元素。弹射回到"伤害扩散"的本职。 */
      if(bounceN > 0 && spend('chain')){
        b.bounces = bounceN - 1;
        b.bounced = true;
        const nx = nearestEnemy(b.x, b.y, 240, e.id);
        if(nx){
          const a = Math.atan2(nx.y - b.y, nx.x - b.x);
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(a) * sp;
          b.vy = Math.sin(a) * sp;
          b.hitSet.clear();
          b.hitSet.add(e.id);
          burst(b.x, b.y, b.col || '#ffc2d6', 3, 60, 0);
        } else if(b.hitCount > (b.pierce === undefined ? 0 : b.pierce)) gone = true;
      } else if(b.type === 'candy' && b.bounces === 0){
        b.bounces = -1;
        gone = true;
      } else if(b.hitCount > (b.pierce === undefined ? 0 : b.pierce)){
        gone = true;
      }
    });
    if(gone){
      burst(b.x, b.y, b.col || '#ffe9c9', 3, 60, 0);
      bullets.splice(i, 1);
    }
  }
}

/* --- 敌人行为 --- */

/* 远程怪默认弹道（豌豆射手不单独配 shot 时用它） */
const RANGED_DEFAULT = { keep:[150,215], range:330, cd:2.6, n:1, spd:112, mul:0.8, col:'#ff4fd8', r:4 };

/* 按配置开火：n 连发 + 扇形扩散 + 可选落点爆炸 */
function fireShot(e, cfg, aimAng){
  const n = cfg.n || 1;
  const base = (aimAng === undefined) ? Math.atan2(P.y - e.y, P.x - e.x) : aimAng;
  for(let k = 0; k < n; k++){
    const off = (n > 1) ? (k - (n - 1) / 2) * (cfg.spread || 0.18) : 0;
    const a = base + off;
    shootAt(e.x, e.y - 2, e.x + Math.cos(a) * 120, e.y + Math.sin(a) * 120,
            cfg.spd, e.dmg * (cfg.mul || 1), cfg.col, 0, cfg);
  }
  burst(e.x, e.y - 4, cfg.col, 5, 70, 0);
  sfx('shoot');
}

/* ---------------- 3.0 精英词缀 ----------------
   精英的核心问题一直不是"不够厚"，而是"没有行为"：
   以前它们只是一堵会走路的墙，玩家绕着走就行。
   这里给三条可读、可应对的行为，让精英真的需要"处理"。 */
function eliteAffixTick(e, dt, d, ang){
  if(!e.affix) return;
  if(e.affix === 'charge'){
    if(e.affixState === 'idle'){
      e.affixT -= dt;
      if(e.affixT <= 0 && d < 340){
        e.affixState = 'wind';
        e.affixT = 0.5;
        e.affixDir = ang;
        addText(e.x, e.y - e.r - 12, '蓄力！', '#ff9d4d', 11);
        sfx('whoosh');
      }
    } else if(e.affixState === 'wind'){
      e.affixT -= dt;
      /* 前摇期间缓慢转向：给玩家"往侧面走"的时间 */
      let df = ang - e.affixDir;
      while(df > Math.PI) df -= TAU;
      while(df < -Math.PI) df += TAU;
      e.affixDir += clamp(df, -2.2 * dt, 2.2 * dt);
      if(Math.random() < 0.55) burst(e.x, e.y + e.r, '#ffb066', 1, 40, 0);
      if(e.affixT <= 0){ e.affixState = 'go'; e.affixT = 0.40; }
    } else {
      e.affixT -= dt;
      const sp = e.speed * 4.4;
      e.x += Math.cos(e.affixDir) * sp * dt;
      e.y += Math.sin(e.affixDir) * sp * dt;
      if(Math.random() < 0.75) burst(e.x, e.y, '#ffb066', 1, 30, 0);
      if(e.affixT <= 0){ e.affixState = 'idle'; e.affixT = rand(3.4, 5.0); }
    }
  } else if(e.affix === 'summon'){
    e.affixT -= dt;
    if(e.affixT <= 0){
      e.affixT = 6.5;
      if(enemies.length < 228){
        for(let k = 0; k < 2; k++) addEnemy('ant', e.x + rand(-22, 22), e.y + rand(-22, 22));
        burst(e.x, e.y, e.col || '#ffb0c4', 10, 90, 0);
        rings.push({ x:e.x, y:e.y, r0:6, r1:44, life:0.3, max:0.3, col:e.col || '#ffb0c4', w:2 });
        sfx('deploy');
      }
    }
  }
}

function updateEnemyAI(e, dt){
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx);

  if(e.big){ bossAI(e, dt, d, ang); return; }
  if(e.elite) eliteAffixTick(e, dt, d, ang);

  switch(e.ai){
    case 'weave': {
      e.anim += dt * 5;
      const w = Math.sin(state.t * 7 + e.seed) * 0.55;
      e.x += Math.cos(ang + w) * e.speed * dt;
      e.y += Math.sin(ang + w) * e.speed * dt;
      break;
    }
    case 'dash': {
      e.anim += dt * 3;
      if(e.dashState === 'walk'){
        e.x += Math.cos(ang) * e.speed * dt;
        e.y += Math.sin(ang) * e.speed * dt;
        e.dashT -= dt;
        if(e.dashT <= 0 && d < 240){ e.dashState = 'wind'; e.dashT = 0.42; e.dashDir = ang; }
      } else if(e.dashState === 'wind'){
        e.dashT -= dt;
        e.dashDir = ang;
        e.x += Math.cos(e.dashDir) * e.speed * 0.12 * dt;
        e.y += Math.sin(e.dashDir) * e.speed * 0.12 * dt;
        if(Math.random() < 0.4) burst(e.x, e.y + e.r, '#ffb066', 1, 40, 0);
        if(e.dashT <= 0){ e.dashState = 'dash'; e.dashT = 0.42; }
      } else {
        e.dashT -= dt;
        e.x += Math.cos(e.dashDir) * e.speed * 3.6 * dt;
        e.y += Math.sin(e.dashDir) * e.speed * 3.6 * dt;
        if(Math.random() < 0.6) burst(e.x, e.y, '#ffb066', 1, 30, 0);
        if(e.dashT <= 0){ e.dashState = 'walk'; e.dashT = rand(1.9, 3.0); }
      }
      break;
    }
    case 'ranged': {
      e.anim += dt * 2;
      /* 按 e.shot 的 keep 区间走位：近身后撤、太远前压、区间内绕圈 */
      const cfg = e.shot || RANGED_DEFAULT;
      const near = cfg.keep[0], far = cfg.keep[1];
      const mv = e.speed;
      if(d < near){
        e.x -= Math.cos(ang) * mv * 0.9 * dt;
        e.y -= Math.sin(ang) * mv * 0.9 * dt;
      } else if(d > far){
        e.x += Math.cos(ang) * mv * dt;
        e.y += Math.sin(ang) * mv * dt;
      } else {
        e.x += Math.cos(ang + Math.PI / 2) * mv * 0.75 * dt;
        e.y += Math.sin(ang + Math.PI / 2) * mv * 0.75 * dt;
      }
      if(e.atkCd <= 0 && d < cfg.range){
        e.atkCd = cfg.cd + rand(0, 0.7);
        fireShot(e, cfg, ang);
      }
      break;
    }
    case 'spawner': {
      /* 巢母：保持中距离，定期下崽。放着不管会越积越多 */
      e.anim += dt * 2;
      if(d > 300){
        e.x += Math.cos(ang) * e.speed * dt;
        e.y += Math.sin(ang) * e.speed * dt;
      } else if(d < 190){
        e.x -= Math.cos(ang) * e.speed * dt;
        e.y -= Math.sin(ang) * e.speed * dt;
      } else {
        e.x += Math.cos(ang + Math.PI / 2) * e.speed * 0.6 * dt;
        e.y += Math.sin(ang + Math.PI / 2) * e.speed * 0.6 * dt;
      }
      e.spawnT = (e.spawnT === undefined ? 2.5 : e.spawnT) - dt;
      if(e.spawnT <= 0){
        e.spawnT = 3.4;
        if(enemies.length < 235){
          for(let k = 0; k < 2; k++) addEnemy('ant', e.x + rand(-16, 16), e.y + rand(-16, 16));
          burst(e.x, e.y, e.col, 8, 80, 0);
          sfx('deploy');
        }
      }
      break;
    }
    case 'kamikaze': {
      e.anim += dt * 7;
      e.x += Math.cos(ang) * e.speed * dt;
      e.y += Math.sin(ang) * e.speed * dt;
      if(d < e.r + P.r + 9){ enemySelfDestruct(e); return; }
      break;
    }
    case 'ghost': {
      /* 幽灵：中距离冲刺，贴身收速。
         原来是"越近越快"（2.5 倍，190+ px/s），配上 0.78 的透明度，
         观感就是"屏幕上冒出来一坨东西、一眨眼已经糊在脸上"——
         冲刺本该是**看得见的一段过程**，不是瞬移。
         现在 170px 外慢慢飘（1.0×）、170→70px 加速冲（最高 2.1×）、
         70px 以内主动收速（0.85×），给玩家一个"它冲过来了、该躲了"的窗口。 */
      e.anim += dt * 4;
      const near = Math.max(0, Math.min(1, (170 - d) / 100));
      const boost = d < 70 ? 0.85 : 1 + Math.min(1, near) * 1.1;
      e.x += Math.cos(ang) * e.speed * boost * dt;
      e.y += Math.sin(ang) * e.speed * boost * dt;
      if(Math.random() < 0.22) burst(e.x + rand(-4, 4), e.y + rand(-4, 4), '#cfd6ff', 1, 18, -0.3);
      break;
    }
    case 'hop': {
      /* 青蛙：走两步蹦一次大跳 */
      e.anim += dt * 3;
      if(e.dashState === 'walk'){
        e.dashT -= dt;
        e.x += Math.cos(ang) * e.speed * 0.55 * dt;
        e.y += Math.sin(ang) * e.speed * 0.55 * dt;
        if(e.dashT <= 0){
          e.dashState = 'dash'; e.dashT = 0.32; e.dashDir = ang;
          burst(e.x, e.y + e.r, '#6fe0c8', 6, 70, 0);
        }
      } else {
        e.dashT -= dt;
        e.x += Math.cos(e.dashDir) * e.speed * 5.4 * dt;
        e.y += Math.sin(e.dashDir) * e.speed * 5.4 * dt;
        if(e.dashT <= 0){ e.dashState = 'walk'; e.dashT = rand(0.7, 1.3); }
      }
      break;
    }
    case 'circle': {
      /* 蜜蜂：绕着玩家转圈，周期性俯冲 */
      e.anim += dt * 9;
      e.circleT = (e.circleT || 0) + dt;
      if(e.dashState === 'walk'){
        const tangent = ang + Math.PI / 2;
        const pull = d > 100 ? 1 : (d < 62 ? -0.7 : 0);
        e.x += (Math.cos(tangent) * 0.95 + Math.cos(ang) * pull) * e.speed * dt;
        e.y += (Math.sin(tangent) * 0.95 + Math.sin(ang) * pull) * e.speed * dt;
        if(e.circleT > 2.4){ e.circleT = 0; e.dashState = 'dash'; e.dashT = 0.45; }
      } else {
        e.dashT -= dt;
        e.x += Math.cos(ang) * e.speed * 2.4 * dt;
        e.y += Math.sin(ang) * e.speed * 2.4 * dt;
        if(e.dashT <= 0){ e.dashState = 'walk'; e.circleT = 0; }
      }
      break;
    }
    default: {
      e.anim += dt * 3;
      e.x += Math.cos(ang) * e.speed * dt;
      e.y += Math.sin(ang) * e.speed * dt;
      break;
    }
  }

  if(d < e.r + P.r - 1 && e.atkCd <= 0){
    e.atkCd = 0.9;
  }
  e.x = clamp(e.x, 10, ARENA.w - 10);
  e.y = clamp(e.y, 10, ARENA.h - 10);
}

/* 【3.4】怪不许钻进玩家身体（BOSS 也算）。
   之前所有 AI（chase / weave / ghost / hop / 各种 bossAI）都直接朝玩家中心点走，
   没有任何"停在边缘"的约束。慢的怪一帧挪 0.3px 看不太出来；但幽灵贴身时
   有 190~225 px/s ≈ 每帧 3.7px，一帧就穿进身体内部，之后每帧锁在玩家坐标上——
   玩家看到的就是"一坨半透明的东西凭空糊在身上，看不见也躲不掉"。
   BOSS 更糟：r=15~25，整个人能盖住玩家。

   ★ 必须放在 separate() **之后**：分离力会把贴身单位互相推开，
     推的方向和玩家无关，会把已经贴边的怪重新挤进身体里。
     只有放在每帧最后一环，才不会被下一帧的分离算法打回来。
   这不是"推开"（推力会凭空变成击退），而是**贴边**：
   接触伤害判定用的是 e.r + P.r + 1，钉在 92% 处照样触发，
   "被围住"的压迫感一分不少。 */
function holdBodyOut(){
  if(!P) return;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    let dx = e.x - P.x, dy = e.y - P.y;
    let d = Math.hypot(dx, dy);
    const bodyR = (e.r + P.r) * 0.92;
    if(d >= bodyR) continue;
    if(d < 0.0001){ dx = 1; dy = 0; d = 1; }
    e.x = P.x + (dx / d) * bodyR;
    e.y = P.y + (dy / d) * bodyR;
  }
}

/* --- BOSS 行为：每种都有独立技能组 --- */
function bossAI(e, dt, d, ang){
  e.anim += dt * 2;
  e.skillCd -= dt;
  if(e.skill2Cd !== undefined) e.skill2Cd -= dt;

  if(e.dashState === 'dash'){
    e.dashT -= dt;
    e.x += Math.cos(e.dashDir) * e.speed * 4.2 * dt;
    e.y += Math.sin(e.dashDir) * e.speed * 4.2 * dt;
    if(Math.random() < 0.7) burst(e.x, e.y, e.col, 1, 45, 0);
    if(e.dashT <= 0){
      /* 冲撞落地：布丁暴君会砸出冲击波 */
      if(e.bossType === 'puddingTyrant'){
        rings.push({ x:e.x, y:e.y, r0:e.r, r1:e.r * 4.2, life:0.42, max:0.42, col:'#ffd166', w:4 });
        burst(e.x, e.y, '#ffd166', 14, 165);
        state.shake = Math.max(state.shake, 3.5);
        if(dist(e.x, e.y, P.x, P.y) < e.r * 3.6) hurtPlayer(bossDmg(e, 0.7, 0.17));
      }
      if(e.dashQueue > 0){
        e.dashQueue--;
        e.dashDir = Math.atan2(P.y - e.y, P.x - e.x);
        e.dashT = 0.34;
      } else {
        e.dashState = 'walk'; e.dashT = 1.2;
      }
    }
  } else {
    const keep = (e.bossType === 'veggieQueen' || e.bossType === 'colaKing') ? 125 : 0;
    if(d > keep + 10){
      e.x += Math.cos(ang) * e.speed * dt;
      e.y += Math.sin(ang) * e.speed * dt;
    } else if(keep){
      e.x -= Math.cos(ang) * e.speed * 0.55 * dt;
      e.y -= Math.sin(ang) * e.speed * 0.55 * dt;
    }
  }

  const seg = e.hp / e.maxHp;
  const rage = seg < 0.35 ? 1.8 : (seg < 0.65 ? 1.35 : 1);

  if(e.skillCd <= 0){
    if(e.bossType === 'candyKing'){
      /* 糖果大王：环形弹幕 + 扇形追击，半血后叫糖果球 */
      shootRing(e.x, e.y, 14, 118 * rage, bossDmg(e, 0.5, 0.10), '#ff8fc7', rand(0, TAU));
      for(let i2 = 0; i2 < 5; i2++){
        const a2 = ang + (i2 - 2) * 0.22;
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*178, vy:Math.sin(a2)*178, r:5, dmg:bossDmg(e, 0.55, 0.12), col:'#ff5fc0', life:4, homing:0 });
      }
      rings.push({ x:e.x, y:e.y, r0:e.r, r1:e.r*2.6, life:0.34, max:0.34, col:'#ff8fc7', w:3 });
      if(seg < 0.5){
        for(let i2 = 0; i2 < 3; i2++){
          const a2 = rand(0, TAU);
          addEnemy('pudding', clamp(e.x + Math.cos(a2)*80, 30, ARENA.w - 30), clamp(e.y + Math.sin(a2)*80, 30, ARENA.h - 30));
        }
      }
      e.skillCd = 2.7 / rage;
      sfx('zap');

    } else if(e.bossType === 'colaKing'){
      /* 可乐喷泉：螺旋弹幕（持续 2.2 秒旋转扫射），隔一次追加追踪罐 */
      e.spiral = 2.2;
      e.spiralA = rand(0, TAU);
      e.spiralT = 0;
      e.spiralDir = Math.random() < 0.5 ? 1 : -1;
      if(e.phase % 2 === 1){
        for(let i2 = 0; i2 < 3; i2++){
          const a2 = ang + (i2 - 1) * 0.5;
          ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*140, vy:Math.sin(a2)*140, r:5, dmg:e.dmg*0.6, col:'#ff6b6b', life:5, homing:1.8 });
        }
      }
      e.phase++;
      e.skillCd = (seg < 0.4 ? 2.8 : 3.6);
      sfx('zap');

    } else if(e.bossType === 'burgerKing'){
      /* 汉堡巨兽：叫小弟 / 冲撞 / 天降肉饼 三选一 */
      const mode = e.phase % 3;
      if(mode === 0){
        for(let i2 = 0; i2 < 3; i2++){
          const a2 = rand(0, TAU);
          addEnemy('burger', clamp(e.x + Math.cos(a2)*74, 30, ARENA.w - 30), clamp(e.y + Math.sin(a2)*74, 30, ARENA.h - 30));
        }
        showToast('汉堡巨兽叫来了小弟！');
      } else if(mode === 1){
        e.dashState = 'dash'; e.dashT = 0.62; e.dashDir = ang;
        sfx('boss');
      } else {
        for(let i2 = 0; i2 < 3; i2++){
          strikes.push({ kind:'bomb',
            x: clamp(P.x + rand(-70, 70), 20, ARENA.w - 20),
            y: clamp(P.y + rand(-60, 60), 20, ARENA.h - 20),
            delay:0.7, max:0.7, r:44, dmg:e.dmg*0.8, seed:rand(0,100) });
        }
        showToast('小心天降肉饼！');
      }
      e.phase++;
      e.skillCd = 3.0 / rage;

    } else if(e.bossType === 'jellyPope'){
      /* 果冻教皇：召唤精英怪（核心特色），半血后一次两只 */
      const n = seg < 0.5 ? 2 : 1;
      for(let i2 = 0; i2 < n; i2++){
        spawnEliteAt(clamp(e.x + rand(-110, 110), 30, ARENA.w - 30),
                     clamp(e.y + rand(-110, 110), 30, ARENA.h - 30), 'pudding');
      }
      showToast(seg < 0.5 ? '果冻教皇狂化了，一次叫两只精英！' : '果冻教皇召来了精英！');
      rings.push({ x:e.x, y:e.y, r0:e.r, r1:e.r*3.4, life:0.5, max:0.5, col:'#a0ffd0', w:4 });
      shootRing(e.x, e.y, 12, 104, bossDmg(e, 0.45, 0.10), '#a0ffd0', rand(0, TAU));
      e.skillCd = 5.0 / rage;
      sfx('boss');

    } else if(e.bossType === 'puddingTyrant'){
      /* 布丁暴君：三连冲刺，每段落地砸冲击波 */
      e.dashState = 'dash';
      e.dashDir = ang;
      e.dashT = 0.42;
      e.dashQueue = 2;
      showToast('布丁暴君开始冲撞！');
      sfx('boss');
      e.skillCd = 4.4 / rage;

    } else if(e.bossType === 'slipperKing'){
      /* 拖鞋之王：三个阶段，每个阶段换一套"必须换走位"的招式
         一阶段 环形弹幕 + 扇形点射 → 逼你绕着它转
         二阶段 叫两只精英 + 三连冲撞 → 逼你处理召唤而不是站桩
         三阶段 螺旋 + 天降踩踏 → 逼你持续移动、不能贴脸 */
      if(seg > 0.66){
        shootRing(e.x, e.y, 16, 116 * rage, bossDmg(e, 0.42, 0.10), '#ffd166', rand(0, TAU));
        for(let i2 = 0; i2 < 5; i2++){
          const a2 = ang + (i2 - 2) * 0.2;
          ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*196, vy:Math.sin(a2)*196, r:5,
            dmg:bossDmg(e, 0.5, 0.12), col:'#fff3b0', life:4.2, homing:0 });
        }
        e.skillCd = 2.6 / rage;
        sfx('boss');
      } else if(seg > 0.33){
        if(e.phase % 2 === 0){
          for(let i2 = 0; i2 < 2; i2++){
            spawnEliteAt(clamp(e.x + rand(-130, 130), 30, ARENA.w - 30),
                         clamp(e.y + rand(-130, 130), 30, ARENA.h - 30));
          }
          showToast('拖鞋之王召来了守卫！');
          e.skillCd = 5.4 / rage;
        } else {
          e.dashState = 'dash'; e.dashDir = ang; e.dashT = 0.40; e.dashQueue = 2;
          showToast('小心连续冲撞！');
          e.skillCd = 4.2 / rage;
        }
        e.phase++;
        sfx('boss');
      } else {
        if(e.phase % 3 === 0){
          e.spiral = 1.8; e.spiralA = rand(0, TAU); e.spiralT = 0;
          e.spiralDir = Math.random() < 0.5 ? 1 : -1;
        } else if(e.phase % 3 === 1){
          for(let i2 = 0; i2 < 4; i2++){
            strikes.push({ kind:'bomb',
              x: clamp(P.x + rand(-84, 84), 20, ARENA.w - 20),
              y: clamp(P.y + rand(-72, 72), 20, ARENA.h - 20),
              delay:0.62, max:0.62, r:46, dmg:bossDmg(e, 0.75, 0.20), seed:rand(0,100) });
          }
          showToast('拖鞋踩下来了！');
        } else {
          shootRing(e.x, e.y, 22, 124, bossDmg(e, 0.45, 0.10), '#fff3b0', rand(0, TAU));
        }
        e.phase++;
        e.skillCd = 2.4 / rage;
        sfx('zap');
      }

    } else {
      /* 蔬菜女王：追踪弹 + 给小弟回血 + 毒雾 */
      for(let i2 = 0; i2 < 5; i2++){
        const a2 = ang + (i2 - 2) * 0.3;
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*150, vy:Math.sin(a2)*150, r:5, dmg:e.dmg*0.7, col:'#ff5fc0', life:4.6, homing:1.5 });
      }
      for(let i2 = 0; i2 < enemies.length; i2++){
        const o = enemies[i2];
        if(!o.dead && !o.big && dist(o.x, o.y, e.x, e.y) < 170){
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.35);
        }
      }
      if(e.phase % 2 === 1){
        addHazard(clamp(P.x + rand(-40, 40), 30, ARENA.w - 30),
                  clamp(P.y + rand(-30, 30), 30, ARENA.h - 30), 40, 4.5, e.dmg * 0.45);
      }
      e.phase++;
      e.skillCd = 3.0 / rage;
      sfx('zap');
    }
  }

  /* 可乐喷泉的螺旋弹幕：每 0.085 秒甩两发，角度持续旋转 */
  if(e.spiral > 0){
    e.spiral -= dt;
    e.spiralA += e.spiralDir * dt * 5.0;
    e.spiralT -= dt;
    if(e.spiralT <= 0){
      e.spiralT = 0.085;
      for(let k = 0; k < 2; k++){
        const a2 = e.spiralA + k * Math.PI;
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*152, vy:Math.sin(a2)*152, r:4, dmg:e.dmg*0.4, col:'#ffb0b0', life:5.5, homing:0 });
      }
    }
  }

  if(seg < 0.7 && e.skill2Cd <= 0){
    shootRing(e.x, e.y, 18, 105, bossDmg(e, 0.4, 0.09), e.col, rand(0, TAU));
    e.skill2Cd = 6.0 / rage;
  }

  if(d < e.r + P.r && e.atkCd <= 0){
    e.atkCd = 0.85;
    hurtPlayer(bossDmg(e, 1, 0.14));
  }
  e.x = clamp(e.x, 12, ARENA.w - 12);
  e.y = clamp(e.y, 12, ARENA.h - 12);
}

/* 【4.0】BOSS 伤害回到"绝对量"。
   ---------------------------------------------------------
   3.3 给 BOSS 加了一个 `maxHp × pct` 的百分比地板，理由是"玩家越肉 BOSS 越没威胁"。
   但那条地板同时带来两个副作用：
     · 堆生命对 BOSS 伤害完全无效（伤害按 maxHp 等比涨）——堆血等于白堆；
     · 前期 BOSS 也按同一比例咬，110 秒的第一个 BOSS 直接按终局强度打人。
   现在 BOSS 的 dmg 在 spawnBoss 里就走 atkCurve()（绝对曲线），
   这里只负责乘技能倍率。玩家堆出来的生命与护甲，是真的能扛住它的。 */
function bossDmg(e, mul, pct){
  if(state) state.bossHit = true;
  return (e.dmg || 0) * (mul === undefined ? 1 : mul);
}

/* =========================================================
   接触伤害（4.2）
   ---------------------------------------------------------
   规则：**碰到就掉血**，节奏来自玩家侧的 0.45 秒受伤间隔。
     每次结算 = Σ(贴身怪的 dmg) × 0.52，再过护甲。
   怪没有自己的攻击冷却（不会"贴着你在发呆"），也不是逐帧流血。
   被几只围就吃几份，"冲刺"是唯一的解法（无敌帧内不计伤害）。
   ========================================================= */
function applyContact(dt){
  if(!P) return;
  const near = [];
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    const d = dist(e.x, e.y, P.x, P.y);
    if(d < (e.r + P.r) * 1.55) near.push(e);
  }
  state.contactN = near.length;
  state.biteN = 0;
  if(!near.length) return;

  /* 荆棘：贴身就持续反伤（独立于被咬的节奏） */
  if(ST.thorns > 0){
    state.thornsT = (state.thornsT || 0) - dt;
    if(state.thornsT <= 0){
      state.thornsT = 0.25;
      let sumDmg = 0;
      for(let i = 0; i < near.length; i++) sumDmg += near[i].dmg;
      const refl = thornsHit(ST.thorns + sumDmg * 0.10);
      for(let i = 0; i < near.length; i++){
        dealDamage(near[i], refl, { src: 'thorns' });
        burst(near[i].x, near[i].y, '#ffb0c4', 2, 70, 0);
      }
      addText(P.x, P.y - 34, '反伤 ' + Math.round(refl), '#ffb0c4', 9);
      rings.push({ x:P.x, y:P.y, r0:6, r1:26, life:0.16, max:0.16, col:'#ffb0c4', w:1.5 });
    }
  }

  /* 【5.0】接触伤害：每 1.1 秒结算一次，Σ(贴身怪的 dmg)，再过一次护甲。
     ---------------------------------------------------------
     规则没有变，还是"被几只围就吃几份"——贴 10 只就是 10 份，
     该跑就得跑。变的是**数值**：
       · 单只杂兵一口 18~42 点（旧表 7~20），打在 300 血身上看得见
       · 节奏 0.45 → 1.1 秒，同样的每秒压力，但每一口都数得清
     5.0 没有给接触伤害加任何上限、下限或隐藏系数，
     单纯是把"单口多大"和"多久一口"这两个数重排了一遍。 */
  /* 冲刺的无敌窗口内不吃接触伤害：这是冲刺存在的意义 */
  if(P.invuln > 0) return;

  let sum = 0;
  for(let i = 0; i < near.length; i++){
    const e = near[i];
    /* 眩晕 / 冰冻中的怪贴着你也不掉血 —— 一条规则，不是一串倍率 */
    if(e.stun > 0) continue;
    sum += e.dmg;
    e.flash = Math.max(e.flash || 0, 0.08);
  }
  state.biteN = near.length;
  if(sum <= 0) return;

  /* 玩家侧的受伤间隔：第一次贴上**立刻**结算，之后每 contactTick 一次。
     ---------------------------------------------------------
     【5.0 修复】冷却必须在主循环里按真实时间走（见 64-update 的 contactTick），
     不能只在"贴身时"递减。
     旧的写法有两个后果：
       · 你挨过一口之后离开，冷却停在 0.9 秒不动；
         再撞上去的第一次接触**不结算**，要干等这 0.9 秒才掉血 ——
         玩家看到的就是"撞到怪都不掉血"。
       · 贴着不动时冷却正常递减，所以只有"反复进出"的碰撞会哑火，
         而那恰好是最常见的走位方式。
     现在：冷却永远是真实流逝的 1.1 秒，撞上去的第一口一定立刻生效。 */
  if(P.contactT > 0) return;
  P.contactT = ECO.contactTick;

  const real = hurtPlayer(sum * ECO.contactTickMul, { kind:'contact' });
  if(real > 0){
    burst(P.x, P.y, '#ff6b8f', 4, 80, 0);
    state.contactFx = (state.contactFx || 0) - ECO.contactTick;
    if(state.contactFx <= 0){
      state.contactFx = 0.45;
      state.hurtFlash = Math.max(state.hurtFlash, 0.26);
      state.shake = Math.max(state.shake, 2.6);
      sfx('hurt');
      addText(P.x, P.y - 20, '-' + Math.round(real), '#ff8fa8', 9);
    }
  }
}


/* 分离：直接用预分配的 GRID（不再每帧 new Map），512 只怪也能跑满帧。
   顺便处理"被击退的敌人撞到别人"的额外碰撞伤害——这是控制流派的核心收益。 */
function separate(){
  const cells = GRID.cells, cols = GRID.cols, rows = GRID.rows;
  if(!cells.length) return;
  for(let cy = 0; cy < rows; cy++){
    for(let cx = 0; cx < cols; cx++){
      const arr = cells[cy * cols + cx];
      if(!arr.length) continue;
      for(let k = 0; k < arr.length; k++){
        const e = arr[k];
        if(e.dead) continue;
        for(let ox = 0; ox <= 1; ox++){
          for(let oy = (ox === 0 ? 0 : -1); oy <= 1; oy++){
            const nx = cx + ox, ny = cy + oy;
            if(nx >= cols || ny < 0 || ny >= rows) continue;
            const arr2 = cells[ny * cols + nx];
            if(!arr2 || !arr2.length) continue;
            const start = (ox === 0 && oy === 0) ? k + 1 : 0;
            for(let m = start; m < arr2.length; m++){
              const o = arr2[m];
              if(o === e || o.dead) continue;
              const dx = e.x - o.x, dy = e.y - o.y;
              const d2 = dx*dx + dy*dy;
              const mr = (e.r + o.r) * 0.85;
              if(d2 < mr * mr && d2 > 0.0001){
                const d = Math.sqrt(d2);
                const push = (mr - d) * 0.42;
                e.x += (dx / d) * push;
                e.y += (dy / d) * push;
                /* 撞人伤害：被击退的单位撞到别人，双方都吃伤害 */
                if(e.knockPow > 3 && spend('boom')){
                  const dmg = e.knockPow * 2.4;
                  e.knockPow = 0;
                  dealDamage(o, dmg, { src:'knock' });
                  burst(o.x, o.y, '#ffe9c4', 3, 90, 0);
