/* ---------------- 4.3 遗物查询 ---------------- */
function relic(id){ return !!(P && P.relics && P.relics[id]); }
/* 角色专属遗物：只在对应角色身上出现 */
function relicForChar(id){
  const r = RELICS[id];
  if(!r) return false;
  return !r.own || r.own === (CHAR && CHAR.id);
}
function crystalForChar(id){
  const p = PASSIVES[id];
  if(!p) return false;
  return !p.own || p.own === (CHAR && CHAR.id);
}
function relicCount(){ return P && P.relics ? Object.keys(P.relics).length : 0; }
function relicsWithTag(tag){
  const out = [];
  for(const id in RELICS) if(P.relics[id] && RELICS[id].tags.indexOf(tag) >= 0) out.push(id);
  return out;
}

/* 遗物提供的静态数值（在 getStats 里汇总） */
function relicStat(){
  const s = {
    dmg: 1, speed: 1, area: 1, range: 1, blast: 1, armor: 0, maxHp: 0, maxHpMul: 1,
    crit: 0, critMul: 1, multi: 0, pierce: 0, pickup: 0, xp: 1, vamp: 0,
    enemySpeed: 1, elemDur: 1, reactMul: 1, petDmg: 1,
    turretRate: 1, turretLife: 1, dodge: 0, thorns: 0, slots: 0, regenMul: 1,
    petBonus: 0, turretBonus: 0,
    /* 3.0 资源向字段 */
    rageGain: 1, rageDur: 0, rageDecay: 1,
    chargeRate: 1, overloadDur: 0,
    shieldMax: 0, fleshPct: 0,
    healMul: 1, killHealMul: 1,
    /* 4.1：冲刺配件。它替代了 4.0 的"破韧支撑件"。
       armor 一律是**护甲点数**（每点 ≈ 1/58 的相对收益），
       不再有 hurtTaken 这种平行的免伤百分比。 */
    dashExtra: 0, dashImpact: 0, dashCd: 1, dashFlowBonus: 0, dashDmgBonus: 0,
    /* 4.2：遗物也能给"冷却"，和武器自己的冷却走同一条乘法（没有第二套速度） */
    cdMul: 1
  };
  const R = P ? P.relics : {};
  if(R.sacrifice)  { s.slots -= 1; s.dmg *= 1.70; }
  if(R.glassheart) { s.maxHpMul *= 0.50; s.critMul += 1.50; }
  if(R.greedpact)  { s.enemySpeed *= 1.20; s.xp *= 1.60; }
  if(R.bloodoath)  { s.dmg *= 1.45; s.regenMul = 0; }
  if(R.heavycurse) { s.speed *= 0.80; s.armor += 30; s.area *= 1.30; s.blast *= 1.30; }
  /* 混沌骰子是诅咒：不再用 hurtTaken 这个平行字段，直接扣护甲点数 */
  if(R.chaosdice)  { s.armor -= 15; }
  if(R.luckycoin)  { s.crit += 0.06; }
  if(R.steadypan)  { s.armor += 6; }
  /* 【P0 修复】尖刺甲的 desc 写着"受到伤害时对周围反伤"，
     applyContact 里也确实有反伤逻辑，但**这里从来没给它加过 thorns**：
     ST.thorns 永远等于 0（除非你额外拿了铁皮罐头结晶），
     所以这件遗物 100% 不生效 —— 玩家觉得"反伤没触发"是对的。 */
  if(R.thornsplate){ s.thorns += 18; }
  /* 非元素件 */
  if(R.ironwall)    { s.armor += 18; }
  /* 【4.1】冲刺四件套：段数 / 撞人 / 顺势 / 回复 */
  if(R.breakwind)   { s.dashImpact += 1; }
  if(R.afterflow)   { s.dashFlowBonus += 0.8; s.dashDmgBonus += 0.12; }
  if(R.quickstep)   { s.dashCd *= 0.65; }
  if(R.dashboot)    { s.dashExtra += 1; }
  /* ---------- 4.2 新增 18 件 ---------- */
  if(R.whetstone)   { s.crit += 0.06; }
  if(R.counterweight){ s.blast *= 1.15; }
  if(R.springshoe)  { s.speed *= 1.08; }
  if(R.lodestone)   { s.pickup += 60; }
  if(R.coldpack)    { s.iceMul0 = (s.iceMul0 || 1) * 1.25; }
  if(R.pepperjar)   { s.burnMul0 = (s.burnMul0 || 1) * 1.25; }
  if(R.copperwire)  { s.reactMul *= 1.20; }
  if(R.venomgland)  { s.elemDur *= 1.25; }
  if(R.anvil)       { s.armor += 14; s.speed *= 0.94; }
  if(R.luckydie)    { s.crit += 0.05; s.critMul += 0.30; }
  if(R.stopwatch)   { s.cdMul *= 0.92; }
  if(R.powderkeg)   { s.blast *= 1.20; s.area *= 1.10; }
  if(R.fangbeast)   { s.petDmg *= 1.25; }
  if(R.deepocket)   { s.slots += 1; }
  if(R.bloodsac)    { s.killHealMul *= 1.80; }
  if(R.magazine)    { s.multi += 1; s.cdMul *= 1.06; }
  if(R.platewall)   { s.armor += 24; }
  if(R.huntereye)   { s.critMul += 0.45; }
  if(R.moonstep)    { s.speed *= 1.10; s.dodge += 0.05; }
  if(R.harden)      { s.armor += 9; s.maxHp += 30; }
  /* 反伤流派的支撑件。thornheart 让反伤可以暴击，是"挨打流"真正的质变点 */
  if(R.thornheart)  { s.thorns = s.thorns * 1.45 + 26; s.thornCrit = 1; }
  if(R.ironvine)    { s.armor += 16; s.thorns = s.thorns * 1.50 + 12; }
  if(R.bloodarmor)  { s.maxHp += 70; s.thorns += 24; }
  /* 各流派的补强件 */
  if(R.razorwind)   { s.multi += 1; s.pierce += 1; }
  if(R.bulwark)     { s.turretBonus += 1; }
  if(R.packalpha)   { s.petBonus += 2; }
  if(R.focusprism)  { s.crit += 0.08; s.critMul += 0.25; }
  if(R.quickboot)  { s.speed *= 1.12; }
  if(R.piercepin)  { s.pierce += 1; }
  if(R.twinbarrel) { s.multi += 1; }
  if(R.longfuse)   { s.blast *= 1.20; }
  if(R.magnetstone){ s.pickup += 60; }
  if(R.xplens)     { s.xp *= 1.20; }
  if(R.thickskin)  { s.maxHp += 35; }
  if(R.meltsurge)  { s.reactMul *= 1.50; }
  if(R.frostbite)  { s.reactMul *= 1; }
  if(R.lonestsoul) { s.critMul += 0.80; s.crit -= 0.10; }
  if(R.elementalist){ s.elemDur *= 1.50; }
  if(R.overclock)  { s.turretRate *= 1.50; s.turretLife *= 0.70; }
  if(R.packleader) { s.petDmg *= 1.35; s.petBonus += 2; }
  if(R.bloodoath)  { s.regenMul = 0; }

  /* ---- 3.2 专属件 ---- */
  if(R.hotoil)      { s.burnMul0 = (s.burnMul0 || 1) * 1.25; }
  if(R.charcoalspat) { s.burnMul0 = (s.burnMul0 || 1) * 1.40; }
  if(R.freezer)     { s.iceMul0 = (s.iceMul0 || 1) * 1.20; }
  if(R.frostblade)  { s.frostblade = 1; }
  if(R.syncer)      { s.syncerOn = 1; }
  if(R.quiver)     { s.multi += 1; s.dmg *= 0.92; }
  if(R.deadeye)    { s.crit += 0.08; s.critMul += 0.15; }
  if(R.spicerack)  { s.elemDur *= 1.30; }
  if(R.molecular)  { s.reactMul *= 1.35; }
  if(R.stockpot)   { s.killHealMul *= 1.40; }
  if(R.fleshplate) { s.maxHpMul += 0.18; s.speed *= 0.94; }
  if(R.thorncrown) { s.thornCrit = 1; s.critMul += 0.50; }
  if(R.reflector)  { s.armor += 12; }
  if(R.broodnest)  { s.petDmg *= 0.88; s.petBonus += 2; }

  if(R.ironhide)   { s.armor += 16; s.thorns = s.thorns * 1.50 + 10; }
  if(R.thornaura)  { s.thorns = s.thorns * 1.25 + 30; }

  /* ---------- 3.0：怒气 ---------- */
  if(R.ragewhet)   { s.rageGain *= 1.20; }
  if(R.ragecrit)   { s.critMul += 0.12; }
  if(R.ragekettle) { s.armor += 6; }
  if(R.ragecore)   { s.rageGain *= 1.30; s.rageDur += 1.5; }
  /* ---------- 3.0：血肉 ---------- */
  if(R.fleshcage)  { s.armor += 8; s.maxHp += 50; }
  if(R.fleshblood) { s.maxHpMul *= 1.20; s.killHealMul *= 1.50; }
  if(R.fleshmass)  { s.maxHpMul *= 1.30; }
  if(R.fleshhammer){ s.fleshPct += 0.015; }
  /* ---------- 3.0：过载 ---------- */
  if(R.chgspring)  { s.chargeRate *= 1.20; s.speed *= 1.06; }
  if(R.chgcoil)    { s.critMul += 0.10; }
  if(R.chgres)     { s.overloadDur += 2; }
  if(R.chgcap)     { s.chargeRate *= 1.70; }
  if(R.chgcore)    { s.chargeRate *= 1.30; }
  /* ---------- 3.0：吞噬 ---------- */
  if(R.growgreed)  { s.pickup += 40; }
  /* ---------- 3.0：护盾 ---------- */
  if(R.shdbattery) { s.shieldMax += 50; }
  if(R.shdbarrier) { s.shieldMax += 90; }
  if(R.shdaegis)   { s.shieldMax += 40; }
  return s;
}

/* ---------------- 4.4 监听器注册（每局开始时执行一次） ---------------- */
function initRelics(){
  /* ---- 命中类 ---- */
  on('hit', function(h){
    const e = h.e;
    if(!e || e.dead) return;
    /* 暴击 → 连锁闪电 */
    if(h.crit && relic('chaincrit') && Math.random() < 0.55){
      let fx = e.x, fy = e.y;
      const hit = new Set([e.id]);
      let dmg = h.dmg * 0.45;
      for(let k = 0; k < 3; k++){
        let best = null, bd = 1e9;
        eachNear(fx, fy, 170, function(o){
          if(hit.has(o.id)) return;
          const d = dist(fx, fy, o.x, o.y);
          if(d < bd){ bd = d; best = o; }
        });
        if(!best) break;
        hit.add(best.id);
        beams.push({ x:fx, y:fy, ang: Math.atan2(best.y - fy, best.x - fx),
          len: dist(fx, fy, best.x, best.y), width: 2, life: 0.12, max: 0.12, col:'#9fe8ff', src:'relic' });
        dealDamage(best, dmg, { src:'r_chain', elem:'volt' });
        dmg *= 0.8;
        fx = best.x; fy = best.y;
      }
    }
    /* 暴击 → 火花塞 */
    if(h.crit && relic('sparkplug') && Math.random() < 0.30){
      eachNear(e.x, e.y, 60, function(o){
        dealDamage(o, h.dmg * 0.35, { src:'r_spark', elem:'volt' });
      });
      rings.push({ x:e.x, y:e.y, r0:6, r1:60, life:0.22, max:0.22, col:'#ffe066', w:2 });
    }
    /* 霜之触 */
    if(relic('coldtouch') && Math.random() < 0.12) applyElem(e, 'ice', 1.6, h.dmg * 0.2, 'relic');
    /* 毒腺 */
    if(relic('venomgland') && Math.random() < 0.12) applyElem(e, 'venom', 2.2, h.dmg * 0.25, 'relic');
    /* 怒焰烙铁：狂战期间命中带火，让怒气流也能自己搓反应 */
    if(relic('ragebrand') && isBerserk() && Math.random() < 0.35) applyElem(e, 'fire', 1.8, h.dmg * 0.25, 'relic');
  });

  /* ---- 闪避类 ---- */
  on('dodge', function(){
    if(relic('dodgeprism')) P.guaranteedCrit = true;
  });

  /* ---- 暴击类 ---- */
  on('crit', function(h){ charHook('onCrit', h); });

  /* ---- 命中类 ----
     【P0 修复】`emit('hit')` 一直在发，但**没有任何地方把它转给角色钩子**。
     结果是骑士的"近战命中 +7 怒"和游侠的"连续命中同一目标叠专注"这两套
     核心机制全都收不到事件：怒气只能靠挨打涨，专注永远是 0。
     角色专属机制等于没实现，而且完全不报错。 */
  on('hit', function(h){ charHook('onHit', h); });

  /* ---- 击杀类 ---- */
  on('kill', function(h){
    const e = h.e;

    /* 余烬 / 燃爆 */
    if(e.st && e.st.fire > 0){
      if(relic('emberkill')){
        explode(e.x, e.y, 62, 24 + P.level * 6, '#ff8a3d', false, 'relic');
      } else if(relic('ember') && spend('boom')){
        explode(e.x, e.y, 34, 12 + P.level * 3, '#ff8a3d', true, 'relic');
      }
    }
    /* 感应线圈 */
    if(relic('voltcoil') && e.st && e.st.volt > 0 && spend('boom')){
      rings.push({ x:e.x, y:e.y, r0:6, r1:72, life:0.28, max:0.28, col:'#ffe066', w:3 });
      eachNear(e.x, e.y, 72, function(o){ dealDamage(o, 14 + P.level * 4, { src:'r_voltdeath', elem:'volt' }); });
    }
    /* 击杀弹幕 */
    if(relic('killshot') && Math.random() < 0.25 && bullets.length < 600){
      const a = rand(0, TAU);
      bullets.push({
        type:'slipper', x:e.x, y:e.y,
        vx: Math.cos(a) * 300, vy: Math.sin(a) * 300,
        r:5, dmg: 16 + P.level * 5, life: 1.1, pierce: 1,
        range: 260, hitSet: new Set(), hitCount: 0, rot: a, spin: 12,
        col:'#ffc46b', src:'relic'
      });
    }
    /* 石像碎裂 */
    if(relic('statuesmash') && Math.random() < 0.15){
      for(let i = 0; i < 3; i++){
        const a = (i / 3) * TAU + rand(-0.3, 0.3);
        bullets.push({
          type:'shot', x:e.x, y:e.y,
          vx: Math.cos(a) * 240, vy: Math.sin(a) * 240,
          r:4, dmg: 10 + P.level * 3, life: 0.8, pierce: 0,
          range: 200, hitSet: new Set(), hitCount: 0, rot: a, spin: 0,
          col:'#c9d4e2', src:'relic'
        });
      }
    }
    /* 亡语弹片：不该只是「石像碎裂」这一件遗物的专利。
       弹幕 / 穿甲 流派浓度越高，敌人死亡时炸出弹片的概率越高——
       这是这两个流派自己的连锁，和元素反应完全无关。 */
    const shardChance = schoolTier('barrage') * 0.09 + schoolTier('pierce') * 0.09;
    if(shardChance > 0 && Math.random() < shardChance && bullets.length < 700){
      const n = 2 + (Math.random() < 0.35 ? 1 : 0);
      for(let i = 0; i < n; i++){
        const a = (i / n) * TAU + rand(-0.4, 0.4);
        bullets.push({
          type:'shot', x:e.x, y:e.y,
          vx: Math.cos(a) * 260, vy: Math.sin(a) * 260,
          r:4, dmg: 12 + P.level * 4, life: 0.9, pierce: 1,
          range: 220, hitSet: new Set(), hitCount: 0, rot: a, spin: 0,
          col:'#ffc46b', src:'relic'
        });
      }
    }
    /* 灵魂收割：后期击杀几十只/秒时，"8% 概率"等于每秒白送两三只，
       场上瞬间堆满。加 1.2 秒冷却、单场上限 10 只，保留"爽"但不再刷屏。 */
    if(relic('soulharvest') && allies.length < 10
       && (state.time - (P.soulT || -9)) > 1.2
       && Math.random() < 0.08){
      if(spend('summon')){
        P.soulT = state.time;
        spawnPet(e.x, e.y, 3, 20 + P.level * 5, 10);
      }
    }
    /* 猎杀连锁 */
    /* 猎杀连锁：12 杀触发一次，但加了 0.9 秒冷却。
       后期 30 杀/秒时，"每 12 杀"等于每秒 2.5 次全屏爆炸，
       单件遗物就能顶掉所有武器 —— 触发频率必须有个上限，不能只按击杀数。 */
    if(relic('killchain')){
      P.killCounter = (P.killCounter || 0) + 1;
      if(P.killCounter >= 12 && state.time - (P.kcT || -9) > 0.9){
        P.kcT = state.time;
        P.killCounter = 0;
        explode(P.x, P.y, 118, 24 + P.level * 5, '#ff9dc0', false, 'r_killchain');
        rings.push({ x:P.x, y:P.y, r0:20, r1:180, life:0.4, max:0.4, col:'#ff9dc0', w:4 });
      }
    }
    /* 冰霜之心：冻结敌人死亡炸冰锥
       【P0 修复】冰锥本身带冰元素 → 冻住下一批 → 它们死了又炸 4 根 →
       形成正反馈循环。厨师一局靠这一件遗物打出 1000 万伤害（是全部武器之和的 5 倍），
       结算面板里"遗物"永远第一。现在限流 0.45 秒最多触发一次，且 2 根。 */
    if(relic('frostheart') && (e.slowT || 0) > 0 && state.time - (P.frostT || -9) > 0.45){
      P.frostT = state.time;
      for(let i = 0; i < 2; i++){
        const a = (i / 2) * TAU + rand(-0.4, 0.4);
        bullets.push({
          type:'frost', x:e.x, y:e.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220,
          r:5, dmg: 10 + P.level * 2, life: 0.6, pierce: 1, range: 160,
          hitSet: new Set(), hitCount: 0, elem:['ice'], rot:a, spin:0, col:'#8fe8ff', src:'r_frost'
        });
      }
    }
  });

  /* ---- 反应类 ---- */
  on('reaction', function(h){
    if(relic('meltsurge')){
      eachNear(h.e.x, h.e.y, 70, function(o){
        if(o !== h.e) dealDamage(o, h.dmg * 0.35, { src:'react' });
      });
    }
    if(relic('singularity') && holes.length < 6){
      holes.push({ x:h.e.x, y:h.e.y, r: 70, dmg: 8 + P.level * 2, tick: 0.3,
        t:0, life: 2.0, max: 2.0, evo:false, seed: rand(0, 10), src:'relic' });
    }
  });

  /* ---- 受伤类 ---- */
  on('hurt', function(d){
    if(relic('thornsplate') && spend('boom')){
      eachNear(P.x, P.y, 84, function(o){ dealDamage(o, 8 + P.level * 4, { src:'r_killchain' }); });
      rings.push({ x:P.x, y:P.y, r0:10, r1:84, life:0.24, max:0.24, col:'#ffb0c4', w:3 });
    }
    /* 沸怒水壶：挨打额外攒怒，把"被围"变成"要开狂战了" */
    if(relic('ragekettle')) rageGainRaw(10);
    charHook('onHurt', d);
  });

  /* ---- 暴击：回馈线圈 ---- */
  on('crit', function(h){
    /* 【3.3】回馈线圈原来每次暴击给 7 点充能。
       暴击率高 + 命中数大时，一次齐射触发十几次 = 一帧满槽，
       "0.1 秒充能"的观感有一半来自这一件。降到 2.2 并走每秒令牌桶。 */
    if(relic('chgcoil')) chargeGain(2.2);
  });

  /* ---- 爆炸类 ---- */
  on('boom', function(h){
    if(relic('burstcore') && Math.random() < 0.30 && spend('boom')){
      explode(h.x, h.y, h.r * 0.8, h.dmg * 0.6, '#ff9d4d', true, 'relic');
    }
  });

  /* ---- 宝石 ---- */
  on('gem', function(g){
    if(relic('scavenger')){
      P.gemCounter = (P.gemCounter || 0) + 1;
      if(P.gemCounter >= 18){
        P.gemCounter = 0;
        explode(g.x, g.y, 70, 18 + P.level * 5, '#6fdc8c', true, 'relic');
      }
    }
    /* 贪婪之卵：每颗宝石都变成永久伤害（上限 +40%），
       和"吞噬"一样是滚雪球，但滚的是经济线 */
    if(relic('growgreed')){
      P.gemDmg = Math.min(0.40, (P.gemDmg || 0) + 0.0006);
    }
  });
}

/* 每帧跑的遗物逻辑 */
function tickRelics(dt){
  /* 回响之心原来固定 5 秒齐射一次——每秒 5 发时，这个效果等于噪音。
     改成"每次开火有概率立刻再齐射一轮"（见 64-update），强度自然跟着出手频率长。 */
  if(P.phaseT > 0) P.phaseT -= dt;
  if((P.wallCd || 0) > 0) P.wallCd -= dt;
  /* 血怒：低血冷却 */
  if(relic('bloodrage')){
    P.bloodrageOn = P.hp < P.maxHp * 0.40;
  }
  /* 雷神：感电敌人互相放电 */
  if(relic('thunderlord')){
    P.thunderT = (P.thunderT || 0) - dt;
    if(P.thunderT <= 0){
      P.thunderT = 1.0;
      let n = 0;
      for(let i = 0; i < enemies.length && n < 8; i++){
        const e = enemies[i];
        if(e.dead || !e.st || e.st.volt <= 0) continue;
        n++;
        eachNear(e.x, e.y, 56, function(o){
          if(o !== e) dealDamage(o, 10 + P.level * 3, { src:'r_thunder', elem:'volt' });
        });
      }
    }
  }
  /* 混沌骰：随机元素附魔 */
  if(relic('chaosdice')){
    P.chaosT = (P.chaosT || 0) - dt;
    if(P.chaosT <= 0){
      P.chaosT = 8;
      const list = ['fire', 'ice', 'venom', 'volt'];
      P.chaosElem = pickOne(list);
      showToast('🎲 附魔：' + ELEM_NAME[P.chaosElem]);
    }
  }

  /* ---------- 3.0：血肉 · 心跳泵 ---------- */
  if(relic('fleshpump')){
    P.pumpT = (P.pumpT === undefined ? 4 : P.pumpT) - dt;
    if(P.pumpT <= 0){
      P.pumpT = 4;
      const missing = 1 - clamp(P.hp / P.maxHp, 0, 1);
      const R = 90 * (ST.area || 1);
      const d = powerBase() * 0.8 * (1 + missing * 1.2);
      if(rings.length < 30) rings.push({ x:P.x, y:P.y, r0:R * 0.25, r1:R, life:0.26, max:0.26, col:'#ff5f7e', w:3 });
      burst(P.x, P.y, '#ff5f7e', 8, 120, -0.2);
      let n = 0;
      eachNear(P.x, P.y, R, function(e){
        if(e.dead || n >= 20) return;
        n++;
        dealDamage(e, d, { src:'flesh', noFlesh:true });
      });
      addText(P.x, P.y - 32, '心跳', '#ff7a8f', 10);
      sfx('heartbeat');
    }
  }

  /* ---------- 3.2：冷冻 · 急冻喷雾 ---------- */
  if(relic('flashfreeze')){
    P.freezeT = (P.freezeT === undefined ? 8 : P.freezeT) - dt;
    if(P.freezeT <= 0){
      P.freezeT = 8;
      let n = 0;
      eachNear(P.x, P.y, 110, function(e){
        if(e.dead || n >= 14) return;
        n++;
        applyElem(e, 'ice', 1.5, 0, 'freeze');
        e.stun = Math.max(e.stun || 0, 0.35);
      });
      if(n > 0){
        rings.push({ x:P.x, y:P.y, r0:12, r1:110, life:0.3, max:0.3, col:'#7ce3ff', w:3 });
        sfx('chill');
      }
    }
  }

  /* ---------- 3.1：反伤 · 荆棘领域与流派Ⅲ ---------- */
  if(relic('thornaura') || archTier('thorns') >= 3){
    P.thornT = (P.thornT === undefined ? 1 : P.thornT) - dt;
    if(P.thornT <= 0){
      P.thornT = 1;
      const R = relic('thornaura') ? 70 : 56;
      const d = (ST.thorns || 0) * 0.35;
      if(d > 1){
        let n = 0;
        eachNear(P.x, P.y, R, function(e){
          if(e.dead || n >= 12) return;
          n++;
          dealDamage(e, d, { src:'thorns', noFlesh:true });
          burst(e.x, e.y, '#ffb0c4', 1, 50, 0);
        });
      }
    }
  }

  /* ---------- 3.0：吞噬 · 流派Ⅲ ---------- */
  if(archTier('growth') >= 3){
    P.growHealT = (P.growHealT === undefined ? 12 : P.growHealT) - dt;
    if(P.growHealT <= 0){
      P.growHealT = 12;
      if(P.hp < P.maxHp) healPlayer(P.maxHp * 0.016);
    }
  }
}

/* 齐射：把所有武器立刻放一轮 */
function volleyAll(){
  for(const id in P.weapons){
    const w = WEAPONS[id];
    if(!w || !w.fire) continue;
    if(w.continuous) continue;
    w.fire(P.weapons[id]);
  }
}

/* 一把武器属于哪些流派（按标签匹配） */
function schoolsOfWeapon(w){
  const out = [];
  if(!w || !w.tags) return out;
  for(const sid in SCHOOLS){
    const tags = SCHOOLS[sid].tags;
    for(let i = 0; i < w.tags.length; i++){
      if(tags.indexOf(w.tags[i]) >= 0){ out.push(sid); break; }
    }
  }
  return out;
}

/* 当前阵容的流派浓度：0~1，按武器数量占比算 */
function schoolShare(){
  const share = {};
  const ids = Object.keys(P ? P.weapons : {});
  if(!ids.length) return share;
  for(let i = 0; i < ids.length; i++){
    const w = WEAPONS[ids[i]];
    /* 主流派：每把武器只归一个流派，否则"投递方式"会把所有 build 拉成同一类 */
    const list = (w && w.school) ? [w.school] : schoolsOfWeapon(w);
    for(let k = 0; k < list.length; k++) share[list[k]] = (share[list[k]] || 0) + 1;
  }
  for(const sid in share) share[sid] = share[sid] / ids.length;
  return share;
}

function topSchools(n){
  const share = schoolShare();
  const arr = [];
  for(const sid in share) arr.push({ id:sid, share:share[sid], name:SCHOOLS[sid].name, col:SCHOOLS[sid].col });
  arr.sort((a, b) => b.share - a.share);
  return arr.slice(0, n || 2);
}

/* 卡池权重：往已有流派收敛，但只给到 +55%，不锁死玩法 */
function schoolWeight(tags){
  if(!tags || !P) return 1;
  const share = schoolShare();
  let best = 0;
  for(const sid in SCHOOLS){
    const st = SCHOOLS[sid].tags;
    let hit = false;
    for(let i = 0; i < tags.length; i++) if(st.indexOf(tags[i]) >= 0){ hit = true; break; }
    if(hit && (share[sid] || 0) > best) best = share[sid] || 0;
  }
  return 1 + best * 0.55;
}

/* 选完卡后刷新：流派换了会提示一次，同时重算属性 */
function refreshSchools(){
  if(!P) return;
  const top = topSchools(1)[0];
  if(top && top.id !== P.topSchool){
    P.topSchool = top.id;
    if(top.share >= 0.5){
      showToast('流派成型：' + top.name);
      state.flash = Math.max(state.flash, 0.16);
    }
  }
  recomputeSchoolTiers();
  ST = getStats();
}

function charSchoolNames(c){
  if(!c || !c.schools) return '';
  return c.schools.map(s => (SCHOOLS[s] ? SCHOOLS[s].name : s)).join(' / ');
}

function hasWeaponTag(tag){
  for(const id in P.weapons){
    const w = WEAPONS[id];
    if(w && w.tags && w.tags.indexOf(tag) >= 0) return true;
  }
  return false;
}
function hasSchool(sid){
  return (schoolShare()[sid] || 0) > 0;
}
function hasAlly(kind){ return allyCount(kind) > 0; }

function activeLinks(){
  /* 现在是"你实际吃到的流派机制"，不是一堆自动触发的属性共鸣 */
  const out = [];
  if(!P || !P.scT) return out;
  const order = ['melee','pierce','fort','beast','blast','barrage','crit','orbit','fire','ice','volt','venom'];
  for(let i = 0; i < order.length; i++){
    const sid = order[i];
    const t = P.scT[sid] || 0;
    if(!t) continue;
    const m = SCHOOL_MECH[sid];
    if(!m) continue;
    out.push({ id:sid, name:m.icon + ' ' + m.name, tier:t, desc:m.desc });
  }
  return out;
}

/* 卡片上的联动提示：这张卡会把你带进哪条机制 */
function synergyHintForWeapon(id){
  const w = WEAPONS[id];
  if(!w || !w.tags) return '';
  const hit = [];
  const share = schoolShare();
  for(const t of w.tags){
    for(const sid in SCHOOLS){
      if(SCHOOLS[sid].tags.indexOf(t) >= 0 && (share[sid] || 0) > 0){
        if(hit.indexOf(SCHOOLS[sid].name) < 0) hit.push(SCHOOLS[sid].name);
      }
    }
  }
  if(!hit.length) return '';
  return '✦ 与现有流派同路：' + hit.join('、');
}

/* 3.0：遗物 / 结晶的流派归属提示（含新五条流派） */
function archHint(tags){
  if(!tags || !tags.length || typeof P === 'undefined' || !P || !P.arch) return '';
  const hit = [];
  for(let i = 0; i < ARCH_IDS.length; i++){
    const id = ARCH_IDS[i];
    const def = ARCH[id];
    const a = P.arch[id];
    if(!a || !a.pts) continue;
    for(let k = 0; k < def.tags.length; k++){
      if(tags.indexOf(def.tags[k]) >= 0){ hit.push(def.name); break; }
    }
  }
  return hit.length ? ('✦ 接续「' + hit[0] + '」流派') : '';
}

function synergyHintForMod(wid, modId){
  const map = { burn:'fire', chill:'ice', venom:'venom', volt:'volt', blast:'blast',
                pierce:'pierce', crit:'crit', bounce:'chain', size:'aoe', bleed:'venom',
                knock:'melee', combo:'melee', reach:'melee' };
  const t = map[modId];
  if(!t) return '';
  const share = schoolShare();
  let best = '';
  for(const sid in SCHOOLS){
    if(SCHOOLS[sid].tags.indexOf(t) >= 0 && (share[sid] || 0) > 0) best = SCHOOLS[sid].name;
  }
  return best ? ('✦ 吃到「' + best + '」流派加成') : '';
}

/* 每种流派当前有几把武器 → 机制等级 0~3 */
function recomputeSchoolTiers(){
  if(!P) return;
  const t = {};
  for(const id in P.weapons){
    const w = WEAPONS[id];
    if(w && w.school) t[w.school] = (t[w.school] || 0) + 1;
  }
  for(const k in t) t[k] = Math.min(3, t[k]);
  P.scT = t;
  if(!P.sc) P.sc = {};
}

  return (P && P.passives && P.passives[id]) ? P.passives[id] : 0;
}

function schoolTier(sid){
  return (P && P.scT && P.scT[sid]) ? P.scT[sid] : 0;
}

/* 某个来源属于哪个流派 */
function srcSchool(src){
  if(!src) return null;
  if(src === 'turret') return 'fort';
  if(src === 'pet') return 'beast';
  const w = WEAPONS[src];
  if(w && w.school) return w.school;
  if(MELEE[src]) return 'melee';
  return null;
}

/* ---------------------------------------------------------
   伤害侧的联动（在 dealDamage 里调用，所有来源统一吃）
   --------------------------------------------------------- */
function schoolDamageMul(e, src){
  if(!P || !P.scT) return 1;
  const T = P.scT, S = P.sc || {};
  const now = state.time;
  let m = 1;

  /* 近战连击（连击刻印会加码） */
  if(T.melee && MELEE[src] && S.combo > 0){
    m *= 1 + S.combo * (0.05 + gemLv('combogem') * 0.02);
  }
  /* 破甲：任何来源都吃 */
  if(T.pierce && e.pierceUntil > now && e.pierceS > 0){
    m *= 1 + e.pierceS * (0.07 + gemLv('breakpin') * 0.03);
  }
  /* 火力网：炮台打被标记的目标 */
  if(src === 'turret' && T.fort && e.turretUntil > now){
    m *= 1 + 0.25 * Math.min(2, T.fort) + gemLv('gridchip') * 0.10;
  }
  /* 兽群：宠物集火标记 + 击杀后全体变强 */
  if(src === 'pet' && T.beast){
    if(e.packUntil > now && e.packMark > 0) m *= 1 + e.packMark * 0.08;
    m *= 1 + gemLv('packhorn') * 0.15;
    if(S.packUntil > now && S.pack > 0) m *= 1 + S.pack * 0.08;
  }
  return m;
}

/* ---------------------------------------------------------
   每帧：计时器衰减 + 环绕格挡
   --------------------------------------------------------- */
function schoolTick(dt){
  if(!P || !P.sc) return;
  const S = P.sc, T = P.scT || {};

  if(S.combo > 0){
    S.comboT -= dt;
    if(S.comboT <= 0) S.combo = 0;
  }
  if(S.sharp > 0 && state.time - (S.sharpT || 0) > 3){
    S.sharpDecay = (S.sharpDecay || 0) + dt;
    if(S.sharpDecay > 1){
      S.sharpDecay = 0;
      S.sharp = Math.max(0, S.sharp - 1);
    }
  }

  /* 包围圈：清子弹 + 推开贴脸的怪 */
  if(T.orbit){
    S.orbitT = (S.orbitT || 0) - dt;
    if(S.orbitT <= 0){
      S.orbitT = Math.max(0.18, 0.55 - T.orbit * 0.08 - gemLv('guardring') * 0.10);
      const R = (P.orbR || 46) * 1.15;
      for(let i = ebullets.length - 1; i >= 0; i--){
        const b = ebullets[i];
        if(dist(b.x, b.y, P.x, P.y) < R){
          burst(b.x, b.y, '#9fe8ff', 3, 70, 0);
          ebullets.splice(i, 1);
        }
      }
      eachNear(P.x, P.y, R, function(e){
        if(e.big || e.dead) return;
        const a = Math.atan2(e.y - P.y, e.x - P.x);
        e.x += Math.cos(a) * 2.5;
        e.y += Math.sin(a) * 2.5;
      });
    }
  }
}

/* ---------------------------------------------------------
   事件监听（每局注册一次）
   --------------------------------------------------------- */
function initSchoolMech(){
  P.sc = { combo:0, comboT:0, sharp:0, sharpen:0, bar:0, pack:0, packUntil:0, orbitT:0 };

  /* ---- 命中 ---- */
  on('hit', function(h){
    const e = h.e, src = h.src;
    if(!e || e.dead || !P.scT) return;
    const T = P.scT, S = P.sc;
    const now = state.time;

    /* 近战连击 */
    if(T.melee && MELEE[src]){
      const cap = 4 + T.melee * 3 + gemLv('combogem') * 3;
      if(S.combo < cap) S.combo++;
      S.comboT = 1.8;
    }

    /* 穿甲：破甲叠层（只由穿甲类武器叠） */
    if(T.pierce && srcSchool(src) === 'pierce'){
      e.pierceS = Math.min(5 + gemLv('breakpin') * 2, (e.pierceS || 0) + 1);
      e.pierceUntil = now + 4;
    }

    /* 火力网：炮台打标记 */
    if(src === 'turret' && T.fort){
      e.turretUntil = now + 2.4 + gemLv('gridchip');
    }

    /* 兽群：宠物集火 */
    if(src === 'pet' && T.beast){
      e.packMark = Math.min(5, (e.packMark || 0) + 1);
      e.packUntil = now + 2.6;
    }

    /* 弹幕压制：攒够命中就提前装填一半，但**每 2.5 秒最多一次**。
       之前这一条没有冷却，命中数又随出手频率上涨 → 正反馈失控，冷却无限叠加。 */
    if(T.barrage){
      S.bar = (S.bar || 0) + 1;
      const need = Math.max(6, 14 - T.barrage * 2 - gemLv('magchip') * 2);
      if(S.bar >= need && (S.barCd || 0) <= now){
        S.bar = 0;
        S.barCd = now + 2.5;
        let any = false;
        for(const id in P.weapons){
          const w = WEAPONS[id];
          if(w && w.school === 'barrage' && P.cds[id] > 0.08){
            P.cds[id] = P.cds[id] * 0.5;
            any = true;
          }
        }
        if(any){
          rings.push({ x:P.x, y:P.y, r0:10, r1:52, life:0.22, max:0.22, col:'#ffc46b', w:2 });
          sfx('pop');
        }
      }
    }
  });

  /* ---- 暴击：锐气 ---- */
  on('crit', function(){
    if(!P.scT || !P.scT.crit) return;
    const cap = 6 + P.scT.crit * 3 + gemLv('whetstone') * 3;
    P.sc.sharp = Math.min(cap, (P.sc.sharp || 0) + 1);
    P.sc.sharpT = state.time;
  });

  /* ---- 击杀：兽群强化 ---- */
  on('kill', function(h){
    if(!P.scT || !P.scT.beast) return;
    if(h.src !== 'pet') return;
    P.sc.pack = Math.min(3, (P.sc.pack || 0) + 1);
    P.sc.packUntil = state.time + 5;
  });

  /* ---- 爆炸：连锁爆 ---- */
  on('boom', function(b){
    if(!P.scT || !P.scT.blast) return;
    if(!b || b.chain) return;                       /* 二次爆炸不再连锁，防递归 */
    const chance = 0.18 + P.scT.blast * 0.10 + gemLv('corebomb') * 0.10;
    if(Math.random() > chance) return;
    if(!spend('boom')) return;
    const list = [];
    eachNear(b.x, b.y, b.r * 1.6, function(e){ if(!e.dead) list.push(e); });
    if(!list.length) return;
    const tgt = pickOne(list);
    const r2 = b.r * 0.62 * (1 + gemLv('corebomb') * 0.15);
    rings.push({ x:tgt.x, y:tgt.y, r0:r2 * 0.3, r1:r2, life:0.2, max:0.2, col:'#ff9d4d', w:3 });
    eachNear(tgt.x, tgt.y, r2, function(e){
      dealDamage(e, (b.dmg || 10) * 0.45, { src: b.src || 'blast', mul: 1 });
    });
    sfx('boom');
  });
}

/* 顺序 = 卡池权重与界面的展示顺序。crit 是**公用流派**（谁都能走），
   其余 15 条各自只属于一个角色。 */
const ARCH_IDS = ['rage', 'flesh', 'thorns',
                  'charge', 'barrage', 'pierce',
                  'turret', 'shield', 'grid',
                  'beast', 'sacrifice', 'growth',
                  'heat', 'freeze', 'elem',
                  'crit'];
const ARCH_TIER_MIN = [2, 5, 8];        /* 三级里程碑所需点数 */

/* 每个角色的 2~3 条路线。第一条是"本命"（起步就有一点倾斜），
   其余靠玩家自己用遗物与结晶把点数堆上去。 */
const CHAR_ROUTES = {
  knight:   ['rage', 'flesh', 'thorns'],
  ranger:   ['charge', 'barrage', 'crit'],
  engineer: ['shield', 'thorns', 'crit'],
  keeper:   ['beast', 'sacrifice', 'growth'],
  chef:     ['elem', 'crit', 'flesh'],
};

/* 角色天生倾斜：起始就把对应流派推到 I 级附近，
   但后面的 2 / 3 级必须靠遗物与结晶真金白银地堆出来。 */


/* 结晶与改造卡对流派点数的贡献 */
const ARCH_GEM_PTS = { ragegem:1.0, fleshgem:1.0, chargegem:1.0, shieldgem:1.0 };
const ARCH_MOD_PTS = { ragefuel:1.2, bloodpact:1.2, chargeup:1.2 };

/* 一件遗物只喂**一个**流派：取它标签里第一个能对上流派的那个。
   原来只要标签有交集就给 2 点，于是一件 ['rage','tank'] 同时喂怒气和反伤、
   一件 ['fire','blast'] 同时喂火候和暴击——十几条流派一起长，
   最后条条点满，"选流派"这件事等于没做。 */
let RELIC_ARCH = null;
function relicArch(rid){
  if(!RELIC_ARCH){
    RELIC_ARCH = {};
    for(const rid2 in RELICS){
      const r = RELICS[rid2];
      if(!r || !r.tags) continue;
      let found = '';
      for(let i = 0; i < r.tags.length && !found; i++){
        for(let k = 0; k < ARCH_IDS.length; k++){
          if(ARCH[ARCH_IDS[k]].tags.indexOf(r.tags[i]) >= 0){ found = ARCH_IDS[k]; break; }
        }
      }
      RELIC_ARCH[rid2] = found;
    }
  }
  return RELIC_ARCH[rid] || '';
}

function archPtsRaw(id){
  const def = ARCH[id];
  if(!def || !P) return 0;
  /* 【铁律】一条流派只属于一个角色。别人即使因为历史存档带了同标签的件，
     也不该在这条流派上有任何进度。 */
  if(def.own && def.own !== (CHAR && CHAR.id)) return 0;
  let n = 0;
  /* 角色禀赋：只给本命第一条路线 */
  const routes = CHAR_ROUTES[CHAR && CHAR.id] || [];
  if(routes[0] === id) n += 2.5;
  else if(routes.indexOf(id) > 0) n += 0.8;
  /* 遗物：每件 2 点，但只算给它的主流派 */
  for(const rid in P.relics){
    if(relicArch(rid) === id) n += 2;
  }
  /* 结晶：每级 1 点 */
  for(const gid in ARCH_GEM_PTS){
    if(!P.passives || !P.passives[gid]) continue;
    const p = PASSIVES[gid];
    if(p && p.arch === id) n += (P.passives[gid] || 0) * ARCH_GEM_PTS[gid];
  }
  /* 改造卡：每条 1.2 点 */
  for(const wid in P.wmod){
    const list = P.wmod[wid] || [];
    for(let i = 0; i < list.length; i++){
      const mid = list[i];
      const owner = ARCH_MOD_PTS[mid];
      if(owner && owner === id) n += ARCH_MOD_PTS[mid];
    }
  }
  return n;
}

function archTier(id){
  const a = P && P.arch ? P.arch[id] : null;
  return a ? a.tier : 0;
}

/* 每局开始 / 每次选卡后重算，避免每帧遍历遗物 */
/* 专精折扣：投入最多的那条拿满，第二条 52%、第三条 32%、第四条往后 20%。
   这是回答"为什么所有流派都能点满"的正解——**不加门槛，加分心的代价**。
   集中投资的人能摸到 Ⅲ 级（8 点），摊大饼的人每条都停在 Ⅰ 级门口。
   门槛仍然是 2 / 5 / 8，没有为了"卡住玩家"而调高数字。 */
const ARCH_RANK_MUL = [1, 0.52, 0.32, 0.20];

function refreshArch(silent){
  if(!P) return;
  const raw = {};
  for(let i = 0; i < ARCH_IDS.length; i++) raw[ARCH_IDS[i]] = archPtsRaw(ARCH_IDS[i]);
  /* 排名按原始点数；同分时按 ARCH_IDS 顺序稳定排序，避免每帧抖动 */
  const ranked = ARCH_IDS.slice().sort(function(a, b){
    if(raw[b] !== raw[a]) return raw[b] - raw[a];
    return ARCH_IDS.indexOf(a) - ARCH_IDS.indexOf(b);
  });
  const out = {};
  for(let r = 0; r < ranked.length; r++){
    const id = ranked[r];
    /* 只有真正投了点的流派才吃折扣位次，0 点的直接 0，不占名额 */
    if(raw[id] <= 0){ out[id] = { pts: 0, tier: 0 }; continue; }
    const mul = ARCH_RANK_MUL[Math.min(ARCH_RANK_MUL.length - 1, r)];
    const pts = raw[id] * mul;
    let tier = 0;
    for(let k = 0; k < ARCH_TIER_MIN.length; k++) if(pts >= ARCH_TIER_MIN[k]) tier = k + 1;
    out[id] = { pts: pts, tier: tier, raw: raw[id] };
  }
  P.arch = out;
  if(!P.archSeen) P.archSeen = {};
  for(let i = 0; i < ARCH_IDS.length; i++){
    const id = ARCH_IDS[i];
    const t = out[id].tier;
    const seen = P.archSeen[id] || 0;
    if(t > seen){
      P.archSeen[id] = t;
      if(silent) continue;
      if(t === 1){
        showToast('◈ 流派成型：' + ARCH[id].name);
        state.flash = Math.max(state.flash, 0.18);
        sfx('arch');
      } else {
        showToast('◈ ' + ARCH[id].name + ' 提升至 ' + (t === 2 ? 'Ⅱ' : 'Ⅲ') + ' 级');
        state.flash = Math.max(state.flash, 0.22);
        sfx('arch');
      }
    } else if(t < seen){
      P.archSeen[id] = t;
    }
  }
  /* 血肉Ⅰ：最大生命 +10%（一次性，避免反复乘） */
  if(out.flesh.tier >= 1 && !P.fleshHpApplied){
    P.fleshHpApplied = true;
    const add = Math.round(P.maxHp * 0.10);
    P.maxHp += add;
    P.hp = Math.min(P.maxHp, P.hp + add);
  }
  /* 护盾流派的护盾上限只在有护盾来源时才成立，但字段本身由 getStats 乘 1.25 处理 */
}

/* 卡池倾斜：选定的流派持续主导三选一。
   原来最多 +48%，而新武器 / 升级卡的权重本来就有 1.3~3.0，
   这点倾斜完全被淹没，玩家仍然是在"随机抽卡"。
   现在：已成型流派 ×1.6 ~ ×2.4，完全无关的 ×0.62——差距接近 4 倍，
   "我选了这条路"在每一次三选一里都看得见。 */
function archWeight(tags){
  if(!tags || !tags.length || !P || !P.arch) return 1;
  let best = 0;
  for(let i = 0; i < ARCH_IDS.length; i++){
    const id = ARCH_IDS[i];
    const a = P.arch[id];
    if(!a || !a.tier) continue;
    const def = ARCH[id];
    let hit = false;
    for(let k = 0; k < def.tags.length; k++) if(tags.indexOf(def.tags[k]) >= 0){ hit = true; break; }
    if(hit && a.tier / 3 > best) best = a.tier / 3;
  }
  if(best > 0) return 1 + best * 1.4;
  return 0.62;
}

/* UI：当前流派的一行摘要（只显示已经有进度的） */
function archSummary(){
  const out = [];
  if(!P || !P.arch) return out;
  for(let i = 0; i < ARCH_IDS.length; i++){
    const id = ARCH_IDS[i];
    const a = P.arch[id];
    if(!a || a.pts <= 0) continue;
    out.push({
      id: id, name: ARCH[id].name, col: ARCH[id].col, icon: ARCH[id].icon,
      tier: a.tier, pts: a.pts,
      next: a.tier >= 3 ? 0 : ARCH_TIER_MIN[a.tier],
      nextName: a.tier >= 3 ? '' : ARCH[id].tiers[a.tier]
    });
  }
  out.sort(function(a, b){ return b.pts - a.pts; });
  return out;
}

/* 悬停说明用 */
function archHtml(id){
  const def = ARCH[id];
  if(!def) return '';
  const a = (P && P.arch && P.arch[id]) ? P.arch[id] : { pts:0, tier:0 };
  const lines = [];
  for(let i = 0; i < def.tiers.length; i++){
    const on = a.tier > i;
    lines.push('<div style="color:' + (on ? def.col : '#6f6285') + '">' +
      (on ? '✔ ' : '○ ') + '[' + (i + 1) + '] ' + def.tiers[i] + '</div>');
  }
  const next = a.tier >= 3 ? '已满级' : ('下一级还需 ' + Math.ceil(Math.max(0, ARCH_TIER_MIN[a.tier] - a.pts)) + ' 点');
  return '<b style="color:' + def.col + '">◈ ' + def.name + ' · ' + a.tier + ' 级</b>' +
    '<div style="margin-top:3px;color:#a99ac2">' + def.blurb + '（' + Math.round(a.pts) + ' 点 / ' + next + '）</div>' +
    lines.join('');
}

/* =========================================================
   4.7 友方单位
   ---------------------------------------------------------
   宠物和炮台是两套完全不同的东西：

   宠物 = 一支围绕主人的小队
     · 有队形槽位，主要待在玩家周围，只在短距离内追击
     · 超过牵引距离会主动放弃目标、返回主人身边
     · 彼此分离，不会挤成一个点
     · 8 种 AI：追击撕咬 / 空中射击 / 护卫拍击 / 吸收分裂 /
       喷火 / 冰弹 / 连锁电击 / 自爆再召唤

   炮台 = 一套自动化武器系统
     · 固定部署，有存在时间与数量上限，不会追着敌人跑
     · 真实子弹、炮口火光、命中反馈；激光/电弧是特例
     · 8 种定位：机枪 / 火箭 / 激光 / 冰冻 / 闪电 / 喷火 / 地雷工厂 / 维修
   ========================================================= */
let allies = [];
const ALLY_CAP = 26;   /* 引擎层面的同屏单位上限（防爆帧），不是玩法上限 */

/* 【4.2】炮台不再有"每种最多 N 座"的上限。
   ---------------------------------------------------------
   用户："工程师不应该设计炮台上限，就是随时部署炮台，
           只是把炮台的持续时间大幅降低。"
   这个改动是对的：上限让"我该放几座"变成一个隐性算术题，
   而且炮台满了之后 deployTurret 会**悄悄顶掉最旧的一座**，
   玩家看到的是"炮台在消失"，却不知道为什么。
   现在：想放几座放几座，炮台自己会很快到期消失（见 TURRET_LIFE），
   于是"场上几座"由**你的部署速度**决定，而不是一个藏起来的数字。
   唯一的硬约束是 ALLY_CAP（引擎层面的同屏单位上限，防止爆帧）。 */
const TURRET_NO_CAP = 999;
function turretLimitOf(ttype){ return TURRET_NO_CAP; }
function turretCountOf(ttype){
  let n = 0;
  for(let i = 0; i < allies.length; i++){
    const a = allies[i];
    if(a.kind === 'turret' && !a.dead && a.ttype === ttype) n++;
  }
  return n;
}
/* 某类炮台满了：替换掉这一类里最旧的一座，而不是直接放弃部署 */
function retireOldestTurret(ttype){
  let oldest = null;
  for(let i = 0; i < allies.length; i++){
    const a = allies[i];
    if(a.kind !== 'turret' || a.dead || a.ttype !== ttype) continue;
    if(!oldest || a.life < oldest.life) oldest = a;
  }
  if(oldest){ oldest.dead = true; oldest.life = 0; }
}
/* 兼容旧调用：总上限（只用于 UI 展示） */
function turretLimit(){ return turretLimitOf('mg'); }
/* 宠物上限：和炮台一样，**按 petType 分别计算**。
   旧版是所有宠物共享一个总额，狗和鸟先占满，后面的猫/史莱姆就永远不出现。 */
function petLimitOf(type){
  let n = 2;                                   /* 每种宠物基础 2 只 */
  if(CHAR.petLimit && CHAR.petLimit() > 3) n = 4;   /* 饲养员每种 4 只 */
  n += (relicStat().petBonus || 0);
  if(gemLv('packhorn') >= 2) n += 1;
  if(archTier('beast') >= 2) n += 1;
  return Math.min(6, n);
}
/* 总上限（UI 展示 + 兜底） */
function petLimit(){
  let n = 3;
  if(CHAR.petLimit) n = CHAR.petLimit();
  n += (relicStat().petBonus || 0);
  if(gemLv('packhorn') >= 2) n += 1;
  return Math.min(10, n);
}
function allyCount(kind){
  let n = 0;
  for(let i = 0; i < allies.length; i++){
    const a = allies[i];
    if(a.dead) continue;
    if(!kind || a.kind === kind) n++;
  }
  return n;
}

function deployTurret(type, x, y, lv, dmg, dur){
  if(allies.length >= ALLY_CAP) return null;
  const T = TURRETS[type] || TURRETS.mg;
  const rate = (CHAR.turretRate ? CHAR.turretRate() : 1) * (ST.turretRate || 1) * (1 + (P.turretOverclock || 0));
  /* 阵地协同：每多一座炮台，所有炮台伤害 +8%（最多 +40%） */
  const gridBonus = 1 + Math.min(5, Math.max(0, allyCount('turret'))) * 0.08;
  const life = dur * relicStat().turretLife;
  const a = {
    id: uid++, kind:'turret', ttype: type, name: T.name, col: T.col,
    x: clamp(x, 20, ARENA.w - 20), y: clamp(y, 20, ARENA.h - 20),
    hp: T.hp + lv * 34 + (P.level || 1) * 9, maxHp: T.hp + lv * 34 + (P.level || 1) * 9, r: 8,
    dmg: dmg * T.dmg * allyTimeScale() * gridBonus * (CHAR.turretDmg ? CHAR.turretDmg() : 1),
    /* 【原来这里只算了基础冷却】炮台的「加速 / 增殖」改造卡从来没生效过——
       cd 直接取 T.rate / rate，改造卡等于不存在。现在接上 wCdMul（加速 −20%），
       弹道数按等级成长（每 2 级 +1 发），增殖再 +1 发。 */
    cd: T.rate / rate * wCdMul('turret'),
    burst: (T.burst || 1) + (hasMod('turret', 'count') ? 1 : 0) + Math.floor(Math.max(0, lv - 1) / 2),
    t: rand(0, 0.25),
    life: life, maxLife: life, lv: lv, dead: false, flash: 0, muzzle: 0,
    range: T.range + lv * 6, ang: -Math.PI / 2, seed: rand(0, 10)
  };
  allies.push(a);
  rings.push({ x:a.x, y:a.y, r0:2, r1:24, life:0.22, max:0.22, col:T.col, w:2 });
  sfx('deploy');
  return a;
}

   而小怪血量按 3 次方涨，不补就会被甩开。这里按时间给一条温和的补偿曲线。 */
function allyTimeScale(){
  return 1 + Math.max(0, state.time) / 300;
}

function spawnPet(x, y, lv, dmg, life, forceType, srcId){
  if(allies.length >= ALLY_CAP) return null;
  let type = forceType;
  if(!type){
    /* 等级越高，能出场的宠物种类越多 */
    const pool = lv >= 5 ? PET_ORDER
      : (lv >= 4 ? PET_ORDER.slice(0, 6)
      : (lv >= 3 ? PET_ORDER.slice(0, 5)
      : (lv >= 2 ? PET_ORDER.slice(0, 3) : ['dog'])));
    type = pickOne(pool);
  }
  const def = PET_TYPES[type];
  const hp = def.hp + lv * 16 + (P.level || 1) * 14;
  /* 宠物改造卡按"类别"生效：
       近战 → 移速 / 伤害 / 冷却
       AOE  → 范围 / 冷却
       远程 → 弹道 / 冷却
     原来宠物根本不知道自己属于哪把武器，改造卡对它们等于不存在。 */
  const src = srcId || null;
  /* 「狼群」分支：狗狗移速 +50% */
  const packSpd = (P && P.evoFlag && src && P.evoFlag[src] === 'packSpeed') ? 1.5 : 1;
  const mSpd  = (src && hasMod(src, 'swift') ? 1.25 : 1) * packSpd;
  const mCd   = src ? wCdMul(src) : 1;
  const mSize = src && hasMod(src, 'size') ? 1.30 : 1;
  const a = {
    id: uid++, kind:'pet', ptype: type, name: def.name, col: def.col,
    x, y, vx:0, vy:0, hp, maxHp: hp, r: 7,
    dmg: dmg * ST.petMul * def.dmg * allyTimeScale(), cd: def.cd * mCd, t: rand(0, 0.5),
    spd: def.spd * mSpd, mode: def.mode, role: def.role, range: def.range * mSize, src,
    leash: def.leash, elem: def.elem || null, lv: lv,
    life: life || 0, maxLife: life || 0, seed: rand(0, 10),
    dead: false, flash: 0, hitCd: 0, ang: rand(0, TAU), anim: 0,
    state:'follow', slot: allyCount('pet'), tgt: null, tgtT: 0
  };
  allies.push(a);
  burst(a.x, a.y, def.col, 8, 90, 0);
  sfx('deploy');
  return a;
}

function onAllyDeath(a, silentBoom){
  const col = a.col || '#8ee6b3';
  burst(a.x, a.y, col, 10, 110, 0);
  sfx('petDie');
  emit('allyDeath', a);
  if(a.kind === 'pet'){
    /* 【P0 修复】自爆蘑菇原来是"攻击时炸一次 → 死亡处理再炸一次 → 立即可重生"，
       而且重生出来的蘑菇攻击间隔是 0，下一帧又炸。三处叠加成一条无限循环，
       funcgate 里它 20 秒打出了 10.5 万伤害（是第二名的 8 倍）。
       现在：爆炸只由攻击入口触发一次（silentBoom），死亡处理不再重复结算，
       重生交给武器自己的补员节奏（不再无延迟立即复活）。 */
    if(a.ptype === 'bomb'){
      /* 自爆蘑菇本身就是一次性单位，和流派无关 */
      if(!silentBoom) explode(a.x, a.y, 58, a.dmg * 0.8 + 6, '#ff6b8b', false, 'pet');
    } else if(CHAR.onPetDeath){
      CHAR.onPetDeath(a);
    } else if(archTier('sacrifice') >= 1){
      explode(a.x, a.y, 30, 12 + P.level * 3, col, true, 'pet');
    }
  }
}

/* =========================================================
   每帧更新
   ========================================================= */
function updateAllies(dt){
  for(let i = allies.length - 1; i >= 0; i--){
    const a = allies[i];
    if(a.dead) continue;
    if(a.flash > 0) a.flash -= dt;
    if(a.muzzle > 0) a.muzzle -= dt;
    if(a.life > 0){
      a.life -= dt;
      if(a.life <= 0){
        if(a.kind === 'turret'){ burst(a.x, a.y, a.col, 8, 80, 0); a.dead = true; continue; }
        if(a.kind === 'pet' && a.maxLife > 0){ a.dead = true; continue; }
      }
    }
    if(a.kind === 'turret') updateTurret(a, dt);
    else if(a.kind === 'pet') updatePet(a, dt);
  }
  separateAllies();
  let any = false;
  for(let i = 0; i < allies.length; i++) if(allies[i].dead){ any = true; break; }
  if(any) allies = allies.filter(a => !a.dead);
}

/* ---------------- 炮台 ---------------- */
function turretTarget(a){
  /* 火力网：优先打别的炮台也在打的敌人，形成交叉覆盖 */
  const t = nearestEnemy(a.x, a.y, a.range);
  if(!t) return null;
  const marked = state.turretMark;
  if(marked && !marked.dead && dist(a.x, a.y, marked.x, marked.y) <= a.range) return marked;
  return t;
}

/* 阵地协同：相邻炮台互相超频。
   炮台挨得越密火力越猛，于是"先摆哪、摆多密"变成真正的决策，
   而不是随便丢在地上各打各的。 */
function turretAdjMul(a){
  let n = 0;
  for(let i = 0; i < allies.length; i++){
    const o = allies[i];
    if(o === a || o.dead || o.kind !== 'turret') continue;
    if(dist(a.x, a.y, o.x, o.y) < 120) n++;
  }
  return 1 + Math.min(3, n) * 0.18;
}

function updateTurret(a, dt){
  const T = TURRETS[a.ttype] || TURRETS.mg;
  a.t -= dt * turretAdjMul(a);
  const tgt = turretTarget(a);
  if(!tgt){
    a.ang += dt * 0.6;                      /* 待机时缓慢巡视 */
    return;
  }
  /* 转向瞄准：不是瞬间对准，有一个可见的转角 */
  const want = Math.atan2(tgt.y - a.y, tgt.x - a.x);
  let df = want - a.ang;
  while(df > Math.PI) df -= TAU;
  while(df < -Math.PI) df += TAU;
  a.ang += clamp(df, -7 * dt, 7 * dt);
  if(Math.abs(df) > 0.35) return;           /* 没对准之前不开火 */

  if(a.t > 0) return;
  a.t = a.cd;
  a.muzzle = 0.08;
  state.turretMark = tgt;

  const crit = relic('turretcrit') ? ST.crit : ST.crit * 0.4;
  /* 防线协同：相邻的【不同类型】炮台会把彼此的元素串过来。
     冰塔挨着机枪，机枪子弹就带冰；电塔挨着机枪就带感电。
     不需要任何按键，是"摆放"本身产生的结果——这才是摆一片阵地的意义。 */
  let el = T.elem ? [T.elem].concat(modElems('turret')) : modElems('turret').slice();
  for(let ti = 0; ti < allies.length; ti++){
    const o = allies[ti];
    if(o === a || o.dead || o.kind !== 'turret' || o.ttype === a.ttype) continue;
    if(dist(a.x, a.y, o.x, o.y) > 120) continue;
    const ot = TURRETS[o.ttype];
    if(ot && ot.elem && el.indexOf(ot.elem) < 0) el.push(ot.elem);
  }

  if(T.kind === 'bullet'){
    /* 「散射」改造：弹道翻倍 + 扇面拉宽。屏幕上直接多出一片弹幕，
       这是工程师版的"看得见的爽"，和游侠的散射是同一套语言。 */
    const scatter = hasMod('turret', 'scatter');
    const shots = (a.burst || T.burst || 1) * (scatter ? 2 : 1);
    const spreadMul = scatter ? 2.4 : 1;
    for(let k = 0; k < shots; k++){
      const ang = a.ang + rand(-T.spread * spreadMul, T.spread * spreadMul);
      bullets.push({
        type:'tshot', x:a.x, y:a.y,
        vx: Math.cos(ang) * T.speed, vy: Math.sin(ang) * T.speed,
        r:3.4, dmg:a.dmg, life:0.8, pierce:0, range:a.range + 40,
        hitSet:new Set(), hitCount:0, rot:ang, spin:0,
        col:a.col, src:'turret', elem: el, critChance:crit
      });
    }
    sfx('turret');
  } else if(T.kind === 'missile'){
    bullets.push({
      type:'missile', x:a.x, y:a.y,
      vx: Math.cos(a.ang) * T.speed, vy: Math.sin(a.ang) * T.speed,
      r:5, dmg:a.dmg, life:3.2, pierce:0, homing:120, range:a.range + 120,
      boom: T.aoe * ST.blast, hitSet:new Set(), hitCount:0,
      rot:a.ang, spin:0, col:a.col, src:'turret', elem: el, critChance:crit
    });
    sfx('shoot');
  } else if(T.kind === 'beam'){
    fireBeam(a.x, a.y, a.ang, a.range, 4 + a.lv, a.dmg, 'turret');
    sfx('zap');
  } else if(T.kind === 'chain'){
    let cur = tgt, fx = a.x, fy = a.y, dmg = a.dmg;
    const hit = new Set();
    for(let j = 0; j < (T.jumps + a.lv); j++){
      if(!cur) break;
      hit.add(cur.id);
      dealDamage(cur, dmg, { src:'turret', critChance:crit });
      if(el.length) elemOnHit(cur, el, dmg, 'turret');
      beams.push({ x:fx, y:fy, ang: Math.atan2(cur.y - fy, cur.x - fx),
        len: dist(fx, fy, cur.x, cur.y), width:2, life:0.1, max:0.1, col:a.col, src:'turret' });
      fx = cur.x; fy = cur.y;
      dmg *= 0.8;
      let best = null, bd = 1e9;
      eachNear(fx, fy, 150, function(o){
        if(hit.has(o.id)) return;
        const d = dist(fx, fy, o.x, o.y);
        if(d < bd){ bd = d; best = o; }
      });
      cur = best;
    }
    sfx('zap');
  } else if(T.kind === 'flame'){
    for(let k = 0; k < T.burst; k++){
      const ang = a.ang + rand(-T.spread, T.spread);
      bullets.push({
        type:'flame', x:a.x, y:a.y,
        vx: Math.cos(ang) * rand(170, 230), vy: Math.sin(ang) * rand(170, 230),
        r:7, dmg:a.dmg, life:0.42, pierce:4, range:a.range,
        hitSet:new Set(), hitCount:0, rot:ang, spin:0,
        col:'#ff8a3d', src:'turret', elem:['fire'], critChance:crit
      });
    }
    sfx('splat');
  } else if(T.kind === 'mine'){
    if(mines.length < 54){
      mines.push({
        x: clamp(a.x + rand(-34, 34), 16, ARENA.w - 16),
        y: clamp(a.y + rand(-34, 34), 16, ARENA.h - 16),
        r: 15, dmg: a.dmg * 2.2, boom: 46 * ST.blast, arm: 0.3,
        life: 16, seed: rand(0, 10), evo: a.lv >= 5, src:'mine'
      });
    }
    sfx('deploy');
  } else if(T.kind === 'repair'){
    let n = 0;
    for(let i = 0; i < allies.length && n < 3; i++){
      const o = allies[i];
      if(o.kind !== 'turret' || o === a || o.dead) continue;
      if(dist(a.x, a.y, o.x, o.y) > T.range) continue;
      n++;
      o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.25);
      o.t = Math.max(0, o.t - 0.35);
      rings.push({ x:o.x, y:o.y, r0:4, r1:16, life:0.2, max:0.2, col:'#8ee6b3', w:1.5 });
    }
    sfx('bubble');
  }
  if(CHAR.onAllyKill && tgt.dead) CHAR.onAllyKill(a, tgt);
}

/* ---------------- 宠物：跟随 / 索敌 / 短追 / 攻击 / 返回 ---------------- */
function petSlot(a){
  const n = Math.max(1, allyCount('pet'));
  const idx = Math.min(a.slot < 0 ? 0 : a.slot, n - 1);
  const base = P.facing > 0 ? Math.PI : 0;        /* 默认躲在身后 */
  const spread = Math.min(Math.PI * 1.5, 0.7 + n * 0.22);
  const ang = base + (n === 1 ? 0 : (idx / (n - 1) - 0.5) * spread);
  const rad = 40 + (idx % 3) * 12;
  return { x: P.x + Math.cos(ang) * rad, y: P.y + Math.sin(ang) * rad };
}

/* 你带了几把宠物武器：兽群协同的强度来源 */
function petWeaponCount(){
  let n = 0;
  for(const id in P.weapons){
    const w = WEAPONS[id];
    if(w && w.petType) n++;
  }
  return n;
}

function updatePet(a, dt){
  a.anim += dt * 6;
  if(a.hitCd > 0) a.hitCd -= dt;
  if(a.tgtT > 0) a.tgtT -= dt;
  if(a.tgt && (a.tgt.dead || a.tgtT <= 0)){ a.tgt = null; a.tgtT = 0; }

  const dPlayerX = P.x - a.x, dPlayerY = P.y - a.y;
  const dPlayer = Math.hypot(dPlayerX, dPlayerY);

  /* 1) 没有目标就找一个：只找主人附近的敌人，绝不追半张地图 */
  if(!a.tgt && a.tgtT <= 0){
    let best = null, bd = 1e9;
    eachNear(P.x, P.y, a.leash * 1.15, function(e){
      if(e.dead) return;
      const dP = dist(P.x, P.y, e.x, e.y);
      const dS = dist(a.x, a.y, e.x, e.y);
      /* 护卫型优先打靠近主人的，追击型优先打离自己近的 */
      const score = a.role === 'guard' ? dP + dS * 0.4 : dP * 0.4 + dS;
      if(score < bd){ bd = score; best = e; }
    });
    if(best){ a.tgt = best; a.tgtT = 2.4; }
  }

  /* 2) 牵引：目标离主人太远，或者自己跑太远 → 放弃并回防 */
  if(a.tgt && dist(P.x, P.y, a.tgt.x, a.tgt.y) > a.leash) a.tgt = null;
  if(dPlayer > a.leash * 1.25) a.tgt = null;

  let tx, ty, stop;
  if(a.tgt && dist(a.x, a.y, a.tgt.x, a.tgt.y) < a.range + (a.tgt.r || 6)){
    a.state = 'attack';
    tx = a.tgt.x; ty = a.tgt.y; stop = 0;
  } else if(a.tgt){
    a.state = 'chase';
    tx = a.tgt.x; ty = a.tgt.y; stop = a.range * 0.75;
  } else {
    a.state = dPlayer > 24 ? 'return' : 'follow';
    const sl = petSlot(a);
    tx = sl.x; ty = sl.y; stop = 6;
  }

  /* 3) 平滑移动：速度插值，不会有瞬移和抖动 */
  const d = Math.hypot(tx - a.x, ty - a.y);
  let wantVx = 0, wantVy = 0;
  if(d > stop){
    const sp = a.spd * (a.hp < a.maxHp * 0.35 ? 0.9 : 1);
    wantVx = (tx - a.x) / d * sp;
    wantVy = (ty - a.y) / d * sp;
  }
  const k = 1 - Math.pow(0.001, dt);
  a.vx = lerp(a.vx, wantVx, k);
  a.vy = lerp(a.vy, wantVy, k);
  a.x += a.vx * dt;
  a.y += a.vy * dt;
  a.x = clamp(a.x, 10, ARENA.w - 10);
  a.y = clamp(a.y, 10, ARENA.h - 10);
  if(Math.abs(a.vx) + Math.abs(a.vy) > 8) a.ang = Math.atan2(a.vy, a.vx);

  /* 4) 攻击 */
  if(a.state !== 'attack' || !a.tgt) return;
  a.t -= dt;
  if(a.t > 0) return;
  /* 兽群协同：每多一把宠物武器，全体宠物冷却 -7%（最多 -29%） */
  const sync = 1 + Math.min(5, petWeaponCount() - 1) * 0.08;
  a.t = a.cd / sync;
  attackPet(a, a.tgt);
}

function attackPet(a, tgt){
  const crit = (CHAR.petCrit ? CHAR.petCrit() : ST.crit * 0.5) + ST.crit * 0.2;
  let el = a.elem ? [a.elem].concat(modElems('pet')) : modElems('pet');
  /* 兽性元素：宠物攻击必定附加你最近一次用过的元素 */
  if(relic('petelem') && P.lastElem && el.indexOf(P.lastElem) < 0) el = el.concat([P.lastElem]);
  /* 同类宠物目睹同伴死亡后变凶：每层 +8%，最多 5 层（由 onPetDeath 累加） */
  const rage = 0;   /* 旧的 petRage 已被「献祭」流派的 sacStack 取代 */
  /* 饲养员专属技能「兽群狂化」：6 秒内全体宠物 +60% 伤害 */
  const fury = (P && P.packFury > 0) ? 1.6 : 1;
  const dmg = a.dmg * (1 + rage * 0.08) * fury;

  if(a.mode === 'shot'){
    /* 远程宠物的「散射」：一次三发扇形。这是远程宠物唯一的"弹道"成长轴。 */
    const fan = (a.src && hasMod(a.src, 'scatter')) ? [-0.16, 0, 0.16] : [0];
    for(const off of fan){
      const ang = a.ang + off;
      bullets.push({
        type:'tshot', x:a.x, y:a.y,
        vx: Math.cos(ang) * 380, vy: Math.sin(ang) * 380,
        r:4, dmg: dmg * (fan.length > 1 ? 0.62 : 0.85), life:0.9, pierce:0, range: a.range + 60,
        hitSet:new Set(), hitCount:0, rot:ang, spin:0,
        col:a.col, src:'pet', elem: el, critChance:crit
      });
    }
    sfx('pop');
  } else if(a.mode === 'chain'){
    let cur = tgt, fx = a.x, fy = a.y, d = dmg;
    const hit = new Set();
    for(let j = 0; j < 3; j++){
      if(!cur) break;
      hit.add(cur.id);
      dealDamage(cur, d, { src:'pet', critChance:crit });
      if(el.length) elemOnHit(cur, el, d, 'pet');
      beams.push({ x:fx, y:fy, ang: Math.atan2(cur.y - fy, cur.x - fx),
        len: dist(fx, fy, cur.x, cur.y), width:2, life:0.1, max:0.1, col:a.col, src:'pet' });
      fx = cur.x; fy = cur.y; d *= 0.75;
      let best = null, bd = 1e9;
      eachNear(fx, fy, 130, function(o){
        if(hit.has(o.id)) return;
        const dd = dist(fx, fy, o.x, o.y);
        if(dd < bd){ bd = dd; best = o; }
      });
      cur = best;
    }
    sfx('zap');
  } else if(a.mode === 'cone'){
    for(let i = 0; i < 4; i++){
      const ang = a.ang + rand(-0.28, 0.28);
      bullets.push({
        type:'flame', x:a.x, y:a.y,
        vx: Math.cos(ang) * rand(180, 240), vy: Math.sin(ang) * rand(180, 240),
        r:6, dmg: dmg * 0.55, life:0.4, pierce:4, range:a.range,
        hitSet:new Set(), hitCount:0, rot:ang, spin:0,
        col:'#ff8a3d', src:'pet', elem: el, critChance:crit
      });
    }
    sfx('splat');
  } else if(a.mode === 'sweep'){
    eachNear(a.x, a.y, 40, function(e){
      dealDamage(e, dmg * 0.9, { src:'pet', critChance:crit });
      if(el.length) elemOnHit(e, el, dmg, 'pet');
    });
    rings.push({ x:a.x, y:a.y, r0:6, r1:40, life:0.2, max:0.2, col:a.col, w:2 });
    sfx('pop');
  } else if(a.mode === 'suicide'){
    /* 自爆只在这里结算一次；死亡处理用 silentBoom 跳过重复爆炸 */
    /* 【3.0 修复】原来这里写的是固定 26 + lv*8，完全不读 a.dmg —— 
       自爆蘑菇吃了武器等级、改造卡、BALANCE 校准全部不生效，
       所以它永远是全场最低的 DPS。现在按 a.dmg 结算。 */
    explode(a.x, a.y, 58, a.dmg * 0.8 + 6, '#ff6b8b', false, 'pet');
    a.dead = true;
    onAllyDeath(a, true);
    return;
  } else {
    dealDamage(tgt, dmg, { src:'pet', critChance:crit });
    if(el.length) elemOnHit(tgt, el, dmg, 'pet');
    /* 【4.2】「献祭」流派改成「爆裂」：宠物不再死亡，所以原来的
       "死亡爆炸"没有触发条件了。现在宠物每次攻击都附带一圈小爆炸，
       层数越高爆炸越大越狠。 */
    if(typeof archTier === 'function' && archTier('sacrifice') >= 1){
      const t = archTier('sacrifice');
      explode(tgt.x, tgt.y, 26 + t * 12, dmg * (0.35 + t * 0.15), '#ff6b8b', true, 'pet');
    }
    if(PET_TYPES[a.ptype] && PET_TYPES[a.ptype].split && a.hp < a.maxHp * 0.5 && Math.random() < 0.25){
      /* 史莱姆被打破会分裂出小史莱姆 */
      if(allies.length < ALLY_CAP) spawnPet(a.x + rand(-16, 16), a.y + rand(-16, 16), Math.max(1, a.lv - 1), a.dmg * 0.5, 8, 'slime');
    }
    burst(tgt.x, tgt.y, a.col, 3, 70, 0);
    sfx('hit');
  }
}

/* ---------------- 队形分离：别挤成一个点 ---------------- */
function separateAllies(){
  const n = allies.length;
  if(n < 2) return;
  for(let i = 0; i < n; i++){
    const a = allies[i];
    if(a.dead) continue;
    for(let j = i + 1; j < n; j++){
      const b = allies[j];
      if(b.dead) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;
      const mr = (a.r + b.r) * 1.4;
      if(d2 < mr * mr && d2 > 0.0001){
        const d = Math.sqrt(d2);
        const push = (mr - d) * 0.35;
        a.x += (dx / d) * push; a.y += (dy / d) * push;
        b.x -= (dx / d) * push; b.y -= (dy / d) * push;
      }
    }
  }
}

/* 敌人贴身会揍宠物 / 炮台 */
function alliesTakeContact(dt){
  if(!allies.length) return;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    for(let j = 0; j < allies.length; j++){
      const a = allies[j];
      /* 宠物不参与承伤（见 12-engine 的 damageAlly） */
      if(a.dead || a.hitCd > 0 || a.kind === 'pet') continue;
      const dx = e.x - a.x, dy = e.y - a.y;
      const rr = e.r + a.r;
      if(dx * dx + dy * dy > rr * rr) continue;
      a.hitCd = 0.7;
      damageAlly(a, (e.dmg || 8) * 0.22 + 2.5);
      if(a.dead) break;
    }
  }
}
/* =========================================================
   4.8 节奏导演
   ---------------------------------------------------------
   单局能活多久是结果，不是目标：
     · 卡组烂 → 第一次精英/首 BOSS 就顶不住，2–4 分钟结束
     · 一般   → 6–9 分钟
     · 成型   → 12–18 分钟
     · 胡牌   → 20 分钟以上，进入无尽强化
   导演只负责在正确的时刻施压，不负责限制时长。
   ========================================================= */
const ACTS = [
  { id:1, from:0,   name:'第一幕 · 立流派', sub:'先活下来，找到这局的方向' },
  { id:2, from:80,  name:'第二幕 · 成型',   sub:'把咬合的几件拼起来' },
  { id:3, from:220, name:'第三幕 · 爆发',   sub:'让连锁自己滚起来' },
  { id:4, from:600, name:'终局 · 拖鞋之王', sub:'10:00 击败拖鞋之王即可通关' }
];

function directorTick(dt){
  const t = state.time;
  let act = 1;
  for(let i = 0; i < ACTS.length; i++) if(t >= ACTS[i].from) act = ACTS[i].id;
  if(act !== state.act){
    state.act = act;
    onActStart(act);
  }

  /* 场地事件：2:30 起每 55 秒来一次，制造起伏 */
  if(t > 150){
    state.eventT = (state.eventT === undefined ? 55 : state.eventT) - dt;
    if(state.eventT <= 0){
      state.eventT = 55;
      arenaEvent();
    }
  }

  /* 无尽阶段：通关之后继续玩才启动（每分钟送强化，Boss 循环加速） */
  if(act >= 4 && state.endless){
    state.endlessT = (state.endlessT === undefined ? 60 : state.endlessT) - dt;
    if(state.endlessT <= 0){
      state.endlessT = 60;
      endlessTick();
    }
  }
}

function onActStart(act){
  const a = ACTS[act - 1];
  showToast(a.name);
  bgmSetAct(act);
  state.flash = Math.max(state.flash, 0.25);
  state.shake = Math.max(state.shake, 3);
  rings.push({ x:P.x, y:P.y, r0:10, r1:220, life:0.8, max:0.8, col:'#ffe066', w:3 });

  if(act === 2){
    /* 第二幕开场：一圈怪潮，逼玩家确认自己的清场手段 */
    spawnHorde();
  } else if(act === 3){
    /* 第三幕：精英小队 */
    for(let i = 0; i < 2; i++){
      const ang = rand(0, TAU);
      spawnEliteAt(clamp(P.x + Math.cos(ang) * 200, 40, ARENA.w - 40),
                   clamp(P.y + Math.sin(ang) * 200, 40, ARENA.h - 40));
    }
  } else if(act === 4){
    /* 终局：拖鞋之王登场。它不是"更厚的怪"，而是这一局的目标 */
    spawnFinalBoss();
    addText(P.x, P.y - 44, '终局', '#ff9dc0', 16);
  }
}

/* ---------------- 场地事件 ---------------- */
const ARENA_EVENTS = ['toxic', 'storm', 'supply', 'portal'];

function arenaEvent(){
  /* 【3.5】补给空投在后期是纯减压事件：玩家血量 1000+，一次 3 个 10% 血包，
     等于白送 30% 生命。前期它该是"喘口气"，后期它不该继续按 25% 概率出现。
     权重从 25/25/25/25 变成 30/30/8/32（越到后期补给越少）。 */
  const lateK = Math.min(1, Math.max(0, (state.time - 180) / 360));
  const w = {
    toxic: 30 + lateK * 6,
    storm: 30 + lateK * 6,
    supply: 25 - lateK * 17,
    portal: 25 + lateK * 9
  };
  const bag = [];
  for(const k in w){ for(let i = 0; i < Math.round(w[k]); i++) bag.push(k); }
  const kind = pickOne(bag);
  if(kind === 'toxic'){
    showToast('☣ 毒雾扩散');
    for(let i = 0; i < 4; i++){
      const a = rand(0, TAU), d = rand(60, 200);
      addHazard(clamp(P.x + Math.cos(a) * d, 40, ARENA.w - 40),
                clamp(P.y + Math.sin(a) * d, 40, ARENA.h - 40), rand(34, 52), rand(6, 9), 7);
    }
  } else if(kind === 'storm'){
    showToast('⚡ 闪电风暴');
    for(let i = 0; i < 8; i++){
      const a = rand(0, TAU), d = rand(40, 240);
      strikes.push({ kind:'zap', x: clamp(P.x + Math.cos(a) * d, 20, ARENA.w - 20),
        y: clamp(P.y + Math.sin(a) * d, 20, ARENA.h - 20),
        delay: 0.25 + i * 0.22, max: 0.5, r: 40 * ST.area,
        /* 【5.0】场地闪电一下 30 点起（约 8~10% 生命），走同一条攻击曲线 */
        dmg: 30 * atkCurve(state.time), seed: rand(0, 100), src:'bolt' });
    }
  } else if(kind === 'supply'){
    showToast('🎁 补给空投');
    for(let i = 0; i < 3; i++){
      const a = rand(0, TAU), d = rand(50, 150);
      dropHeal(clamp(P.x + Math.cos(a) * d, 40, ARENA.w - 40),
               clamp(P.y + Math.sin(a) * d, 40, ARENA.h - 40), 0.10);
    }
    for(let i = 0; i < 6; i++) dropGem(P.x + rand(-90, 90), P.y + rand(-70, 70), 4);
  } else {
    showToast('🌀 裂隙开启：精英来了');
    for(let i = 0; i < 3; i++){
      const a = (i / 3) * TAU + rand(-0.3, 0.3);
      const x = clamp(P.x + Math.cos(a) * 190, 40, ARENA.w - 40);
      const y = clamp(P.y + Math.sin(a) * 190, 40, ARENA.h - 40);
      spawnEliteAt(x, y, pickType());
      rings.push({ x, y, r0:6, r1:60, life:0.5, max:0.5, col:'#b98cff', w:3 });
    }
  }
}

/* 无尽阶段：每分钟强化一次，同时把 BOSS 间隔压短 */
function endlessTick(){

  P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.25);

  rings.push({ x:P.x, y:P.y, r0:10, r1:160, life:0.6, max:0.6, col:'#ff9dc0', w:4 });
}

/* ---------------------------------------------------------
   属性汇总：角色底子 × 结晶 × 遗物 × 共鸣
   --------------------------------------------------------- */
function getStats(){
  const p = P ? P.passives : {};
  const lv = id => p[id] || 0;
  const S = relicStat();
  const C = CHAR || CHARS.ranger;
  /* 【4.0】护甲：从"百分比相加 + 一个 42% 的硬顶"改成**点数 + 边际递减**。
     ---------------------------------------------------------
     旧写法的病：0.04/级 + 0.03/级 + 角色 3~7% + 遗物 10%×N 直接相加，
     三件装备就顶到 42% 的封顶值，之后所有人再拿护甲都是 0 收益——
     玩家不是"变强变慢了"，是一条路走到某个点直接断掉。
     现在所有来源换算成点数，减伤 = A/(A+58)：
       40 点 → 41%，80 点 → 58%，160 点 → 73%。
     永远在涨，但每一点的收益越来越小，不存在"堆到顶就没事干"。 */
  /* 【4.1】护甲是**全游戏唯一的减伤**，所有防御来源都换算成点数。
     ---------------------------------------------------------
     4.0 时护甲之外还并行着四条免伤（遗物 hurtTaken / 骑士格挡 /
     护盾期减伤 / 宠物挡刀）。玩家看到面板写"护甲 40%"，
     实际却只吃三成伤害——面板和体感永远对不上。
     4.1 把它们全部折算成点数，减伤仍然只有一条曲线 A/(A+58)：
       护甲结晶 / 甲壳结晶 / 铁皮罐头 …  装备
       骑士带近战武器 +7、宠物护卫 +2.1、炮台护卫 +4.6  角色与召唤物
       混沌骰子 −15（诅咒）
     点数没有上限，也没有"堆到某个点就完全没用"。 */
  const armorPts = 0.50 * Math.max(0, (P ? P.level : 1) - 1)
    + 4 * lv('plate') + 3 * lv('shell')
    + (C.armor || 0) * 100 + S.armor
    + (hasMeleeWeapon() ? (C.blockArmor || 3) : 0)
    + guardPtsAll();
  const armorVal = armorDR(armorPts);
  const maxHpVal = (P && P.maxHp) ? P.maxHp : 200;

  /* ---- 3.0 成长类加成：全部从计数器直接算，不需要每杀一只重算属性 ---- */
  const growBonus =
      (P && P.devour ? P.devour * 0.01 : 0)                    /* 吞噬之心 */
    + (P && P.gemDmg ? P.gemDmg : 0)                            /* 贪婪之卵 */
    + (P && P.growthHp ? P.growthHp * 0.006 : 0)                /* 生长之种 */
    + (P && P.feastHp ? P.feastHp * 0.0002 : 0);                /* 血肉盛宴：每 50 点 +1% */
  /* 血肉增生：每 100 最大生命 +4% 伤害 */
  const fleshMassBonus = relic('fleshmass') ? Math.min(0.28, Math.floor(maxHpVal / 100) * 0.04) : 0;

  const rageTier = archTier('rage');
  const chargeTier = archTier('charge');
  const fleshTier = archTier('flesh');
  const shieldTier = archTier('shield');
  const thornTier = archTier('thorns');
  const beastTier = archTier('beast');
  const sacTier = archTier('sacrifice');
  const barrageTier = archTier('barrage');
  const critTier = archTier('crit');
  const elemTier = archTier('elem');
  const pierceTier = archTier('pierce');
  const turretTier = archTier('turret');
  const gridTier = archTier('grid');
  const heatTier = archTier('heat');
  const freezeTier = archTier('freeze');

  return {
    speed: C.speed * (1 + 0.09 * lv('shoe')) * S.speed
           * (relic('syncer') ? Math.max(0.76, 1 - turretCountLive() * 0.04) : 1)
           /* 【3.3】游侠的转速表接上机动性：充能越高跑得越快（最多 +14%）。
              他是全场最脆的角色（265 血 / 3% 护甲），"靠躲不靠血"必须真的成立。
              之前唯一的防御是血条，而血条又被压到最低，等于只削弱没补偿。 */
           * ((C.hasCharge && P && P.charge > 0)
              ? (1 + Math.min(1, P.charge / 100) * 0.14) : 1),
    /* 相位斗篷：闪避成功后的 1.2 秒窗口内冷却 ×0.55 */
    cdMul: Math.pow(0.91, lv('sauce')) * S.cdMul * (P && P.phaseT > 0 ? 0.55 : 1) * (barrageTier >= 1 ? 0.92 : 1)
           * (turretTier >= 3 ? Math.max(0.70, 1 - turretCountLive() * 0.05) : 1)
           * (relic('syncer') ? Math.max(0.72, 1 - turretCountLive() * 0.04) : 1),
    /* 【2.6 平衡】范围整体 ×0.78：AOE 覆盖越大，"怪进不来"就越无解 */
    area: (1 + 0.13 * lv('lens')) * S.area * 0.78,
    range: (1 + 0.14 * lv('reach')) * S.range,
    blast: (1 + 0.13 * lv('blast')) * S.blast * 0.78,
    xpMul: (1 + 0.16 * lv('clover')) * S.xp,
    pickup: 130 + 40 * lv('magnet') + S.pickup,
    /* 【2.6 平衡】全局伤害倍率 1.20 → 0.82。 */
    dmgMul: 0.82 * C.dmg * (1 + 0.11 * lv('glove')) * S.dmg
            * (1 + growBonus + fleshMassBonus
               + (P && P.sacStack ? P.sacStack * 0.02 : 0)
               + (beastTier >= 3 ? petCountLive() * 0.06 : 0)
               + (relic('beastheart') ? petCountLive() * 0.05 : 0)),
    /* 游侠：所有投射武器常驻 +1 弹道（角色自带的，不需要叠层） */
    multi: lv('multi') + S.multi + (C.projBonus || 0) + (barrageTier >= 2 ? 1 : 0),
    pierce: lv('pierce') + S.pierce + (pierceTier >= 1 ? 1 : 0),
    armor: armorVal,
    /* 护盾上限要用同一条护甲点数（见 41-resources 的 shieldMaxNow） */
    armorPts: armorPts,
    /* 【2.6】暴击率必须有上限：多个来源简单相加会溢出到 1.0 以上。 */
    crit: Math.min(0.95, Math.max(0, C.crit + 0.07 * lv('crit') + 0.03 * lv('luckgem') + S.crit + (P && P.critBonus ? P.critBonus : 0) + (critTier >= 1 ? 0.05 : 0))),
    critMul: C.critMul + 0.26 * lv('critdmg') + 0.20 * lv('razor') + 0.08 * lv('luckgem') + (S.critMul - 1) + (critTier >= 2 ? 0.25 : 0),
    /* 【3.3】角色自带闪避：游侠 5%。"靠躲不靠血"必须写进数值，
       否则调低血量只是单纯削弱，玩家读不到补偿。 */
    /* 【4.0】闪避改成**乘法合并**（见 avoidStack）：多来源不再叠加到 30% 封顶，
       而是各自独立"躲一次"。四个 7% 是 25%，七个是 40%，永远涨、永远不到 100%。 */
    dodge: avoidStack([C.dodge || 0, 0.07 * lv('dodge'), 0.05 * lv('swerve'), S.dodge]),
    /* 反伤：先有来源才有反伤，之后按"最大生命 1.4% + 护甲"跟着进度长。 */
    thorns: (function(){
      let base = 8 * lv('plate') + 14 * lv('thorn') + S.thorns;
      if(C.thornsArmor) base += 12;
      if(base <= 0) return 0;
      return (base + maxHpVal * 0.024 + armorVal * 120
        + (C.thornsArmor ? armorVal * 90 : 0)) * (thornTier >= 1 ? 1.25 : 1);
    })(),
    thornCrit: S.thornCrit || (thornTier >= 2 ? 1 : 0),
    knock: 10,
    luck: (C.luck || 1) + 0.25 * lv('lucky'),
    bossMul: 1 + 0.11 * lv('bossmul'),
    regenLv: lv('regen'),
    regenMul: S.regenMul,
    /* 系统加成 */
    petMul: S.petDmg * (beastTier >= 1 ? 1.15 : 1) * (1 + 0.12 * lv('beastgem')),
    summonMul: 1,
    turretRate: S.turretRate * (turretTier >= 2 ? 1.15 : 1),
    elemDur: S.elemDur * (elemTier >= 1 ? 1.25 : 1) * (1 + 0.12 * lv('elemgem')),
    enemySpeed: S.enemySpeed,
    /* 火候：燃烧伤害与持续时间；冷冻：冰伤、冻结目标易伤；电网：感电跳数 */
    burnMul: (heatTier >= 1 ? 1.30 : 1) * (S.burnMul0 || 1),
    iceMul: (freezeTier >= 1 ? 1.30 : 1) * (S.iceMul0 || 1),
    frozenVuln: (freezeTier >= 3 ? 0.40 : 0),
    chainJump: (gridTier >= 1 ? 1 : 0),
    heatTier: heatTier,
    freezeTier: freezeTier,
    gridTier: gridTier,
    pierceTier: pierceTier,
    explodeChain: 0,
    orbitMul: 1,
    meleeMul: 1,

    /* ================= 3.0 通用资源 ================= */
    rageGain: (C.rageGain || 1) * (1 + 0.15 * lv('ragegem')) * S.rageGain
              * (rageTier >= 1 ? 1.20 : 1),
    rageDur: Math.max(1.2, RES.berserkBase + (C.berserkBonus || 0) + S.rageDur
              + (rageTier >= 2 ? 1.5 : 0)),
    rageDecay: S.rageDecay,
    berserkDmg: 1.45 + (C.berserkDmg || 0),
    berserkRate: (C.berserkRate || 0.62) * (relic('rageburst') ? 0.90 : 1),
    chargeRate: (1 + 0.15 * lv('chargegem')) * S.chargeRate
              * (chargeTier >= 1 ? 1.25 : 1),
    overloadDur: RES.overloadBase + S.overloadDur,
    shieldMax: (35 * lv('shieldgem') + S.shieldMax) * (shieldTier >= 1 ? 1.25 : 1),
    fleshPct: 0.004 * lv('fleshgem') + S.fleshPct + (fleshTier >= 2 ? 0.01 : 0),
    healMul: S.healMul * (fleshTier >= 3 ? 1.30 : 1),
    killHealMul: S.killHealMul,
    /* 【4.1】新机制相关（破韧已删除，换成冲刺四件套） */
    dashExtra: S.dashExtra || 0,
    dashImpact: S.dashImpact || 0,
    dashCd: (S.dashCd || 1) * Math.pow(0.92, lv('dashgem')),
    dashFlowBonus: S.dashFlowBonus || 0,
    dashDmgBonus: S.dashDmgBonus || 0
  };
}

/* 场上存活炮台 / 宠物数量（getStats 里要用，避免循环依赖） */
function turretCountLive(){
  if(typeof allies === 'undefined' || !allies) return 0;
  let n = 0;
  for(let i = 0; i < allies.length; i++) if(!allies[i].dead && allies[i].kind === 'turret') n++;
  return n;
}
function petCountLive(){
  if(typeof allies === 'undefined' || !allies) return 0;
  let n = 0;
  for(let i = 0; i < allies.length; i++) if(!allies[i].dead && allies[i].kind === 'pet') n++;
  return n;
}

/* 【4.1】召唤物的"护卫点数"。
   ---------------------------------------------------------
   旧写法是 min(18, 炮台×4.5) 和 min(8, 宠物×2)：
   多摆一座炮台、多带一只宠物，在某个点之后对生存**完全没有任何意义**。
   现在：
     · 第 k 个护卫给 v/(1+0.38k) 点 —— 越多人分，每个人分到的越少；
     · 炮台只有在**你身边 170px 内**才算（它是阵地，不是随身挂件），
       于是"站在自己阵地里打"变成一个真实的防御决策；
     · 饲养员的宠物是"肉盾"这件事从此有了准确的数值：
       每只给 5 点（其它角色 2.1 点），不再是一个 ×0.72 的隐形乘数。
   全部并入 armorPts，走同一条 armorDR 曲线。 */
function guardPtsAll(){
  if(typeof allies === 'undefined' || !allies || !P) return 0;
  const petEach = (CHAR && CHAR.guardByPets) ? 5.0 : 2.1;
  let kt = 0, kp = 0, sum = 0;
  for(let i = 0; i < allies.length; i++){
    const a = allies[i];
    if(a.dead) continue;
    if(a.kind === 'turret'){
      const dx = a.x - P.x, dy = a.y - P.y;
      if(dx * dx + dy * dy > 170 * 170) continue;
      sum += 4.6 / (1 + 0.38 * kt);
      kt++;
    } else if(a.kind === 'pet'){
      sum += petEach / (1 + 0.42 * kp);
      kp++;
    }
  }
  return sum;
}

/* 射程：基础值 → 随武器等级微涨 → 乘上射程结晶 */
function wRange(base, lv){
  const k = 1 + 0.045 * (Math.max(1, lv || 1) - 1);
  /* 【2.6 平衡】射程整体 ×0.86：场地 1720×1000、视野 640×360，
     原来的射程基本等于"覆盖整个视野"，怪没有接近过程可言。 */
  return base * k * ((ST && ST.range) ? ST.range : 1) * 0.86;
}

/* 升级所需经验 */
function nextXp(lv){
  /* 【2.6 修复】原来只读 P.level。而 resetGame 是在"上一局的 P 还活着"的时候
     就构造新 P 的（xpNext: nextXp() 写在对象字面量里），于是新一局开局
     的经验需求直接沿用上一局 70 级的数值——重开后第一级要几万经验。
     现在允许显式传等级，resetGame 传 1。 */
  const L = lv || (P ? P.level : 1);
  /* 前期便宜（前 10 级节奏快，爽点来得早），12 级之后逐级变贵，
     把一局 30+ 次弹窗压到 18 次左右——升级是决策，不是打扰。 */
  /* 【2.6】后期需求降到原来的约 40%：原来 Lv30→31 要 1.6 万经验，
     而怪物经验倍率 10 分钟只涨 5.5 倍，缺口 5 倍——
     直接后果就是"武器升不满、永远差一两张卡"。 */
  const base = 22 + 14 * L + 3.4 * Math.pow(L, 1.7);
  const late = 1 + Math.max(0, L - 12) * 0.12;
  return Math.round(base * late * 1.25);
}

/* 每次升级 */
function onLevel(){
  /* 【5.0】每级生命 6 → 13。
     ---------------------------------------------------------
     3.3 把每级生命从 9 砍到 6，理由是"白送生命让敌人平伤失效"。
     那句话在当时的数值下成立，但它建立在**怪物伤害几乎没有成长**之上：
     史莱姆一口 7 点，升一级白送 6 点血当然显得很多。

     5.0 把怪物基础伤害提高了 3~4 倍（史莱姆 26、重甲 58），
     并且攻击曲线从 8.65 倍压到 2.45 倍——伤害是真的会长在玩家身上。
     这时候 +6/级就不够了：Lv16 才 396 血，而一口围攻能咬掉 130。
     玩家会死在"血条根本没长起来"上，而不是死在"构筑没成型"上。

     +13/级 对应 Lv30 约 690 血、Lv50 约 950 血，
     配合 2.45 倍的攻击曲线，"一口占多少血"全程稳定在 8%~12%，
     护甲、闪避、治疗才有可以计算的基线。 */
  P.maxHp += 13;
  P.hp = Math.min(P.maxHp, P.hp + 13);
  ST = getStats();
  /* 【抄 DRG: Survivor 的 Overclock】每 5 级白送一个武器改造。
     等级奖励不该只有"多一张卡"，要有一个确定的、越来越强的节奏点。 */
  if(P.level % 8 === 0) grantFreeMod('超频');
  /* 【4.2】护盾不再自然回充。升级只补 20%（不是回满）——
     回满会让高等级工程师变成"每 10 秒一条满盾"，永远打不穿。
     补给要"够用但不无限"，护盾破了才该真的紧张。 */
  if(hasShield() && typeof shieldMaxNow === 'function'){
    P.shield = Math.min(shieldMaxNow(), (P.shield || 0) + shieldMaxNow() * 0.20);
  }
}

/* 随机给一把手上的武器塞一个它还没有的改造 */
function grantFreeMod(tag){
  /* 全局上限 4 个白送改造；单把武器最多 3 条（Lv2 / Lv4 两条 + 最多 1 条额外）。
     不设上限的话，光靠升级和精英就能把一把武器塞成"词条怪"。 */
  P.freeMods = P.freeMods || 0;
  if(P.freeMods >= 4) return;
  const cands = [];
  for(const id in P.weapons){
    const w = WEAPONS[id];
    if(!w) continue;
    const own = P.wmod[id] || [];
    const pool = (w.mods || []).concat(SCHOOL_MODS[w.school] || []);
    for(let i = 0; i < pool.length; i++){
      if(own.indexOf(pool[i]) < 0 && cands.indexOf(pool[i]) < 0) cands.push(pool[i]);
    }
    if(cands.length) break;
  }
  if(!cands.length) return;
  const modId = pickOne(cands);
  const owners = [];
  for(const id in P.weapons){
    const w = WEAPONS[id];
    if(!w) continue;
    const own = P.wmod[id] || [];
    const pool = (w.mods || []).concat(SCHOOL_MODS[w.school] || []);
    if(pool.indexOf(modId) >= 0 && own.indexOf(modId) < 0) owners.push(id);
  }
  if(!owners.length) return;
  const wid = pickOne(owners);
  if((P.wmod[wid] || []).length >= 3) return;
  P.wmod[wid] = (P.wmod[wid] || []).concat([modId]);
  P.freeMods++;
  showToast('⚡ ' + tag + '：' + WEAPONS[wid].name + ' 获得「' + (MODS[modId] ? MODS[modId].name : modId) + '」');
  sfx('awaken');
  buildInv();
}

function addShake(v){
  if(state.shakeCd > 0) return;
  state.shakeCd = 0.32;      /* 约 3 次/秒；0.16 秒时是 6 次/秒，等于常驻抖动 */
  state.shake = Math.min(5.5, Math.max(state.shake, v));
}

/* 击杀回血统一入口：所有来源（吸血结晶 / 血牙 / 血誓）共用每秒预算，
   避免"某个遗物没有上限、另一个被卡死"的问题 */
/* ---------------------------------------------------------
   击杀回血（重构）
   ---------------------------------------------------------
   旧版的两个上限互相打架：
     · 单次最多 0.30% —— 但实测 2 分钟后每秒击杀 11.6 只，
       11.6 × 0.30% = 3.5%/秒，永远先撞上限 → 单次限制形同虚设；
     · 每秒最多 0.90% —— 这才是真正生效的值，等于"恒定回血"，
       跟杀多少只怪完全无关，"击杀回血"这个名字是骗人的。
   现在改成按击杀数计价：
     每杀 1 只回 0.05% 最大生命，加成来源叠在"每杀"上，
     每秒上限 1.0%。
   实测 400 血、12 杀/秒 ≈ 2.4 血/秒 = 0.6%/秒，上限留出约 1.7 倍余量，
   只有满屏连锁才能撞顶——"多杀多回、少杀少回"才是真的。
   血牙从 +0.4%/杀 砍到 +0.15%/杀：旧值等于基础值的 5 倍，
   一件普通遗物直接让回血预算翻 6 倍，是"零投入不死流"的主因。
   --------------------------------------------------------- */
/* 【5.0】0.07% → 0.035%。击杀回血是唯一"越打越回"的来源，
   后期每秒十几杀时它自己就能把治疗桶顶满（0.7%/秒），
   等于所有清场快的角色都自带常驻回血。砍半之后它仍是主要续航，
   但不再是一张免费血包。 */
const KILL_HEAL_PER_KILL = 0.00035;

/* ---------------------------------------------------------
   统一治疗预算（2.6 的结构性修复）
   ---------------------------------------------------------
   2.5 之前每个治疗来源各自为政：击杀回血有自己的每秒上限，
   厨师的反应回血、愈合结晶、近战吸血、升级回血全都绕过它。
   于是"治疗总量"只受**触发次数**约束，而后期元素反应每秒几十次，
   峰值能回 10% 最大生命/秒——比任何伤害来源都快，血条自然永远满。
   只调系数永远调不好："触发次数"这个乘数会跟着伤害一起涨。

   病根不在某个系数，而在"治疗没有时间维度"。
   现在所有被动治疗共用一个池：
     · 容量 = 1 秒的量（不许囤积）
     · 回补 = 每秒 2% 最大生命（约 50 秒回满）
   要判断续航够不够，只看这一个数，不用再追八条路径。
   --------------------------------------------------------- */
/* ---------------------------------------------------------
   【4.0】治疗：从"硬闸门"改成"软预算"（边际递减）
   ---------------------------------------------------------
   2.6 的做法是给被动治疗一个容量 1.6%/秒的池子，回满就一滴都进不来。
   它确实拦住了"无限续航"，但同时把"堆治疗"这条构筑线也一起拦死了：
   超过 1.6%/秒的部分全部作废，玩家再拿治疗遗物等于拿空气。

   现在改成：效率 = 1 / (1 + 近期回血速度 / 预算)。
     回血速度 ≈ 预算的一半时，效率 67%；
     回血速度 ≈ 预算的 2 倍时，效率 33%；
     全靠触发堆出来的 10%/秒，落地只剩 2.4%/秒左右。
   没有墙，只有越来越贵——投入治疗的边际收益递减，但永远不是 0。
   --------------------------------------------------------- */
const HEAL_POOL_PER_SEC = ECO.healBudget;

function healPoolCap(){ return (P ? P.maxHp : 100) * ECO.healBudget; }

function drawHealPool(amount){
  if(!P || !(amount > 0) || P.hp >= P.maxHp) return 0;
  amount *= (ST && ST.healMul) ? ST.healMul : 1;
  /* 【5.0 结构修复】这里原来是一段"边际递减"的效率公式：
       eff = 1 / (1 + 近期回血速度 / 预算)
     它的本意是"越刷越贵"，但数学上根本不收敛到预算：
     设每次请求 A、每帧结算，稳态吞吐解出来是 √(A·预算/Δt)，
     预算 1.7 HP/s 时会稳定在 8~10 HP/s —— 也就是**完全不生效**。
     这就是"骑士受伤 9.54/秒、回血 9.51/秒，永远打不死"的真正原因：
     治疗池写着 0.28%/秒，实际放行了 1%/秒以上。

     现在改成真正的令牌桶（文档里一直是这么写的，只是代码没照做）：
       · 桶容量 = 1 秒的预算量
       · 每秒回补 healRefill 倍（1.6 倍 → 攒得比用得稍快，允许短时爆发）
       · 单次请求能拿走的永远不会超过桶里剩下的
     于是"持续治疗上限"第一次真的是 healBudget，可以被测量、可以被平衡。 */
  const dt = state._dt || (1 / 60);
  const cap = healPoolCap();
  if(state.healPool === undefined) state.healPool = cap;
  const give = Math.min(amount, state.healPool, P.maxHp - P.hp);
  if(give <= 0) return 0;
  state.healPool -= give;
  state.healRate = give / dt;
  P.hp += give;
  state.healAcc = (state.healAcc || 0) + give;
  return give;
}

/* 治疗池每帧回补：**必须在主循环里跑**，而不是"下次有人要治疗时才补"。
   懒回补的后果是"打完一波停 3 秒，再治疗仍然只拿到一帧的量"，
   体感上就是"明明脱战了很久，回血还是没恢复"。 */
function healPoolTick(dt){
  if(!P) return;
  const cap = healPoolCap();
  if(state.healPool === undefined){ state.healPool = cap; return; }
  state.healPool = Math.min(cap, state.healPool + cap * (ECO.healRefill || 1.6) * dt);
}

/* 主动奖励（血包）不走预算池：是玩家自己捡回来的，不该被限速 */
function healRaw(amount){
  if(!P || !(amount > 0) || P.hp >= P.maxHp) return 0;
  const h = Math.min(amount, P.maxHp - P.hp);
  P.hp += h;
  state.healAcc = (state.healAcc || 0) + h;
  return h;
}

/* 每次击杀应该回多少（把所有加成算在"每杀"上） */
function killHealAmount(){
  if(!P) return 0;
  /* 【2.6】口径统一：只有"结晶 / 角色 buff"走加法，装备走倍率。
     原来血牙写 +0.15%、结晶写 +0.02%/级、赌徒 +0.18%，三个并列的百分比
     在描述里各说各话（血牙还写着 0.4%），玩家根本算不清自己每杀回多少。
     现在：基础 0.05% → 加结晶与 buff → 再乘血牙(×2) / 血誓(×2.4)。 */
  let per = KILL_HEAL_PER_KILL;
  per += 0.0002 * ((P.passives && P.passives.vamp) || 0);           /* 吸血结晶：+0.02%/级 */
  per += (P.killHealBonus || 0);                                   /* 赌徒押注等临时加成 */
  per *= (ST && ST.killHealMul) ? ST.killHealMul : 1;              /* 血之泉 */
  if(relic('fang')) per *= 2;                                      /* 血牙：击杀回血翻倍 */
  if(relic('bloodoath')) per *= 2.4;                               /* 血誓 */
  return P.maxHp * per;
}

function drawKillHeal(amount){
  /* 击杀回血不再单独维护预算，统一进治疗池 */
  return drawHealPool(amount);
}

/* 回血统一入口：所有被动治疗（击杀 / 反应 / 愈合结晶 / 近战吸血）都从这里走 */
function healPlayer(amount){
  return drawHealPool(amount);
}

/* ---------------------------------------------------------
   状态 tick：灼烧 / 中毒 / 冰缓 / 感电
   --------------------------------------------------------- */
function tickStatus(e, dt){
  const st = e.st;
  /* 【P0 修复】回旋披萨刀给每只怪打的 e.pizzaCd 从来没有人递减，
     于是每只怪只会被切一次，之后永久免疫——45 秒里只打出 304 点伤害。
     冷却必须在这里衰减，否则"持续旋转切割"其实是一次性伤害。 */
  /* 【5.0】「标记」易伤：6 秒后消失，层数一起清掉 */
  if(e.markT > 0){
    e.markT -= dt;
    if(e.markT <= 0){ e.markT = 0; e.markN = 0; }
  }
  if(e.pizzaCd > 0) e.pizzaCd -= dt;
  if(e.knockCd > 0) e.knockCd -= dt;
  /* 【4.0】咬击节奏：接触攻击的冷却**全局**走，不再只在贴身时递减。
     以前它只在 applyContact 里 tick，结果一只怪从远处走过来时冷却一直是满的，
     一群怪同时抵达就同时开咬——"怪潮"变成了瞬间爆发伤害。
     现在每只怪的节奏从出生起就一直在走，贴身才有机会咬，密度随登场顺序自然摊开。 */
  if(!st) return;
  if(st.reactCd > 0) st.reactCd -= dt;

  if(st.fire > 0){
    st.fire -= dt;
    if(st.fireDmg > 0){
      dealDamage(e, st.fireDmg * dt * (ST.burnMul || 1), { src:'burn', dot:true, canCrit:false });
      if(e.dead) return;
    }
    if(Math.random() < dt * 6) burst(e.x, e.y - 2, '#ff8a3d', 1, 40, -0.4);
  }
  if(st.venom > 0){
    st.venom -= dt;
    if(st.venomDmg > 0){
      dealDamage(e, st.venomDmg * dt, { src:'venom', dot:true, canCrit:false });
      if(e.dead) return;
    }
    if(Math.random() < dt * 4) burst(e.x, e.y - 2, '#a6e05a', 1, 34, -0.3);
  }
  if(st.bleed > 0){
    st.bleed -= dt;
    if(st.bleedDmg > 0){
      dealDamage(e, st.bleedDmg * dt, { src:'bleed', dot:true, canCrit:false });
      if(e.dead) return;
    }
    if(Math.random() < dt * 5) burst(e.x, e.y - 2, '#ff4d6d', 1, 34, -0.5);
  }
  if(st.ice > 0){
    st.ice -= dt;
    if(st.ice <= 0) e.slowT = 0;
  }
  if(st.volt > 0){
    st.volt -= dt;
    if(Math.random() < dt * 3) burst(e.x, e.y - 2, '#ffe066', 1, 46, -0.2);
  }
}
/* =========================================================
   7. 音频：音效总线 + 芯片音乐 BGM
   ---------------------------------------------------------
   所有声音都是 WebAudio 现场合成：一个振荡器 + 一段噪声就能
   做出"塑料感"的 8-bit 味道。2.0 新增了元素反应、召唤、遗物、
   觉醒等音色，并用"每音色独立冷却"避免满屏连锁时糊成白噪音。
   ========================================================= */
let AC = null, masterGain = null, sfxGain = null, bgmGain = null;
let muted = false, lastSfx = 0;

let audioDead = false;
function audioInit(){
  if(AC) return AC;
  if(audioDead) return null;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(AC.destination);

    sfxGain = AC.createGain();
    sfxGain.gain.value = 1;
    sfxGain.connect(masterGain);

    bgmGain = AC.createGain();
    bgmGain.gain.value = 0.0001;
    bgmGain.connect(masterGain);
  }catch(e){ AC = null; audioDead = true; }
  return AC;
}

/* 每个音色的独立冷却，避免满屏触发时糊成噪音 */
const SFX_CD = Object.create(null);

function sfx(type){
  if(muted) return;
  const def = SFX_DEF[type];
  if(!def) return;
  const now = performance.now();
  if(now - lastSfx < 20) return;
  const cd = def.cd || 40;
  if(SFX_CD[type] && now - SFX_CD[type] < cd) return;
  if(!audioInit()) return;
  try{
    if(AC.state === 'suspended') AC.resume();
    SFX_CD[type] = now;
    lastSfx = now;
    const t0 = AC.currentTime;
    tone(def.f0, def.f1, t0, def.dur, def.wave, def.vol);
    if(def.n) noise(t0, def.n.dur, def.n.vol, def.n.hp, def.n.lp);
    if(def.second){
      const s = def.second;
      tone(s.f0, s.f1, t0 + (s.delay || 0.08), s.dur, s.wave, s.vol);
    }
  }catch(e){ /* 忽略音频错误 */ }
}

function tone(f0, f1, when, dur, wave, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave || 'square';
  o.frequency.setValueAtTime(f0, when);
  o.frequency.exponentialRampToValueAtTime(Math.max(25, f1), when + dur);
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(when); o.stop(when + dur + 0.02);
}

function noise(when, dur, vol, hp, lp){
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter();
  if(lp){ f.type = 'lowpass'; f.frequency.value = lp; }
  else { f.type = 'highpass'; f.frequency.value = hp || 3000; }
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(sfxGain);
  src.start(when);
}

/* --- 芯片音乐：C 大调 I–V–vi–IV，按幕逐层加入声部 --- */
const BGM = {
  bpm: 146,
  step: 0,
  next: 0,
  timer: null,
  on: false,
  act: 1,
  /* 【2.6】两段进行交替（A 段偏大调、B 段偏小调），16 小节一轮，
     原来只有 4 个和弦、32 步无限循环，听两分钟就开始腻。
     A: C - G - Am - F - C - G - F - G
     B: Am - F - C - G - Am - Dm - F - G */
  progA: [
    [60, 64, 67, 72],
    [55, 59, 62, 67],
    [57, 60, 64, 69],
    [53, 57, 60, 65],
    [60, 64, 67, 72],
    [55, 59, 62, 67],
    [53, 57, 60, 65],
    [55, 59, 62, 67]
  ],
  progB: [
    [57, 60, 64, 69],
    [53, 57, 60, 65],
    [60, 64, 67, 72],
    [55, 59, 62, 67],
    [57, 60, 64, 69],
    [62, 65, 69, 74],
    [53, 57, 60, 65],
    [55, 59, 62, 67]
  ],
  /* 四套旋律型轮换，避免每 8 拍都是同一句 */
  leadPats: [
    [0, 1, 2, 3, 2, 3, 1, 2],
    [0, 2, 1, 3, 2, 0, 3, 1],
    [3, 2, 1, 0, 1, 2, 3, 2],
    [0, 1, 3, 2, 3, 1, 2, 0]
  ],
  vol: 0.22,
  boss: false
};

function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }

function bgmTone(freq, when, dur, wave, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave;
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(bgmGain);
